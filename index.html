<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aproximación al Lead Sheet - Acordes y Progresiones</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    height: {
                        'dvh': '100dvh'
                    }
                }
            }
        }
    </script>
    
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .measure-box {
            transition: all 0.15s ease-in-out;
            min-height: 50px; 
            height: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .measure-box:hover {
            border-color: #3b82f6 !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .measure-active {
            background-color: #eff6ff !important;
            border-color: #60a5fa !important;
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
            z-index: 10;
        }
        .dark .measure-active {
            background-color: #1e3a8a !important;
            border-color: #3b82f6 !important;
        }

        .repeat-start::before {
            content: ''; position: absolute; left: 4px; top: 15%; bottom: 15%; width: 4px;
            border-left: 3px solid #3b82f6; border-right: 1px solid #3b82f6; opacity: 0.8;
        }
        .repeat-start::after {
            content: ':'; font-weight: bold; font-size: 20px; line-height: 1;
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            color: #3b82f6; opacity: 0.8; font-family: serif;
        }
        
        .repeat-end::before {
            content: ''; position: absolute; right: 4px; top: 15%; bottom: 15%; width: 4px;
            border-right: 3px solid #3b82f6; border-left: 1px solid #3b82f6; opacity: 0.8;
        }
        .repeat-end::after {
            content: ':'; font-weight: bold; font-size: 20px; line-height: 1;
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            color: #3b82f6; opacity: 0.8; font-family: serif;
        }

        .chord-text {
            font-family: 'Courier New', Courier, monospace;
        }

        .coltrane-node { cursor: pointer; transition: transform 0.1s; }
        .coltrane-node:hover { transform: scale(1.05); }

        .coltrane-node .ii-v-bg {
            fill: transparent;
            rx: 6px;
            transition: all 0.15s ease;
        }
        
        .ii-v-text {
            fill: currentColor;
            transition: fill 0.15s ease;
        }

        .coltrane-node.active-node .ii-v-bg {
            fill: #fef08a !important;
            stroke: #eab308 !important;
            stroke-width: 2px;
        }
        .dark .coltrane-node.active-node .ii-v-bg {
            fill: #713f12 !important;
            stroke: #ca8a04 !important;
        }
        .coltrane-node.active-node .ii-v-text {
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-decoration-color: currentColor;
            fill: #0f172a !important; /* Force dark text for contrast on yellow background */
        }
        .dark .coltrane-node.active-node .ii-v-text {
            fill: #f8fafc !important; /* Bright text for contrast on dark yellow background */
        }
        
        .coltrane-node .tonic-circle {
            transition: all 0.2s ease;
        }
        .coltrane-node.active-node .tonic-circle {
            fill: currentColor !important;
            stroke-width: 4px;
            filter: drop-shadow(0 0 10px currentColor);
        }
        .coltrane-node.active-node .tonic-text {
            fill: white !important;
            font-weight: 900;
        }
        .dark .coltrane-node.active-node .tonic-text {
            fill: #0f172a !important; 
        }

        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #3b82f6; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #475569; }

        input:checked ~ .toggle-dot { transform: translateX(100%); background-color: #3b82f6; }
        input#globalTritoneToggle:checked ~ .toggle-dot { background-color: #f59e0b; }
        input:checked ~ .toggle-track { background-color: #dbeafe; }
        input#globalTritoneToggle:checked ~ .toggle-track { background-color: #fef3c7; }
        .dark input:checked ~ .toggle-track { background-color: #1e3a8a; }
        .dark input#globalTritoneToggle:checked ~ .toggle-track { background-color: #78350f; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
        
        @media (max-width: 640px) {
            .measure-box { min-height: 40px; padding: 0.1rem; }
            .section-label { font-size: 8px; padding: 1px 3px; }
            .measure-number { font-size: 8px; top: 2px; left: 4px; }
            .repeat-start::after, .repeat-end::after { font-size: 14px; left: 4px; right: 4px;}
            .repeat-start { padding-left: 0.6rem; }
            .repeat-end { padding-right: 0.6rem; }
            
            .controls-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.25rem;
                width: 100%;
            }
            .controls-full-width {
                grid-column: span 2;
            }
            .toggles-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                grid-column: span 2;
                padding-top: 0.25rem;
                border-top: 1px solid rgba(148, 163, 184, 0.2);
            }
        }
    </style>
</head>

        const noteLetters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

        const tritoneRootMap = {
            'C':'Gb', 'C#':'G', 'Db':'G', 'D':'Ab', 'D#':'A', 'Eb':'A',
            'E':'Bb', 'F':'B', 'F#':'C', 'Gb':'C', 'G':'Db', 'G#':'D',

        function getDisplayNote(noteStr, nodeId) {
            let n = noteStr.replace(/[0-9]/g, '');
            if (n === 'D#') n = 'Eb';
            if (n === 'A#') n = 'Bb';
            if (n === 'G#') n = 'Ab';
            
            if (window.svgEnharmonicOverrides && window.svgEnharmonicOverrides[nodeId]) {
                return enharmonicPairs[n] || n;
            }
            return n;
        }

        const cualidades = {
            "maj7": [0, 4, 7, 11], "m7": [0, 3, 7, 10], "7": [0, 4, 7, 10],
            "7(b9)": [0, 4, 7, 10, 13], "m7(b5)": [0, 3, 6, 10], "dim7": [0, 3, 6, 9],
            "o7": [0, 3, 6, 9], "maj": [0, 4, 7], "m": [0, 3, 7],
            "6": [0, 4, 7, 9], "m6": [0, 3, 7, 9], "aug": [0, 4, 8]
        };

        function parseNoteObj(noteStr) {
            const letter = noteStr.charAt(0);
            let accidental = 0;
            for (let i = 1; i < noteStr.length; i++) {
                if (noteStr[i] === '#') accidental++;
                if (noteStr[i] === 'b') accidental--;
            }
            return { letter, accidental, semitone: (baseSemitones[letter] + accidental + 12) % 12 };
        }

        function getTranspositionOffsets(baseKeyStr, targetKeyStr) {
            const base = parseNoteObj(baseKeyStr);
            const target = parseNoteObj(targetKeyStr);
            let stOffset = target.semitone - base.semitone;
            let letterOffset = noteLetters.indexOf(target.letter) - noteLetters.indexOf(base.letter);
            if (stOffset < 0) stOffset += 12;
            if (letterOffset < 0) letterOffset += 7;
            return { stOffset, letterOffset };
        }

        function transposeRoot(rootStr, stOffset, letterOffset) {
            const parsed = parseNoteObj(rootStr);
            const letterIdx = noteLetters.indexOf(parsed.letter);
            const newLetterIdx = (letterIdx + letterOffset + 7) % 7;
            const newLetter = noteLetters[newLetterIdx];
            const targetSemitone = (parsed.semitone + stOffset + 120) % 12; 
            const newLetterBaseSemitone = baseSemitones[newLetter];
            let accidentalNeeded = targetSemitone - newLetterBaseSemitone;
            if (accidentalNeeded > 6) accidentalNeeded -= 12;
            if (accidentalNeeded < -6) accidentalNeeded += 12;
            let result = newLetter;
            if (accidentalNeeded > 0) result += '#'.repeat(accidentalNeeded);
            if (accidentalNeeded < 0) result += 'b'.repeat(-accidentalNeeded);
            return result;
        }

        function transposeChordName(chordStr, stOffset, letterOffset) {
            if (chordStr === "NC" || chordStr === "-") return chordStr;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1];
            let quality = match[2];
            const newRoot = transposeRoot(root, stOffset, letterOffset);
            if (quality.includes('/')) {
                const qParts = quality.split('/');
                const newBass = transposeRoot(qParts[1], stOffset, letterOffset);
                quality = qParts[0] + '/' + newBass;
            }
            return newRoot + quality;
        }

        function convertToRoman(chordStr, keyStr) {
            if (chordStr === "NC" || chordStr === "-") return chordStr;
            
            const progIndex = progressionSelect.value;
            const progData = progressionLibrary[progIndex];
            const selectedVar = variationSelect ? variationSelect.value : "0";

            if (progData.id === "multitonic-coltrane") {
                return chordStr.replace('_SUB', '').replace(/_T\d|_V\d|_II\d/g, '');
            }

            const isSubbed = chordStr.includes('_SUB');
            let cleanStr = chordStr.replace('_SUB', '').replace(/_T\d|_V\d|_II\d/g, '');
            const match = cleanStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return cleanStr;
            
            const root = match[1];
            let quality = match[2];
            let cleanQual = quality.split('/')[0];

            let { stOffset } = getTranspositionOffsets(keyStr, root);
            let originalOffset = stOffset;
            if (isSubbed) originalOffset = (stOffset + 6) % 12;

            if (progData.id === "blues") {
                if (selectedVar !== "0") return cleanStr;
                if ((stOffset === 0 || stOffset === 5 || stOffset === 7) && cleanQual.startsWith("7") && !isSubbed) {
                    const romans = {0:"I7", 5:"IV7", 7:"V7"};
                    return romans[stOffset];
                }
                return cleanStr;
            }

            if (progData.id === "251-maj-all") {
                if (cleanQual === "m7" || cleanQual === "m9") return "IIm7";
                if (cleanQual.startsWith("7") || cleanQual.startsWith("9") || cleanQual.startsWith("13")) {
                    let tension = cleanQual.replace('7', '');
                    if (tension === "9" || tension === "13") tension = "";
                    return (isSubbed ? "subV7" : "V7") + tension;
                }
                if (cleanQual.startsWith("maj7") || cleanQual.startsWith("6")) return "Imaj7";
                return cleanStr;
            }

            if (progData.id === "251-min-all") {
                if (cleanQual === "m7(b5)") return "IIm7(b5)";
                if (cleanQual.startsWith("7") || cleanQual.startsWith("9") || cleanQual.startsWith("13")) {
                    let tension = cleanQual.replace('7', '');
                    if (tension === "9" || tension === "13") tension = "";
                    return (isSubbed ? "subV7" : "V7") + tension;
                }
                if (cleanQual.startsWith("m7") || cleanQual === "m") return "Im7";
                return cleanStr;
            }

            let isDominantChord = (cleanQual.startsWith('7') || cleanQual.startsWith('9') || cleanQual.startsWith('13')) 
                && !cleanQual.includes('maj') && !cleanQual.includes('m') && !cleanQual.includes('dim') && !cleanQual.includes('o');
            
            let isDim = cleanQual.includes('dim') || cleanQual.includes('o');
            if (isDim && originalOffset === 6) return "#IVdim7";

            const romanNumerals = ["I", "bII", "II", "bIII", "III", "IV", "bV", "V", "bVI", "VI", "bVII", "VII"];

            if (isDominantChord) {
                let targetNum = null;
                if (originalOffset === 0) targetNum = "IV";
                else if (originalOffset === 2) targetNum = "V";
                else if (originalOffset === 4) targetNum = "VI";
                else if (originalOffset === 9) targetNum = "II";
                else if (originalOffset === 11) targetNum = "III";
                else if (originalOffset === 7) return (isSubbed ? "subV7" : "V7");

                if (targetNum) {
                    let tension = cleanQual.replace('7', '');
                    if (tension === "9" || tension === "13") tension = "";
                    let prefix = isSubbed ? "subV7" : "V7";
                    return `${prefix}${tension}/${targetNum}`;
                }
            }

            return romanNumerals[stOffset] + quality;
        }

        const midiToNoteName = (midi) => {
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        function computeNextVoicing(chordStr, prevMidiNotes) {
            let cleanChord = chordStr.replace(/_SUB|_T\d|_V\d|_II\d/g, '');
            let rootMatch = cleanChord.match(/^([A-G][#b]*)/);
            if (!rootMatch) return { midi: [], toneNames: [], bassNote: "C2" };
            
            let rootStr = rootMatch[1];
            let rest = cleanChord.substring(rootStr.length);
            let bassStr = rootStr;
            let quality = "maj"; 
            
            if (rest.includes('/')) {
                let parts = rest.split('/');
                quality = parts[0] === "" ? "maj" : parts[0];
                bassStr = parts[1];
            } else {
                quality = rest === "" ? "maj" : rest;
            }
            
            let intervals = cualidades[quality] || [0, 4, 7];
            let parsedRoot = parseNoteObj(rootStr);
            let rootMidi = 60 + parsedRoot.semitone; 
            if (parsedRoot.semitone > 6) rootMidi -= 12; 
            
            let rawMidi = intervals.map(iv => rootMidi + iv);
            
            if (prevMidiNotes && prevMidiNotes.length > 0) {
                let prevCenter = prevMidiNotes.reduce((a, b) => a + b, 0) / prevMidiNotes.length;
                rawMidi = rawMidi.map(note => {
                    let normalizedNote = note % 12;
                    let targetOctave = Math.floor(prevCenter / 12);
                    let c1 = (targetOctave * 12) + normalizedNote;
                    let c2 = ((targetOctave + 1) * 12) + normalizedNote;
                    let c3 = ((targetOctave - 1) * 12) + normalizedNote;
                    let d1 = Math.abs(c1 - prevCenter);
                    let d2 = Math.abs(c2 - prevCenter);
                    let d3 = Math.abs(c3 - prevCenter);
                    if (d1 <= d2 && d1 <= d3) return c1;
                    if (d2 <= d1 && d2 <= d3) return c2;
                    return c3;
                });
                rawMidi = [...new Set(rawMidi)].sort((a, b) => a - b);
            }
            
            let toneNames = rawMidi.map(m => midiToNoteName(m));
            let parsedBass = parseNoteObj(bassStr);
            let bassMidi = 36 + parsedBass.semitone; 
            if (parsedBass.semitone > 5) bassMidi -= 12; 
            return { midi: rawMidi, toneNames: toneNames, bassNote: midiToNoteName(bassMidi) };
        }

        function isDominant(chordStr) {
            if (chordStr === "NC" || chordStr === "-") return false;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return false;
            const mainQuality = match[2].split('/')[0].replace(/_T\d|_V\d|_II\d/g, '').replace('_SUB', '');
            return (mainQuality.startsWith('7') || mainQuality.startsWith('9') || mainQuality.startsWith('13')) 
                && !mainQuality.includes('maj') && !mainQuality.includes('m') && !mainQuality.includes('dim') && !mainQuality.includes('o');

            if (!match) return chordStr;
            const root = match[1];
            let quality = match[2];
            if (quality.includes('/')) quality = quality.split('/')[0]; 
            const newRoot = tritoneRootMap[root] || root;
            return newRoot + quality;
        }

        function loadAndCompileProgression(preserveOverrides = false) {
            if (!preserveOverrides) tritoneOverrides = {};

            const progIndex = progressionSelect.value || (document.getElementById('progressionSelectMobile') && document.getElementById('progressionSelectMobile').value) || 0;
            const targetKey = keySelect.value || (document.getElementById('keySelectMobile') && document.getElementById('keySelectMobile').value) || "C";
            const progData = progressionLibrary[progIndex];
            
            const vContainer = document.getElementById('variationContainer');
            const vSelect = document.getElementById('variationSelect');
            const vContainerMobile = document.getElementById('variationContainerMobile');
            const vSelectMobile = document.getElementById('variationSelectMobile');

            if (progData.variations) {
                if (vContainer) { vContainer.classList.remove('hidden'); vContainer.classList.add('flex'); }
                if (vContainerMobile) { vContainerMobile.classList.remove('hidden'); vContainerMobile.classList.add('flex'); }
                
                if (vSelect && vSelect.dataset.progId !== progData.id) {
                    vSelect.innerHTML = '';
                    if(vSelectMobile) vSelectMobile.innerHTML = '';
                    progData.variations.forEach((v, idx) => {
                        const opt = document.createElement('option'); opt.value = idx; opt.textContent = (idx + 1).toString();
                        vSelect.appendChild(opt);
                        if(vSelectMobile) {
                            const optMobile = document.createElement('option'); optMobile.value = idx; optMobile.textContent = (idx + 1).toString();
                            vSelectMobile.appendChild(optMobile);
                        }
                    });
                    if (vSelect) vSelect.dataset.progId = progData.id;
                    if (vSelectMobile) vSelectMobile.dataset.progId = progData.id;
                    if (vSelect) vSelect.value = 0; 
                    if (vSelectMobile) vSelectMobile.value = 0; 
                }
                
                const selectedVar = vSelect ? vSelect.value : (vSelectMobile ? vSelectMobile.value : 0);
                progData.sections = progData.variations[selectedVar];
            } else {
                if (vContainer) { vContainer.classList.add('hidden'); vContainer.classList.remove('flex'); }
                if (vContainerMobile) { vContainerMobile.classList.add('hidden'); vContainerMobile.classList.remove('flex'); }
                if (vSelect) vSelect.dataset.progId = '';
                if (vSelectMobile) vSelectMobile.dataset.progId = '';
            }

            if (!manualKeyChange) {
                if (keySelect) keySelect.value = progData.baseKey;
                if (document.getElementById('keySelectMobile')) document.getElementById('keySelectMobile').value = progData.baseKey;
            }
            manualKeyChange = false; 

            const currentKey = keySelect ? keySelect.value : (document.getElementById('keySelectMobile') ? document.getElementById('keySelectMobile').value : "C");
            const { stOffset, letterOffset } = getTranspositionOffsets(progData.baseKey, currentKey);
            
            visualMeasures = [];
            audioTimeline = [];
            
            const coltraneContainer = document.getElementById('coltraneGraphicContainer');
            if (progData.id === "multitonic-coltrane") {
                if (coltraneContainer) coltraneContainer.classList.remove('hidden');
                renderColtraneGraphic(currentKey);
            } else {
                if (coltraneContainer) coltraneContainer.classList.add('hidden');
            }

            let audioUnrolledMeasures = [];
            let visualMap = []; 
            let currentVisualIndex = 0;

            progData.sections.forEach(sec => {
                const rawMeasures = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                const transposedMeasures = rawMeasures.map((mStr, mIdx) => {
                    return mStr.split(/\s+/).map((c, cIdx) => {
                        let transposed = transposeChordName(c, stOffset, letterOffset);
                        let visualMIdx = currentVisualIndex + mIdx;
                        let overrideKey = `${visualMIdx}_${cIdx}`;
                        
                        let isSubbed = globalTritone;
                        if (tritoneOverrides[overrideKey] !== undefined) isSubbed = tritoneOverrides[overrideKey];
                        
                        if (isSubbed && isDominant(transposed)) transposed = applyTritoneSub(transposed) + "_SUB";
                        return transposed;
                    });
                });

                transposedMeasures.forEach((chords, mIdx) => {
                    visualMeasures.push({
                        id: currentVisualIndex + mIdx,
                        chords: chords,
                        colorClass: sec.color || 'bg-white dark:bg-slate-800',
                        sectionName: mIdx === 0 ? sec.type : null,
                        hasRepeatStart: sec.repeat && mIdx === 0,
                        hasRepeatEnd: sec.repeat && mIdx === transposedMeasures.length - 1
                    });
                });

                transposedMeasures.forEach((chords, idx) => {
                    audioUnrolledMeasures.push(chords);
                    visualMap.push(currentVisualIndex + idx); 
                });

                if (sec.repeat) {
                    transposedMeasures.forEach((chords, idx) => {
                        audioUnrolledMeasures.push(chords);
                        visualMap.push(currentVisualIndex + idx);
                    });
                }
                currentVisualIndex += transposedMeasures.length;
            });

            let prevMidiNotes = null;
            audioUnrolledMeasures.forEach((measureChords, measureIndex) => {
                let measureStartStep = measureIndex * 8;

                measureChords.forEach((chord, chordIdx) => {
                    if (chord === "NC" || chord === "-") return;
                    let chordsInMeasure = measureChords.length;

                    let tagMatch = chord.match(/_(T\d|V\d|II\d)/i);
                    let specificNodeId = tagMatch ? tagMatch[1].toLowerCase() : null;

                    let notesData = computeNextVoicing(chord, prevMidiNotes);
                    prevMidiNotes = notesData.midi; 
                    
                    let stepOffset = (chordIdx * 4); 
                    let duration = chordsInMeasure === 2 ? "2n" : (chordsInMeasure === 4 ? "4n" : "1m");
                    let trimDuration = Tone.Time(duration).toSeconds() - 0.05;

                    audioTimeline[measureStartStep + stepOffset] = {
                        notes: notesData.toneNames,
                        bass: notesData.bassNote,
                        duration: trimDuration > 0 ? trimDuration : duration,
                        visualId: visualMap[measureIndex],
                        svgNodeId: specificNodeId
                    };
                    
                    if (chordsInMeasure === 2 && chordIdx === 0) {
                        audioTimeline[measureStartStep + 4] = null;
                    }
                });
            });

            totalSteps = audioUnrolledMeasures.length * 8;
            if (selectedStartMeasure >= visualMeasures.length) selectedStartMeasure = 0;
            renderGrid();
            updateStartMeasureLabel();
        }

        function renderGrid() {
            const grid = document.getElementById('chordGrid');
            if(!grid) return;
            grid.innerHTML = '';
            
            const progIndex = progressionSelect.value || (document.getElementById('progressionSelectMobile') && document.getElementById('progressionSelectMobile').value) || 0;
            const targetKey = keySelect.value || (document.getElementById('keySelectMobile') && document.getElementById('keySelectMobile').value) || "C";
            const progData = progressionLibrary[progIndex];
            const isColtrane = progData.id === "multitonic-coltrane";
            
            visualMeasures.forEach((vMeasure, index) => {
                const measureDiv = document.createElement('div');
                measureDiv.id = `measure-${vMeasure.id}`;
                
                let classNames = `measure-box ${vMeasure.colorClass} border border-slate-300 dark:border-slate-600 sm:rounded-xl rounded relative overflow-hidden`;
                
                if (vMeasure.hasRepeatStart) classNames += ' repeat-start text-blue-600';
                if (vMeasure.hasRepeatEnd) classNames += ' repeat-end text-blue-600';
                if (index === selectedStartMeasure) classNames += ' ring-2 ring-blue-500 bg-blue-50/40 dark:bg-blue-900/40';
                
                measureDiv.className = classNames;
                
                let rehearsalMarkHTML = '';
                if (vMeasure.sectionName) {
                    rehearsalMarkHTML = `<div class="absolute top-1 right-1 sm:right-2 text-[10px] font-bold text-blue-600 bg-blue-100 dark:bg-blue-900/60 px-1 rounded shadow-sm z-10">${vMeasure.sectionName}</div>`;
                }

                const processChord = (c, chordIdx, vMeasureId) => {
                    let color = "text-slate-800 dark:text-slate-100";
                    let isSubbed = c.includes('_SUB');
                    let isT1 = c.includes('_T1'), isT2 = c.includes('_T2'), isT3 = c.includes('_T3');
                    let rawChord = c; 
                    let cleanC = c.replace(/_T\d|_V\d|_II\d/g, '').replace('_SUB', '');
                    let isDom = isSubbed || isDominant(cleanC);

                    let text = cleanC;
                    if (romanMode && !isColtrane) {
                        text = convertToRoman(rawChord, targetKey); 
                    }

                    if (isSubbed) {
                        color = "text-amber-500 dark:text-amber-400 font-bold border-b-2 border-amber-500 border-dashed is-subbed is-dominant";
                    } else if (isT1) { 
                        color = "text-blue-500 font-black"; 
                    } else if (isT2) { 
                        color = "text-red-500 font-black"; 
                    } else if (isT3) { 
                        color = "text-amber-500 font-black"; 
                    } else if (isDom) {
                        color += " is-dominant";
                    }

                    let interactiveClasses = "pointer-events-auto ";
                    let tooltip = "";
                    if (isDom) {
                        interactiveClasses += "cursor-pointer hover:text-amber-500 dark:hover:text-amber-400 transition-colors relative z-20";
                        tooltip = 'title="Clic para aplicar/quitar Sustituto Tritonal"';
                    }

                    return `<span class="chord-text text-sm sm:text-base md:text-xl lg:text-3xl font-bold tracking-tight ${color} ${interactiveClasses}" data-mid="${vMeasureId}" data-cid="${chordIdx}" ${tooltip}>${text}</span>`;
                };

                let measureChordsHTML = '';
                if(vMeasure.chords.length === 1) {
                    measureChordsHTML = processChord(vMeasure.chords[0], 0, index);
                } else if (vMeasure.chords.length === 2) {
                    measureChordsHTML = processChord(vMeasure.chords[0], 0, index) + processChord(vMeasure.chords[1], 1, index);
                } else {
                    measureChordsHTML = vMeasure.chords.map((c, i) => processChord(c, i, index)).join('');
                }
                
                measureDiv.innerHTML = `
                    <span class="measure-number absolute text-[8px] text-slate-400 font-mono z-10" style="top: 2px; left: 4px;">${index + 1}</span>
                    ${rehearsalMarkHTML}
                    <div class="flex flex-row items-center justify-center gap-1 sm:gap-3 w-full h-full whitespace-nowrap px-1">
                        ${measureChordsHTML}
                    </div>
                `;
                
                measureDiv.dataset.index = index;
                grid.appendChild(measureDiv);
            });
        }

        function updateStartMeasureLabel() {
            const indicator = document.getElementById('startMeasureIndicator');
            if (indicator) indicator.textContent = `Inicio: Compás ${selectedStartMeasure + 1}`;
        }

        function highlightMeasure(visualId) {
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            const activeEl = document.getElementById(`measure-${visualId}`);
            if (activeEl) activeEl.classList.add('measure-active');
        }

        function highlightSvgNode(nodeId) {
            document.querySelectorAll('.coltrane-node').forEach(el => el.classList.remove('active-node'));
            if (nodeId) {
                const activeNode = document.getElementById(`svg-node-${nodeId}`);
                if (activeNode) activeNode.classList.add('active-node');
            }
        }

        let piano, bassSynth;
        let isPlaying = false;
        let step = 0; 
        let audioInitialized = false;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            const chorus = new Tone.Chorus({ frequency: 2, delayTime: 3.5, depth: 0.3 }).start();
            const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 });
            reverb.wet.value = 0.2;

            piano = new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 2, modulationIndex: 1.2, oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 },
                modulation: { type: "triangle" }, modulationEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 }
            });
            
            bassSynth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.04, decay: 0.4, sustain: 0.3, release: 0.05 }
            });

            piano.chain(chorus, reverb, Tone.Destination);
            bassSynth.toDestination();

            Tone.Destination.volume.value = parseFloat(document.getElementById('volumeSlider') ? document.getElementById('volumeSlider').value : -6);

            Tone.Transport.scheduleRepeat((time) => {
                const currentStep = step % totalSteps; 
                const event = audioTimeline[currentStep];
                
                if (currentStep % 8 === 0) {
                    let currentMeasureEvent = audioTimeline[currentStep];
                    if (currentMeasureEvent) Tone.Draw.schedule(() => highlightMeasure(currentMeasureEvent.visualId), time);
                }

                if (event !== undefined) {
                    if (event && event.svgNodeId) {
                        Tone.Draw.schedule(() => highlightSvgNode(event.svgNodeId), time);
                    } else if (event !== null) {
                        Tone.Draw.schedule(() => highlightSvgNode(null), time);
                    }
                    
                    if (event !== null) {
                        piano.triggerAttackRelease(event.notes, event.duration, time);
                        bassSynth.triggerAttackRelease(event.bass, event.duration, time);
                    }
                }
                step++;
            }, "8n");

            Tone.Transport.bpm.value = parseInt(document.getElementById('tempoSlider') ? document.getElementById('tempoSlider').value : 120);
            audioInitialized = true;
        }

        const progressionSelect = document.getElementById('progressionSelect');
        const variationSelect = document.getElementById('variationSelect');
        const keySelect = document.getElementById('keySelect');
        
        const progressionSelectMobile = document.getElementById('progressionSelectMobile');
        const variationSelectMobile = document.getElementById('variationSelectMobile');
        const keySelectMobile = document.getElementById('keySelectMobile');

        const chordGrid = document.getElementById('chordGrid');
        
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const playBtnMobile = document.getElementById('playBtnMobile');
        const stopBtnMobile = document.getElementById('stopBtnMobile');
        
        const tempoSlider = document.getElementById('tempoSlider');
        const tempoValue = document.getElementById('tempoValue');
        const tempoSliderMobile = document.getElementById('tempoSliderMobile');
        const tempoValueMobile = document.getElementById('tempoValueMobile');
        
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const volumeSliderMobile = document.getElementById('volumeSliderMobile');
        const volumeValueMobile = document.getElementById('volumeValueMobile');

        const themeToggleBtns = [document.getElementById('themeToggleBtn')];
        const htmlElement = document.documentElement;

        progressionLibrary.forEach((prog, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = prog.name;
            if(progressionSelect) progressionSelect.appendChild(option);
            
            const optionMobile = document.createElement('option');
            optionMobile.value = index;
            optionMobile.textContent = prog.name;
            if(progressionSelectMobile) progressionSelectMobile.appendChild(optionMobile);
        });

        allKeys.forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = key;
            if(keySelect) keySelect.appendChild(option);
            
            const optionMobile = document.createElement('option');
            optionMobile.value = key;
            optionMobile.textContent = key;
            if(keySelectMobile) keySelectMobile.appendChild(optionMobile);
        });

        function updateThemeIcons() {
            const isDark = htmlElement.classList.contains('dark');
            themeToggleBtns.forEach(btn => {
                if(btn) btn.innerHTML = isDark ? '<i class="fa-solid fa-sun text-lg"></i>' : '<i class="fa-solid fa-moon text-lg"></i>';
            });
        }
        function toggleTheme() { htmlElement.classList.toggle('dark'); updateThemeIcons(); }
        themeToggleBtns.forEach(btn => { if(btn) btn.addEventListener('click', toggleTheme); });
        updateThemeIcons(); 

        function updatePlayButtons(playing) {
            const playHtml = '<i class="fa-solid fa-play ml-0.5"></i>';
            const pauseHtml = '<i class="fa-solid fa-pause"></i>';
            const playClasses = ['bg-blue-600', 'hover:bg-blue-500'];
            const pauseClasses = ['bg-amber-500', 'hover:bg-amber-400'];
            
            [playBtn, playBtnMobile].forEach(btn => {
                if(!btn) return;
                if(playing) {
                    btn.innerHTML = pauseHtml;
                    btn.classList.remove(...playClasses);
                    btn.classList.add(...pauseClasses);
                } else {
                    btn.innerHTML = playHtml;
                    btn.classList.remove(...pauseClasses);
                    btn.classList.add(...playClasses);
                }
            });
        }

        async function playProgression() {
            if (!audioInitialized) await initAudio();
            if (Tone.context.state !== 'running') await Tone.context.resume();
            
            if (!isPlaying) {
                step = selectedStartMeasure * 8;
                Tone.Transport.position = 0;
                Tone.Transport.start();
                isPlaying = true;
                updatePlayButtons(true);
            } else {
                Tone.Transport.pause(); 
                isPlaying = false;
                if (piano && piano.releaseAll) piano.releaseAll();
                const now = Tone.now();
                if (bassSynth && bassSynth.triggerRelease) bassSynth.triggerRelease(now);
                updatePlayButtons(false);
            }
        }

        function stopProgression() {
            if (audioInitialized) {
                Tone.Transport.pause();
                const now = Tone.now();
                piano.releaseAll();
                bassSynth.triggerRelease(now);
                if (piano && piano.voices) piano.voices.forEach(v => { if (v && v.cancel) v.cancel(now); });
            }
            isPlaying = false;
            step = selectedStartMeasure * 8; 
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            highlightSvgNode(null); 
            updatePlayButtons(false);
        }

        if(playBtn) playBtn.addEventListener('click', playProgression);
        if(stopBtn) stopBtn.addEventListener('click', stopProgression);
        if(playBtnMobile) playBtnMobile.addEventListener('click', playProgression);
        if(stopBtnMobile) stopBtnMobile.addEventListener('click', stopProgression);
        
        function handleTempoChange(val) {
            if(tempoValue) tempoValue.textContent = val;
            if(tempoValueMobile) tempoValueMobile.textContent = val;
            if(tempoSlider) tempoSlider.value = val;
            if(tempoSliderMobile) tempoSliderMobile.value = val;
            if (audioInitialized) Tone.Transport.bpm.value = val;
        }
        
        if(tempoSlider) tempoSlider.addEventListener('input', (e) => handleTempoChange(e.target.value));
        if(tempoSliderMobile) tempoSliderMobile.addEventListener('input', (e) => handleTempoChange(e.target.value));

        function handleVolumeChange(val) {
            if(volumeValue) volumeValue.textContent = `${val} dB`;
            if(volumeValueMobile) volumeValueMobile.textContent = `${val} dB`;
            if(volumeSlider) volumeSlider.value = val;
            if(volumeSliderMobile) volumeSliderMobile.value = val;
            if (audioInitialized) Tone.Destination.volume.value = parseFloat(val);
        }

        if(volumeSlider) volumeSlider.addEventListener('input', (e) => handleVolumeChange(e.target.value));
        if(volumeSliderMobile) volumeSliderMobile.addEventListener('input', (e) => handleVolumeChange(e.target.value));

        function syncSelects(id1, id2, value) {
            const el1 = document.getElementById(id1);
            const el2 = document.getElementById(id2);
            if(el1) el1.value = value;
            if(el2) el2.value = value;
        }

        function handleProgressionChange(val) {
            syncSelects('progressionSelect', 'progressionSelectMobile', val);
            manualKeyChange = false; const wasPlaying = isPlaying; stopProgression(); selectedStartMeasure = 0;
            loadAndCompileProgression(); if(wasPlaying) setTimeout(() => playProgression(), 50);
        }
        
        if(progressionSelect) progressionSelect.addEventListener('change', (e) => handleProgressionChange(e.target.value));
        if(progressionSelectMobile) progressionSelectMobile.addEventListener('change', (e) => handleProgressionChange(e.target.value));

        function handleVariationChange(val) {
            syncSelects('variationSelect', 'variationSelectMobile', val);
            const wasPlaying = isPlaying; stopProgression(); selectedStartMeasure = 0;
            loadAndCompileProgression(); if(wasPlaying) setTimeout(() => playProgression(), 50);
        }
        
        if(variationSelect) variationSelect.addEventListener('change', (e) => handleVariationChange(e.target.value));
        if(variationSelectMobile) variationSelectMobile.addEventListener('change', (e) => handleVariationChange(e.target.value));

        function handleKeyChange(val) {
            syncSelects('keySelect', 'keySelectMobile', val);
            manualKeyChange = true; const wasPlaying = isPlaying; stopProgression();
            loadAndCompileProgression(); if(wasPlaying) setTimeout(() => playProgression(), 50);
        }
        
        if(keySelect) keySelect.addEventListener('change', (e) => handleKeyChange(e.target.value));
        if(keySelectMobile) keySelectMobile.addEventListener('change', (e) => handleKeyChange(e.target.value));

        function handleTritoneToggle(val) {
            globalTritone = val;
            const toggle1 = document.getElementById('globalTritoneToggle');
            const toggle2 = document.getElementById('globalTritoneToggleMobile');
            if(toggle1) toggle1.checked = val;
            if(toggle2) toggle2.checked = val;
            loadAndCompileProgression(true);
        }

        if(document.getElementById('globalTritoneToggle')) document.getElementById('globalTritoneToggle').addEventListener('change', (e) => handleTritoneToggle(e.target.checked));
        if(document.getElementById('globalTritoneToggleMobile')) document.getElementById('globalTritoneToggleMobile').addEventListener('change', (e) => handleTritoneToggle(e.target.checked));
        
        function handleRomanToggle(val) {
            romanMode = val;
            const toggle1 = document.getElementById('romanToggle');
            const toggle2 = document.getElementById('romanToggleMobile');
            if(toggle1) toggle1.checked = val;
            if(toggle2) toggle2.checked = val;
            renderGrid(); 
        }

        if(document.getElementById('romanToggle')) document.getElementById('romanToggle').addEventListener('change', (e) => handleRomanToggle(e.target.checked));
        if(document.getElementById('romanToggleMobile')) document.getElementById('romanToggleMobile').addEventListener('change', (e) => handleRomanToggle(e.target.checked));

        if(chordGrid) {
            chordGrid.addEventListener('click', (e) => {
                const chordEl = e.target.closest('.chord-text');
                if (chordEl && chordEl.classList.contains('is-dominant')) {
                    e.stopPropagation(); 
                    tritoneOverrides[`${chordEl.dataset.mid}_${chordEl.dataset.cid}`] = !chordEl.classList.contains('is-subbed');
                    loadAndCompileProgression(true);
                } else {
                    const measureBox = e.target.closest('.measure-box');
                    if (measureBox) {
                        selectedStartMeasure = parseInt(measureBox.dataset.index);
                        renderGrid(); updateStartMeasureLabel();
                    }
                }
            });
        }

        loadAndCompileProgression();
    </script>
</body>
</html>
