<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aproximación al Lead Sheet - Acordes y Progresiones</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    height: { 'dvh': '100dvh' }
                }
            }
        }
    </script>
    
    <!-- Librerías de Audio, PDF e Iconos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }

        .measure-box {
            transition: all 0.15s ease-in-out; height: 100%; min-height: 45px;
            cursor: pointer; display: flex; flex-direction: column; justify-content: center;
            position: relative; overflow: hidden;
            /* Bordes más firmes para garantizar renderizado en PDF */
            border-style: solid; border-width: 1px;
        }
        .measure-box:hover { border-color: #3b82f6 !important; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); }
        .measure-active { background-color: #eff6ff !important; border-color: #60a5fa !important; transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2); z-index: 10; }
        .dark .measure-active { background-color: #1e3a8a !important; border-color: #3b82f6 !important; }

        .repeat-start::before { content: ''; position: absolute; left: 4px; top: 15%; bottom: 15%; width: 4px; border-left: 3px solid #3b82f6; border-right: 1px solid #3b82f6; opacity: 0.8; }
        .repeat-start::after { content: ':'; font-weight: bold; font-size: 1.5em; line-height: 1; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #3b82f6; opacity: 0.8; font-family: serif; }
        .repeat-end::before { content: ''; position: absolute; right: 4px; top: 15%; bottom: 15%; width: 4px; border-right: 3px solid #3b82f6; border-left: 1px solid #3b82f6; opacity: 0.8; }
        .repeat-end::after { content: ':'; font-weight: bold; font-size: 1.5em; line-height: 1; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #3b82f6; opacity: 0.8; font-family: serif; }

        .chord-text { font-family: 'Courier New', Courier, monospace; white-space: nowrap !important; line-height: 1.1; display: inline-block; transition: font-size 0.2s ease;}
        
        .interactive-chord:hover { opacity: 0.8; text-shadow: 0 0 8px currentColor; cursor: pointer;}
        .interactive-chord { position: relative; z-index: 20; }

        .bracket-container {
            display: flex; flex-direction: row; flex-wrap: nowrap;
            justify-content: center; align-items: baseline;
            padding-bottom: 2px; position: relative;
        }

        .ii-v-bracket::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 5px; border-bottom: 2px solid #64748b; border-left: 2px solid #64748b; border-right: 2px solid #64748b; opacity: 0.8; border-bottom-left-radius: 2px; border-bottom-right-radius: 2px; }
        .dark .ii-v-bracket::after { border-color: #94a3b8; }
        
        .ii-v-bracket-dim::after { border-color: #ec4899; border-style: dashed; }
        .dark .ii-v-bracket-dim::after { border-color: #f472b6; }

        .metronome-dot { transition: all 0.05s ease-out; }
        .metronome-dot.active { background-color: #3b82f6 !important; transform: scale(1.5); box-shadow: 0 0 6px rgba(59,130,246,0.8); }
        .dark .metronome-dot.active { background-color: #60a5fa !important; box-shadow: 0 0 8px rgba(96,165,250,0.8); }
        .metronome-dot.active-beat1 { background-color: #ef4444 !important; box-shadow: 0 0 8px rgba(239,68,68,0.8); }

        .mute-btn { transition: all 0.2s; }
        .mute-btn.muted { opacity: 0.5; background-color: #cbd5e1 !important; color: #64748b !important; text-decoration: line-through; }
        .dark .mute-btn.muted { background-color: #334155 !important; color: #94a3b8 !important; }

        .coltrane-node { cursor: pointer; transition: transform 0.1s; }
        .coltrane-node:hover { transform: scale(1.05); }
        .coltrane-node .ii-v-bg { fill: transparent; rx: 6px; transition: all 0.15s ease; }
        .ii-v-text { fill: currentColor; transition: fill 0.15s ease; }
        
        .coltrane-node.active-node .ii-v-bg { fill: #fef08a !important; stroke: #eab308 !important; stroke-width: 2px; }
        .dark .coltrane-node.active-node .ii-v-bg { fill: #fef08a !important; stroke: #ca8a04 !important; }
        
        .coltrane-node.active-node .ii-v-text { text-decoration: underline; text-decoration-thickness: 2px; text-decoration-color: currentColor; fill: #0f172a !important; }
        .dark .coltrane-node.active-node .ii-v-text { fill: #0f172a !important; font-weight: bold; }
        
        .coltrane-node .tonic-circle { transition: all 0.2s ease; }
        .coltrane-node.active-node .tonic-circle { fill: currentColor !important; stroke-width: 4px; filter: drop-shadow(0 0 10px currentColor); }
        .coltrane-node.active-node .tonic-text { fill: white !important; font-weight: 900; }
        .dark .coltrane-node.active-node .tonic-text { fill: #0f172a !important; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #475569; }

        input:checked ~ .toggle-dot { transform: translateX(100%); background-color: #3b82f6; }
        input#globalTritoneToggle:checked ~ .toggle-dot, input#globalTritoneToggleMobile:checked ~ .toggle-dot { background-color: #f59e0b; }
        input#globalDimToggle:checked ~ .toggle-dot, input#globalDimToggleMobile:checked ~ .toggle-dot { background-color: #ec4899; }
        input#relacionToggle:checked ~ .toggle-dot, input#relacionToggleMobile:checked ~ .toggle-dot { transform: translateX(100%); background-color: #10b981; }

        input:checked ~ .toggle-track { background-color: #dbeafe; }
        input#globalTritoneToggle:checked ~ .toggle-track, input#globalTritoneToggleMobile:checked ~ .toggle-track { background-color: #fef3c7; }
        input#globalDimToggle:checked ~ .toggle-track, input#globalDimToggleMobile:checked ~ .toggle-track { background-color: #fce7f3; }
        input#relacionToggle:checked ~ .toggle-track, input#relacionToggleMobile:checked ~ .toggle-track { background-color: #d1fae5; }
        
        .dark input:checked ~ .toggle-track { background-color: #1e3a8a; }
        .dark input#globalTritoneToggle:checked ~ .toggle-track, .dark input#globalTritoneToggleMobile:checked ~ .toggle-track { background-color: #78350f; }
        .dark input#globalDimToggle:checked ~ .toggle-track, .dark input#globalDimToggleMobile:checked ~ .toggle-track { background-color: #831843; }
        .dark input#relacionToggle:checked ~ .toggle-track, .dark input#relacionToggleMobile:checked ~ .toggle-track { background-color: #064e3b; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }

        @media (max-width: 640px) {
            .measure-box { min-height: 45px !important; padding: 1px; } 
            .section-label { font-size: 8px; padding: 1px 3px; }
            .measure-number { font-size: 7px; top: 2px; right: 4px; }
            .repeat-start::after, .repeat-end::after { font-size: 14px; left: 4px; right: 4px;}
            .repeat-start { padding-left: 0.6rem; }
            .repeat-end { padding-right: 0.6rem; }
            .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.25rem; width: 100%; }
            .controls-full-width { grid-column: span 2; }
            .toggles-row { display: flex; justify-content: space-between; align-items: center; grid-column: span 2; padding-top: 0.25rem; border-top: 1px solid rgba(148, 163, 184, 0.2); }
        }

        /* Reglas estandarizadas para el motor de Impresión (Fallback seguro) */
        @media print {
            body, html { height: auto !important; overflow: visible !important; background-color: white !important; }
            #topControls, #blueBar, #coltraneGraphicContainer, .measure-active { display: none !important; }
            #gridScrollContainer { overflow: visible !important; height: auto !important; }
            #chordGrid { gap: 15px !important; display: grid !important; grid-template-columns: repeat(4, 1fr) !important; font-size: 100% !important; }
            .measure-box { break-inside: avoid; border: 1px solid #cbd5e1 !important; color: black !important; background-color: #f8fafc !important; min-height: 60px !important; box-shadow: none !important;}
            .text-slate-800, .dark .text-slate-100 { color: black !important; }
            * { text-shadow: none !important; }
        }
    </style>
</head>

<body class="h-dvh sm:min-h-screen flex flex-col items-center sm:py-2 md:py-4 px-2 sm:px-3 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 overflow-hidden relative">
    
    <!-- Toast Notification -->
    <div id="toastMsg" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-xl z-50 transition-opacity duration-300 opacity-0 hidden flex items-center gap-2">
        <i class="fa-solid fa-circle-info" id="toastIcon"></i>
        <span class="text-sm font-medium" id="toastText">Mensaje</span>
    </div>

    <div class="w-full sm:max-w-6xl mx-auto bg-white dark:bg-slate-800 sm:shadow-2xl sm:rounded-xl flex flex-col h-full sm:h-auto overflow-hidden border-0 sm:border border-slate-200 dark:border-slate-700" id="mainAppWrapper">
        
        <!-- Header / Controles -->
        <div id="topControls" class="bg-slate-100 dark:bg-slate-800/80 p-1.5 border-b border-slate-200 dark:border-slate-700 flex flex-col relative z-20 shrink-0">
            
            <div class="flex items-center justify-between w-full mb-1 px-1">
                <h1 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2 leading-tight">
                    <i class="fa-solid fa-music text-blue-600"></i>
                    <span>Aproximación<br><span class="text-xs font-medium text-slate-500">al Lead Sheet</span></span>
                </h1>
                
                <div class="flex items-center gap-1 sm:gap-2">
                    <button id="shareBtn" class="text-slate-500 hover:text-blue-500 text-lg transition-colors w-8 h-8 flex items-center justify-center rounded-full" title="Compartir enlace de esta progresión">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <button id="pdfBtn" class="text-slate-500 hover:text-red-500 text-lg transition-colors w-8 h-8 flex items-center justify-center rounded-full" title="Descargar como PDF">
                        <i class="fa-solid fa-file-pdf"></i>
                    </button>
                    <button id="midiBtn" class="text-slate-500 hover:text-amber-500 text-lg transition-colors w-8 h-8 flex items-center justify-center rounded-full" title="Exportar a MIDI">
                        <i class="fa-solid fa-file-audio"></i>
                    </button>
                    <div class="w-px h-5 bg-slate-300 dark:bg-slate-600 mx-1"></div>
                    <button id="themeToggleBtn" class="text-slate-500 hover:text-blue-500 text-lg transition-colors w-8 h-8 flex items-center justify-center rounded-full" title="Cambiar Tema">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>
            
            <!-- Controles Desktop -->
            <div class="hidden sm:flex items-center gap-3 w-full flex-wrap lg:flex-nowrap justify-between">
                <div class="flex flex-col flex-1 max-w-[200px]">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between w-full">
                        <span>Progresión</span>
                    </label>
                    <select id="progressionSelect" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none shadow-sm"></select>
                </div>

                <div id="variationContainer" class="flex-col min-w-[120px]">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Ver.</label>
                    <select id="variationSelect" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                </div>

                <div class="flex flex-col w-14 shrink-0">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Tono</label>
                    <select id="keySelect" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                </div>

                <div class="flex flex-col w-14 shrink-0">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Ciclos</label>
                    <input type="number" id="loopInput" placeholder="∞" min="1" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm">
                </div>

                <div class="flex flex-col w-20">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Tempo</span><span id="tempoValue" class="text-blue-600 font-bold">120</span>
                    </label>
                    <input type="range" id="tempoSlider" min="60" max="240" value="120" class="mt-1">
                </div>

                <div class="flex flex-col w-20">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Vol.</span><span id="volumeValue" class="text-blue-600 dark:text-blue-400 font-bold">-6 dB</span>
                    </label>
                    <input type="range" id="volumeSlider" min="-30" max="0" value="-6" step="1" class="mt-1">
                </div>
                
                <div class="flex flex-col w-20">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Tam.</span><span id="sizeValue" class="text-blue-600 dark:text-blue-400 font-bold">100%</span>
                    </label>
                    <input type="range" id="sizeSlider" min="50" max="200" value="100" step="5" class="mt-1">
                </div>

                <div class="flex items-center gap-2 ml-auto">
                    <label class="flex items-center gap-1 cursor-pointer group" title="Cifrado Funcional (Weber)">
                        <div class="relative">
                            <input type="checkbox" id="romanToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-7 h-4 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-2 h-2 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-blue-500 transition-colors">Weber</span>
                    </label>
                    
                    <label class="flex items-center gap-1 cursor-pointer group" title="Sustituto Tritonal Master">
                        <div class="relative">
                            <input type="checkbox" id="globalTritoneToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-7 h-4 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-2 h-2 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-amber-500 transition-colors">Tritono</span>
                    </label>

                    <label class="flex items-center gap-1 cursor-pointer group" title="Sustituto Disminuido Master">
                        <div class="relative">
                            <input type="checkbox" id="globalDimToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-7 h-4 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-2 h-2 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-pink-500 transition-colors">DIM</span>
                    </label>

                    <label id="iivToggleContainer" class="hidden items-center gap-1 cursor-pointer group" title="Relación II-V">
                        <div class="relative">
                            <input type="checkbox" id="relacionToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-7 h-4 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-2 h-2 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-emerald-500 transition-colors">II-V</span>
                    </label>

                    <div class="flex items-center gap-1 border-l border-slate-300 dark:border-slate-600 pl-2 ml-1">
                        <button id="mutePianoBtn" class="mute-btn bg-blue-100 text-blue-700 hover:bg-blue-200 h-7 px-1.5 rounded font-bold text-[9px]" title="Silenciar Piano"><i class="fa-solid fa-keyboard"></i></button>
                        <button id="muteBassBtn" class="mute-btn bg-blue-100 text-blue-700 hover:bg-blue-200 h-7 px-1.5 rounded font-bold text-[9px]" title="Silenciar Bajo"><i class="fa-solid fa-guitar"></i></button>
                    </div>

                    <div class="flex items-center gap-1 ml-1">
                        <button id="playBtn" class="bg-blue-600 hover:bg-blue-500 text-white h-8 w-8 rounded-full flex items-center justify-center transition-colors shadow-lg shadow-blue-500/30"><i class="fa-solid fa-play text-xs ml-0.5"></i></button>
                        <button id="stopBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-600 h-8 w-8 rounded-full flex items-center justify-center transition-colors"><i class="fa-solid fa-stop text-xs"></i></button>
                    </div>
                </div>
            </div>

            <!-- Controles Móviles -->
            <div class="sm:hidden controls-grid">
                <div class="controls-full-width flex gap-1 items-end">
                    <div class="flex-1">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                            <span>Progresión</span>
                        </label>
                        <select id="progressionSelectMobile" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none shadow-sm"></select>
                    </div>
                    <div id="variationContainerMobile" class="flex-col min-w-[90px]">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Ver.</label>
                        <select id="variationSelectMobile" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                    </div>
                    <div class="flex-col w-12 shrink-0">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Tono</label>
                        <select id="keySelectMobile" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                    </div>
                </div>

                <div class="controls-full-width flex justify-between items-end gap-2 mt-1">
                    <div class="flex flex-col w-12 shrink-0">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Ciclos</label>
                        <input type="number" id="loopInputMobile" placeholder="∞" min="1" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm">
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                            <span>Tempo</span><span id="tempoValueMobile" class="text-blue-600 font-bold">120</span>
                        </label>
                        <input type="range" id="tempoSliderMobile" min="60" max="240" value="120" class="mt-0.5">
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                            <span>Vol.</span><span id="volumeValueMobile" class="text-blue-600 dark:text-blue-400 font-bold">-6 dB</span>
                        </label>
                        <input type="range" id="volumeSliderMobile" min="-30" max="0" value="-6" step="1" class="mt-0.5">
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                            <span>Tam.</span><span id="sizeValueMobile" class="text-blue-600 dark:text-blue-400 font-bold">100%</span>
                        </label>
                        <input type="range" id="sizeSliderMobile" min="50" max="200" value="100" step="5" class="mt-0.5">
                    </div>
                </div>

                <div class="toggles-row">
                    <div class="flex gap-2">
                        <label class="flex items-center gap-1 cursor-pointer group">
                            <div class="relative"><input type="checkbox" id="romanToggleMobile" class="sr-only"><div class="toggle-track block bg-slate-300 w-6 h-3.5 rounded-full dark:bg-slate-600"></div><div class="toggle-dot absolute left-[2px] top-[2px] bg-white w-2.5 h-2.5 rounded-full transition transform shadow-sm"></div></div><span class="text-[9px] text-slate-500 font-bold uppercase">Weber</span>
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer group">
                            <div class="relative"><input type="checkbox" id="globalTritoneToggleMobile" class="sr-only"><div class="toggle-track block bg-slate-300 w-6 h-3.5 rounded-full dark:bg-slate-600"></div><div class="toggle-dot absolute left-[2px] top-[2px] bg-white w-2.5 h-2.5 rounded-full transition transform shadow-sm"></div></div><span class="text-[9px] text-slate-500 font-bold uppercase">Tritono</span>

        function safeSetStorage(key, val) { try { localStorage.setItem(key, val); } catch(e) { console.warn("LocalStorage bloqueado."); } }
        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }

        function updateURLState() {
            try {
                const params = new URLSearchParams(window.location.search);
                const progVal = document.getElementById('progressionSelect')?.value || 0;
                
                // Add the explicit tool parameter for OpusLab's routing system
                params.set('tool', 'leadsheet');
                
                params.set('prog', progVal);
                params.set('key', document.getElementById('keySelect')?.value || 'C');
                params.set('tempo', document.getElementById('tempoSlider')?.value || 120);
                
                const vSelect = document.getElementById('variationSelect');
                if (vSelect && vSelect.value !== "") params.set('var', vSelect.value);

                if (progressionLibrary[progVal] && progressionLibrary[progVal].id === "custom") {
                    const customInput = document.getElementById('customProgInput')?.value || "";
                    params.set('custom', encodeURIComponent(customInput));
                    safeSetStorage('opusLab_customProg', customInput);
                }

                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?' + params.toString();
                window.history.replaceState({path: newUrl}, '', newUrl);
            } catch(e) { console.warn("Error URL State"); }
        }

        function restoreStateOnLoad() {
            try {
                let savedCustom = safeGetStorage('opusLab_customProg');
                if (savedCustom) {
                    const customProg = progressionLibrary.find(p => p.id === "custom");
                    if(customProg) customProg.variations[0][0].data = savedCustom;
                    const customProgInput = document.getElementById('customProgInput');
                    if(customProgInput) customProgInput.value = savedCustom;
                }

                const params = new URLSearchParams(window.location.search);
                if (params.has('prog')) syncSelects('progressionSelect', 'progressionSelectMobile', params.get('prog'));
                if (params.has('var')) syncSelects('variationSelect', 'variationSelectMobile', params.get('var'));
                if (params.has('key')) { syncSelects('keySelect', 'keySelectMobile', params.get('key')); manualKeyChange = true; }
                if (params.has('tempo')) {
                    let t = params.get('tempo');
                    ['tempoSlider', 'tempoSliderMobile'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = t; });
                    ['tempoValue', 'tempoValueMobile'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).textContent = t; });
                }
                if (params.has('custom')) {
                    const dec = decodeURIComponent(params.get('custom'));
                    const customProgInput = document.getElementById('customProgInput');
                    if(customProgInput) customProgInput.value = dec;
                    const customProg = progressionLibrary.find(p => p.id === "custom");
                    if(customProg) customProg.variations[0][0].data = dec;
                }
            } catch(e) { console.warn("Error Restoring State"); }
        }

        function showToast(message, type="success") {
            const toast = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastText');
            if(!toast || !icon || !text) return;
            
            text.textContent = message;
            if(type === "error") icon.className = "fa-solid fa-triangle-exclamation text-red-400";
            else icon.className = "fa-solid fa-check-circle text-green-400";
            
            toast.classList.remove('hidden'); 
            setTimeout(() => toast.classList.add('opacity-100'), 10);
            setTimeout(() => { 
                toast.classList.remove('opacity-100'); 
                setTimeout(() => toast.classList.add('hidden'), 300); 
            }, 3000); 
        }

        // COMPARTIR INTELIGENTE Y A PRUEBA DE FALLOS
        document.getElementById('shareBtn')?.addEventListener('click', async () => {
            updateURLState();
            
            try {
                // Constructor estricto de la URL base para el ruteo
                let currentParams = new URLSearchParams(window.location.search);
                currentParams.set('tool', 'leadsheet'); // Garantizar que la herramienta esté en la URL
                
                // Forzar el dominio y directorio oficial de OpusLab3.0
                const finalShareUrl = "https://juanmiguel0927.github.io/OpusLab3.0/?" + currentParams.toString();
                
                let shared = false;

                // 1. Intentar el menú nativo de móviles
                if (navigator.share && /mobile|android|iphone|ipad/i.test(navigator.userAgent)) {
                    try {
                        await navigator.share({ title: 'OpusLab 3.0 - Lead Sheet', text: 'Mira esta progresión armónica:', url: finalShareUrl });
                        shared = true;
                    } catch (e) {
                        if (e.name === 'AbortError' || e.message.includes('abort')) return; // Usuario canceló a propósito
                    }
                }
                
                // 2. Intentar API moderna de portapapeles
                if (!shared && navigator.clipboard && window.isSecureContext) {
                    try {
                        await navigator.clipboard.writeText(finalShareUrl);
                        shared = true;
                    } catch(e) {}
                }
                
                // 3. Fallback Infalible (Para WebViews y navegadores antiguos)
                if (!shared) {
                    const textArea = document.createElement("textarea");
                    textArea.value = finalShareUrl;
                    textArea.style.position = "fixed"; textArea.style.left = "-999999px"; textArea.style.top = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus(); textArea.select();
                    
                    try {
                        if (document.execCommand('copy')) shared = true;
                    } catch (err) {} finally { textArea.remove(); }
                }

                if (shared) showToast("Enlace copiado al portapapeles", "success");
                else showToast("Error al compartir (Permisos denegados)", "error");
                
            } catch(e) { 
                showToast("Error inesperado", "error"); 
            }
        });

        const cualidades = {

        function parseNoteObj(noteStr) {
            const letter = noteStr.charAt(0); let accidental = 0;
            for (let i = 1; i < noteStr.length; i++) {
                if (noteStr[i] === '#') accidental++; if (noteStr[i] === 'b') accidental--;
            }
            return { letter, accidental, semitone: (baseSemitones[letter] + accidental + 12) % 12 };
        }

        function getTranspositionOffsets(baseKeyStr, targetKeyStr) {
            const base = parseNoteObj(baseKeyStr); const target = parseNoteObj(targetKeyStr);
            let stOffset = target.semitone - base.semitone; let letterOffset = noteLetters.indexOf(target.letter) - noteLetters.indexOf(base.letter);
            if (stOffset < 0) stOffset += 12; if (letterOffset < 0) letterOffset += 7;
            return { stOffset, letterOffset };
        }

        function transposeRoot(rootStr, stOffset, letterOffset) {
            const parsed = parseNoteObj(rootStr);
            const newLetterIdx = (noteLetters.indexOf(parsed.letter) + letterOffset + 7) % 7;
            const newLetter = noteLetters[newLetterIdx];
            const targetSemitone = (parsed.semitone + stOffset + 120) % 12; 
            let accidentalNeeded = targetSemitone - baseSemitones[newLetter];
            if (accidentalNeeded > 6) accidentalNeeded -= 12; if (accidentalNeeded < -6) accidentalNeeded += 12;
            let result = newLetter;
            if (accidentalNeeded > 0) result += '#'.repeat(accidentalNeeded);
            if (accidentalNeeded < 0) result += 'b'.repeat(-accidentalNeeded);
            return result;
        }

        function transposeChordName(chordStr, stOffset, letterOffset) {
            if (chordStr === "NC" || chordStr === "-" || chordStr === ":|") return chordStr;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1]; let quality = match[2];
            const newRoot = transposeRoot(root, stOffset, letterOffset);
            if (quality.includes('/')) {
                const qParts = quality.split('/');
                quality = qParts[0] + '/' + transposeRoot(qParts[1], stOffset, letterOffset);
            }
            return newRoot + quality;
        }
        
        function getLocalKey(baseKeyStr, measureId) {
            if (measureId === undefined || measureId === -1) return baseKeyStr;
            let progIndex = parseInt(document.getElementById('progressionSelect')?.value || document.getElementById('progressionSelectMobile')?.value || 0);
            if (isNaN(progIndex)) progIndex = 0;
            const progData = progressionLibrary[progIndex];
            
            if (progData && (progData.id === "251-maj-all" || progData.id === "251-min-all")) {
                const jazzCircleOfFourths = ["C", "F", "Bb", "Eb", "Ab", "Db", "Gb", "B", "E", "A", "D", "G"];
                let startIdx = jazzCircleOfFourths.indexOf(baseKeyStr);
                if (startIdx === -1) {
                    const st = parseNoteObj(baseKeyStr).semitone;
                    startIdx = jazzCircleOfFourths.findIndex(k => parseNoteObj(k).semitone === st);
                    if (startIdx === -1) startIdx = 0;
                }
                let blockIdx = Math.floor(measureId / 4);
                return jazzCircleOfFourths[(startIdx + blockIdx) % 12];
            }
            return baseKeyStr;
        }

        function romanToChord(romanStr, keyStr, measureId = -1) {
             let localKeyStr = getLocalKey(keyStr, measureId);
             const keyOffset = parseNoteObj(localKeyStr).semitone;
             const keyLetterIdx = noteLetters.indexOf(localKeyStr.charAt(0));

             let rootRoman = romanStr.match(/^(b|#)?(VII|VI|V|IV|III|II|I)/i);
             if (!rootRoman) return romanStr; 
             
             let accidental = rootRoman[1] || "";
             let degree = rootRoman[2].toUpperCase();
             let quality = romanStr.substring(rootRoman[0].length);

             let stInterval = 0;
             let letterInterval = 0;
             
             if (degree === "I") { stInterval = 0; letterInterval = 0; }
             else if (degree === "II") { stInterval = 2; letterInterval = 1; }
             else if (degree === "III") { stInterval = 4; letterInterval = 2; }
             else if (degree === "IV") { stInterval = 5; letterInterval = 3; }
             else if (degree === "V") { stInterval = 7; letterInterval = 4; }
             else if (degree === "VI") { stInterval = 9; letterInterval = 5; }
             else if (degree === "VII") { stInterval = 11; letterInterval = 6; }

             if (accidental === "b") { stInterval -= 1; }
             if (accidental === "#") { stInterval += 1; }

             let targetLetter = noteLetters[(keyLetterIdx + letterInterval) % 7];
             let targetMidi = (keyOffset + stInterval + 120) % 12;
             
             let accNeeded = targetMidi - baseSemitones[targetLetter];
             if (accNeeded > 6) accNeeded -= 12; if (accNeeded < -6) accNeeded += 12;
             
             let finalRoot = targetLetter;
             if (accNeeded > 0) finalRoot += '#'.repeat(accNeeded);
             if (accNeeded < 0) finalRoot += 'b'.repeat(-accNeeded);

             return finalRoot + quality;
        }

        function getBaseRomanForSubstitutionLogic(chordStr, keyStr, measureId = -1) {
            let cleanStr = chordStr.replace(/_SUB|_DIM\d?|_BKT|_END1|_END2/g, '').replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '');
            const match = cleanStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return cleanStr;
            const root = match[1]; let quality = match[2];
            let localKeyStr = getLocalKey(keyStr, measureId);
            let { stOffset } = getTranspositionOffsets(localKeyStr, root);

            let baseRoman = "";
            if (stOffset === 0) baseRoman = "I";
            else if (stOffset === 1) baseRoman = (quality.includes('dim') || quality.includes('o')) ? "#I" : "bII";
            else if (stOffset === 2) baseRoman = "II";
            else if (stOffset === 3) baseRoman = "bIII";
            else if (stOffset === 4) baseRoman = "III";
            else if (stOffset === 5) baseRoman = "IV";
            else if (stOffset === 6) baseRoman = (quality.includes('dim') || quality.includes('o')) ? "#IV" : "bV";
            else if (stOffset === 7) baseRoman = "V";
            else if (stOffset === 8) baseRoman = (quality.includes('dim') || quality.includes('o')) ? "#V" : "bVI";
            else if (stOffset === 9) baseRoman = "VI";
            else if (stOffset === 10) baseRoman = (quality.includes('dim') || quality.includes('o')) ? "#VI" : "bVII";
            else if (stOffset === 11) baseRoman = "VII";

            return baseRoman + quality;
        }

        function convertToRoman(chordStr, keyStr, measureId = -1) {
            if (chordStr === "NC" || chordStr === "-" || chordStr === ":|") return chordStr;
            
            let progIndex = parseInt(document.getElementById('progressionSelect')?.value || document.getElementById('progressionSelectMobile')?.value || 0);
            if (isNaN(progIndex)) progIndex = 0;

                selectedVar = parseInt(vSelectMobile.value);
            }
            if (isNaN(selectedVar)) selectedVar = 0;

            let localKeyStr = getLocalKey(keyStr, measureId);

            const dimMatch = chordStr.match(/_DIM(\d)?/);
            const isDimmed = !!dimMatch;
            const isSubbed = chordStr.includes('_SUB');
            let cleanStr = chordStr.replace(/_SUB|_DIM\d?|_BKT|_END1|_END2/g, '').replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '');
            
            if (progData && progData.id === "multitonic-coltrane") return cleanStr;
            if (progData && progData.id === "blues" && selectedVar !== 0) return cleanStr;

            const match = cleanStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return cleanStr;
            
            const root = match[1]; let quality = match[2]; let cleanQual = quality.split('/')[0];
            let { stOffset } = getTranspositionOffsets(localKeyStr, root);

            if (isSubbed) originalOffset = (stOffset + 6) % 12;

            if (progData && progData.id === "blues" && selectedVar === 0) {

            if (chordStr.includes('_SEC4')) return isSubbed ? "subV7/IV" : "V7/IV";
            if (chordStr.includes('_SEC5')) return isSubbed ? "subV7/V" : "V7/V";
            if (chordStr.includes('_SEC6')) return isSubbed ? "subV7/VI" : "V7/VI";

            let isDominantChord = (cleanQual.startsWith('7') || cleanQual.startsWith('9') || cleanQual.startsWith('13') || cleanQual.startsWith('dim') || cleanQual.startsWith('o')) 
                && !cleanQual.includes('maj') && !cleanQual.includes('m');

            if (isDominantChord || isDimmed) {
                if (isDimmed) {
                    let r = "";
                    if (stOffset === 0) r = "I";
                    else if (stOffset === 1) r = "#I";
                    else if (stOffset === 2) r = "II";
                    else if (stOffset === 3) r = "bIII";
                    else if (stOffset === 4) r = "III";
                    else if (stOffset === 5) r = "IV";
                    else if (stOffset === 6) r = "#IV";
                    else if (stOffset === 7) r = "V";
                    else if (stOffset === 8) r = "bVI";
                    else if (stOffset === 9) r = "VI";
                    else if (stOffset === 10) r = "bVII";
                    else if (stOffset === 11) r = "VII";
                    return r + "o7";
                }

                let targetRoman = null;
                if (originalOffset === 0) targetRoman = "IV";
                else if (originalOffset === 2) targetRoman = "V";
                else if (originalOffset === 4) targetRoman = "VI";
                else if (originalOffset === 9) targetRoman = "II";
                else if (originalOffset === 11) targetRoman = "III";
                else if (originalOffset === 7) {
                    let tension = cleanQual.replace('7', '');
                    if (tension === "9" || tension === "13") tension = "";
                    return isSubbed ? `subV7${tension}` : `V7${tension}`;
                }

                if (targetRoman) {

                    return isSubbed ? `subV7${tension}/${targetRoman}` : `V7${tension}/${targetRoman}`;
                }
            }

            let baseRoman = "";
            if (originalOffset === 0) baseRoman = "I";
            else if (originalOffset === 1) baseRoman = "bII";
            else if (originalOffset === 2) baseRoman = "II";
            else if (originalOffset === 3) baseRoman = "bIII";
            else if (originalOffset === 4) baseRoman = "III";
            else if (originalOffset === 5) baseRoman = "IV";
            else if (originalOffset === 6) baseRoman = (cleanQual.includes('dim') || cleanQual.includes('o')) ? "#IV" : "bV";
            else if (originalOffset === 7) baseRoman = "V";
            else if (originalOffset === 8) baseRoman = "bVI";
            else if (originalOffset === 9) baseRoman = "VI";
            else if (originalOffset === 10) baseRoman = "bVII";
            else if (originalOffset === 11) baseRoman = "VII";

        }

        const midiToNoteName = (midi) => {

        function computeNextVoicing(chordStr, prevMidiNotes) {
            if (!chordStr) return { midi: [], toneNames: [], bassNote: "C2" };
            let cleanChord = chordStr.replace(/_SUB|_DIM\d?|_BKT|_T\d|_V\d|_II\d|_SEC\d|_IIV|_END1|_END2/g, '');
            let rootMatch = cleanChord.match(/^([A-G][#b]*)/);
            if (!rootMatch) return { midi: [], toneNames: [], bassNote: "C2" };
            
            let rootStr = rootMatch[1]; let rest = cleanChord.substring(rootStr.length);
            let bassStr = rootStr; let quality = "maj"; 
            
            if (rest.includes('/')) { let parts = rest.split('/'); quality = parts[0] === "" ? "maj" : parts[0]; bassStr = parts[1]; } 
            else { quality = rest === "" ? "maj" : rest; }
            
            let intervals = cualidades[quality] || [0, 4, 7];
            let parsedRoot = parseNoteObj(rootStr);
            let rootMidi = 60 + parsedRoot.semitone; if (parsedRoot.semitone > 6) rootMidi -= 12; 
            
            let rawMidi = intervals.map(iv => {
                let noteMidi = rootMidi + iv;
                let n = noteMidi % 12;
                
                let possible = [n + 48, n + 60, n + 72];
                
                if (prevMidiNotes && prevMidiNotes.length > 0) {
                    let prevCenter = prevMidiNotes.reduce((a, b) => a + b, 0) / prevMidiNotes.length;
                    let best = possible.reduce((prev, curr) => {
                        let prevDiff = Math.abs(prev - prevCenter);
                        let currDiff = Math.abs(curr - prevCenter);
                        
                        let prevOut = prev < 60 || prev > 77;
                        let currOut = curr < 60 || curr > 77;
                        
                        if (currOut && !prevOut) return prev;
                        if (!currOut && prevOut) return curr;
                        
                        return currDiff < prevDiff ? curr : prev;
                    });
                    
                    if (best < 60) best += 12;
                    if (best > 77) best -= 12;
                    return best;
                } else {
                    let best = possible.find(v => v >= 60 && v <= 77);
                    if (!best) best = n + 60; 
                    return best;
                }
            });
            
            rawMidi = [...new Set(rawMidi)].sort((a, b) => a - b);
            let parsedBass = parseNoteObj(bassStr);
            let bassMidi = 36 + parsedBass.semitone; if (parsedBass.semitone > 5) bassMidi -= 12;

        }

        function isDominant(chordStr) {
            if (chordStr === "NC" || chordStr === "-" || chordStr === ":|") return false;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return false;
            const mainQuality = match[2].split('/')[0].replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_DIM\d?|_BKT/g, '');
            return (mainQuality.startsWith('7') || mainQuality.startsWith('9') || mainQuality.startsWith('13') || mainQuality.startsWith('dim') || mainQuality.startsWith('o')) 
                && !mainQuality.includes('maj') && !mainQuality.includes('m');
        }

        function extractTags(chordStr) {
            let tags = ""; let clean = chordStr;
            const match = chordStr.match(/(_[A-Z0-9]+)+$/);
            if (match) { tags = match[0]; clean = chordStr.substring(0, chordStr.length - tags.length); }
            return { clean, tags };
        }

        function applyTritoneSub(chordStr) {
            let { clean, tags } = extractTags(chordStr);
            let extraTags = ""; if (clean.includes('_BKT')) { extraTags += "_BKT"; clean = clean.replace('_BKT', ''); }
            const match = clean.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1]; let quality = match[2];
            if (quality.includes('/')) quality = quality.split('/')[0]; 
            return (tritoneRootMap[root] || root) + quality + tags + extraTags + "_SUB";
        }

        function applyDimSub(chordStr, inversionIndex = 0) {
            let { clean, tags } = extractTags(chordStr);
            let extraTags = ""; if (clean.includes('_BKT')) { extraTags += "_BKT"; clean = clean.replace('_BKT', ''); }
            tags = tags.replace(/_DIM\d?/g, '');
            const match = clean.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1];
            let baseDimRoot = dimRootMap[root] || root;

            let finalRoot = baseDimRoot;
            if (inversionIndex > 0) {
                const parsed = parseNoteObj(baseDimRoot);
                const targetMidi = (parsed.semitone + (inversionIndex * 3)) % 12;
                const preferredSpellings = { 0: 'C', 1: 'Db', 2: 'D', 3: 'Eb', 4: 'E', 5: 'F', 6: 'F#', 7: 'G', 8: 'Ab', 9: 'A', 10: 'Bb', 11: 'B' };
                finalRoot = preferredSpellings[targetMidi];
            }
            return finalRoot + "dim7" + tags + extraTags + "_DIM" + inversionIndex;
        }

        function loadAndCompileProgression(preserveState = false) {
            if (!preserveState) { 
                mutationOverrides = {}; 
                measureSizes = {}; 
                activeChordMutations = {}; 
            }
            
            const progressionSelectVal = document.getElementById('progressionSelect');
            const progressionSelectMobileVal = document.getElementById('progressionSelectMobile');
            
            let pSelectVal = progressionSelectVal ? progressionSelectVal.value : 0;
            if (!pSelectVal && progressionSelectMobileVal) pSelectVal = progressionSelectMobileVal.value;
            let progIndex = parseInt(pSelectVal);
            
            if (isNaN(progIndex)) progIndex = 0;
            if (progIndex >= progressionLibrary.length) progIndex = 0;
            
            const progData = progressionLibrary[progIndex] || progressionLibrary[0];
            
            const keySelectVal = document.getElementById('keySelect');
            const keySelectMobileVal = document.getElementById('keySelectMobile');
            
            let tSelectVal = keySelectVal ? keySelectVal.value : "C";
            if (!tSelectVal && keySelectMobileVal) tSelectVal = keySelectMobileVal.value;
            const targetKey = tSelectVal || "C";
            
            const vContainer = document.getElementById('variationContainer'); const vSelect = document.getElementById('variationSelect');
            const vContainerMobile = document.getElementById('variationContainerMobile'); const vSelectMobile = document.getElementById('variationSelectMobile');
            const customInputContainer = document.getElementById('customInputContainer');

            if (progData.id === "custom") {
                if (customInputContainer) customInputContainer.classList.remove('hidden');
                if (vContainer) { vContainer.classList.add('hidden'); vContainer.classList.remove('flex'); }
                if (vContainerMobile) { vContainerMobile.classList.add('hidden'); vContainerMobile.classList.remove('flex'); }
                
                const customProgInput = document.getElementById('customProgInput');
                let val = customProgInput && customProgInput.value.trim() !== "" ? customProgInput.value : "Cmaj7 | Dm7 | G7 | Cmaj7";
                if (!preserveState) {
                    currentActiveSections = [{ type: "Libre", color: "bg-white dark:bg-slate-800", repeat: false, data: val }];
                }
            } else {
                if (customInputContainer) customInputContainer.classList.add('hidden');
                
                if (progData.variations) {
                    if (vContainer) { vContainer.classList.remove('hidden'); vContainer.classList.add('flex'); }
                    if (vContainerMobile) { vContainerMobile.classList.remove('hidden'); vContainerMobile.classList.add('flex'); }
                    
                    if (vSelect && vSelect.dataset.progId !== progData.id) {
                        vSelect.innerHTML = ''; if(vSelectMobile) vSelectMobile.innerHTML = '';
                        progData.variations.forEach((v, idx) => {
                            let label = (idx + 1).toString();
                            if (v[0].type && v[0].type !== "A" && v[0].type !== "B") label = v[0].type;
                            if (v[0].name) { label = v[0].name; }
                            const opt = document.createElement('option'); opt.value = idx; opt.textContent = label; vSelect.appendChild(opt);
                            if(vSelectMobile) { const optM = document.createElement('option'); optM.value = idx; optM.textContent = label; vSelectMobile.appendChild(optM); }
                        });
                        if (vSelect) { vSelect.dataset.progId = progData.id; vSelect.value = 0; }
                        if (vSelectMobile) { vSelectMobile.dataset.progId = progData.id; vSelectMobile.value = 0; }
                    }
                }
                
                if (!preserveState) {
                    let selectedVar = 0;
                    if (vSelect && vSelect.value !== "" && vSelect.value !== undefined && vSelect.value !== "undefined") selectedVar = parseInt(vSelect.value);
                    else if (vSelectMobile && vSelectMobile.value !== "" && vSelectMobile.value !== undefined && vSelectMobile.value !== "undefined") selectedVar = parseInt(vSelectMobile.value);
                    if (isNaN(selectedVar) || !progData.variations || selectedVar >= progData.variations.length) selectedVar = 0;
                    
                    let variationData = progData.variations[selectedVar] || progData.variations[0];
                    currentActiveSections = JSON.parse(JSON.stringify(variationData));
                    
                    currentActiveSections.forEach(sec => {
                        if (sec.repeat) {
                            let blocks = sec.data.split('|').map(m => m.trim());
                            if (blocks.length > 0) {
                                if (!blocks[0].startsWith(':')) blocks[0] = ':' + blocks[0];
                                if (!blocks[blocks.length - 1].endsWith(':')) blocks[blocks.length - 1] = blocks[blocks.length - 1] + ':';
                            }
                            sec.data = blocks.join(' | '); sec.repeat = false; 
                        }
                    });
                }
            }

            const iivContainer = document.getElementById('iivToggleContainer');
            const iivContainerMobile = document.getElementById('iivToggleContainerMobile');
            
            if (progData.id === "secondary-dominants") {
                if (iivContainer) { iivContainer.classList.remove('hidden'); iivContainer.classList.add('flex'); }
                if (iivContainerMobile) { iivContainerMobile.classList.remove('hidden'); iivContainerMobile.classList.add('flex'); }
            } else {
                if (iivContainer) { iivContainer.classList.add('hidden'); iivContainer.classList.remove('flex'); }
                if (iivContainerMobile) { iivContainerMobile.classList.add('hidden'); iivContainerMobile.classList.remove('flex'); }
                relacionIIVActive = false;
                if(document.getElementById('relacionToggle')) document.getElementById('relacionToggle').checked = false;
                if(document.getElementById('relacionToggleMobile')) document.getElementById('relacionToggleMobile').checked = false;
            }

            if (!manualKeyChange) {
                if (keySelectVal) keySelectVal.value = progData.baseKey;
                if (keySelectMobileVal) keySelectMobileVal.value = progData.baseKey;
            }
            manualKeyChange = false; 

            const currentKey = keySelectVal ? keySelectVal.value : (keySelectMobileVal ? keySelectMobileVal.value : "C");
            const { stOffset, letterOffset } = getTranspositionOffsets(progData.baseKey, currentKey);
            
            visualMeasures = []; audioTimeline = [];
            
            const coltraneContainer = document.getElementById('coltraneGraphicContainer');
            if (progData.id === "multitonic-coltrane" && progData.id !== "custom") {
                if (coltraneContainer) coltraneContainer.classList.remove('hidden');
                renderColtraneGraphic(currentKey);
            } else {
                if (coltraneContainer) coltraneContainer.classList.add('hidden');
            }

            let audioUnrolledMeasures = []; let visualMap = []; let currentVisualIndex = 0;
            let sectionsToProcess = JSON.parse(JSON.stringify(currentActiveSections));

            sectionsToProcess.forEach((sec, secIdx) => {
                const rawBlocks = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                let sectionVisualMeasures = [];
                let skipNextBlock = false;

                for (let mIdx = 0; mIdx < rawBlocks.length; mIdx++) {
                    if (skipNextBlock) { skipNextBlock = false; continue; }
                    
                    let b = rawBlocks[mIdx];
                    let hasRepeatStart = b.startsWith(':'); let hasRepeatEnd = b.endsWith(':');
                    let content = b.replace(/^:/, '').replace(/:$/, '').trim();
                    
                    if (progData.id === "secondary-dominants" && relacionIIVActive) {
                        content = content.replace(/A7_SEC2/g, 'Em7(b5)_BKT_IIV A7_BKT_SEC2').replace(/B7_SEC3/g, 'F#m7(b5)_BKT_IIV B7_BKT_SEC3')
                                         .replace(/C7_SEC4/g, 'Gm7_BKT_IIV C7_BKT_SEC4').replace(/D7_SEC5/g, 'Am7_BKT_IIV D7_BKT_SEC5')
                                         .replace(/E7_SEC6/g, 'Bm7(b5)_BKT_IIV E7_BKT_SEC6');
                    }

                    let isEnd1 = content.includes('_END1');
                    let isEnd2 = content.includes('_END2');
                    
                    // Manejo Seguro si las casillas no están separadas por un PIPE |
                    if (isEnd1 && isEnd2) {
                        let c1Chords = content.replace('_END1', '').replace('_END2', '').split(/\s+/).map(c => transposeChordName(c, stOffset, letterOffset));
                        sectionVisualMeasures.push({ id: currentVisualIndex + mIdx, chords: c1Chords, colorClass: sec.color || 'bg-white dark:bg-slate-800', sectionName: null, hasRepeatStart: hasRepeatStart, hasRepeatEnd: hasRepeatEnd, isCombinedCasilla1: true });
                        continue;
                    }

                    if (isEnd1) {
                        let clean1 = content.replace('_END1', '');
                        let c1Chords = clean1.split(/\s+/).map((c) => transposeChordName(c, stOffset, letterOffset));
                        sectionVisualMeasures.push({ id: currentVisualIndex + mIdx, chords: c1Chords, colorClass: sec.color || 'bg-white dark:bg-slate-800', sectionName: null, hasRepeatStart: true, hasRepeatEnd: true, isCombinedCasilla1: true });
                        continue;
                    }
                    
                    if (isEnd2) {
                        let clean2 = content.replace('_END2', '');
                        let c2Chords = clean2.split(/\s+/).map((c) => transposeChordName(c, stOffset, letterOffset));
                        sectionVisualMeasures.push({ id: currentVisualIndex + mIdx, chords: c2Chords, colorClass: sec.color || 'bg-white dark:bg-slate-800', sectionName: null, hasRepeatStart: false, hasRepeatEnd: false, isCombinedCasilla2: true });
                        continue;
                    }

                    let chords = content.split(/\s+/).map((c, cIdx) => {
                        let transposed = transposeChordName(c, stOffset, letterOffset);
                        let overrideKey = `${currentVisualIndex + mIdx}_${cIdx}`;
                        let mutationState = 'normal';
                        if (globalTritone) mutationState = 'tritone';
                        if (globalDim) mutationState = 'dim0';
                        if (mutationOverrides[overrideKey] !== undefined) mutationState = mutationOverrides[overrideKey];

                        if (activeChordMutations[overrideKey]) {
                            let activeRoman = activeChordMutations[overrideKey].activeRoman;
                            if (activeRoman) {
                                transposed = romanToChord(activeRoman, currentKey, currentVisualIndex + mIdx);
                            }
                        } else if (isDominant(transposed)) {
                            if (mutationState === 'tritone') transposed = applyTritoneSub(transposed);
                            else if (mutationState.startsWith('dim')) {
                                let dimIdx = parseInt(mutationState.replace('dim', '')) || 0;
                                transposed = applyDimSub(transposed, dimIdx);
                            }
                        }
                        return transposed;
                    });

                    let isSectionStart = mIdx === 0 && (sec.type === 'A' || sec.type === 'B' || sec.type === 'Libre' || (sec.name && !sec.type));
                    
                    sectionVisualMeasures.push({
                        id: currentVisualIndex + mIdx, chords: chords, colorClass: sec.color || 'bg-white dark:bg-slate-800',
                        sectionName: isSectionStart ? (sec.name || sec.type) : null,
                        hasRepeatStart: hasRepeatStart, hasRepeatEnd: hasRepeatEnd,
                        forceLeftCol: (isSectionStart || (mIdx === 0 && secIdx > 0)) 
                    });
                }

                visualMeasures.push(...sectionVisualMeasures);
                
                let i = 0; let repeatStartIdx = -1;
                while (i < sectionVisualMeasures.length) {
                    let vm = sectionVisualMeasures[i];
                    if (vm.hasRepeatStart && !vm.isCombinedCasilla1) repeatStartIdx = i;

                    if (vm.isCombinedCasilla1) {
                        if (vm.chords && vm.chords.length > 0) { audioUnrolledMeasures.push(vm.chords); visualMap.push(vm.id); }
                        if (repeatStartIdx !== -1) {
                            for (let r = repeatStartIdx; r < i; r++) {
                                let rVm = sectionVisualMeasures[r];
                                if (rVm.chords && rVm.chords.length > 0) { audioUnrolledMeasures.push(rVm.chords); visualMap.push(rVm.id); }
                            }
                        }
                    } else if (vm.isCombinedCasilla2) {
                        if (vm.chords && vm.chords.length > 0) { audioUnrolledMeasures.push(vm.chords); visualMap.push(vm.id); }
                    } else {
                        if (vm.chords && vm.chords.length > 0) { audioUnrolledMeasures.push(vm.chords); visualMap.push(vm.id); }
                        if (vm.hasRepeatEnd && repeatStartIdx !== -1) {
                            for (let r = repeatStartIdx; r <= i; r++) {
                                let rVm = sectionVisualMeasures[r];
                                if (rVm.chords && rVm.chords.length > 0) { audioUnrolledMeasures.push(rVm.chords); visualMap.push(rVm.id); }
                            }
                            repeatStartIdx = -1;
                        }
                    }
                    i++;
                }
                currentVisualIndex += rawBlocks.length;
            });

            let prevMidiNotes = null;
            audioUnrolledMeasures.forEach((measureChords, measureIndex) => {
                let measureStartStep = measureIndex * 8;
                let nodesInMeasure = [];
                measureChords.forEach(chord => { let tagMatch = chord.match(/_(T\d|V\d|II\d)/i); if (tagMatch) nodesInMeasure.push(tagMatch[1].toLowerCase()); });

                measureChords.forEach((chord, chordIdx) => {
                    if (chord === "NC" || chord === "-" || chord === ":|") return;
                    let chordsInMeasure = measureChords.length;
                    let specificNodeMatch = chord.match(/_(T\d|V\d|II\d)/i);
                    let specificNodeId = specificNodeMatch ? specificNodeMatch[1].toLowerCase() : null;
                    
                    let notesData = computeNextVoicing(chord, prevMidiNotes);
                    prevMidiNotes = notesData.midi; 
                    
                    let stepOffset = (chordIdx * 4); 
                    let duration = chordsInMeasure === 2 ? "2n" : (chordsInMeasure === 4 ? "4n" : "1m");
                    let trimDuration = Tone.Time(duration).toSeconds() - 0.05;

                    audioTimeline[measureStartStep + stepOffset] = {
                        notes: notesData.toneNames, bass: notesData.bassNote, duration: trimDuration > 0 ? trimDuration : duration,
                        visualId: visualMap[measureIndex], svgNodeIds: specificNodeId ? [specificNodeId] : []
                    };
                    if (chordsInMeasure === 2 && chordIdx === 0) audioTimeline[measureStartStep + 4] = null;
                });
            });

            totalSteps = audioUnrolledMeasures.length * 8;
            updateGridRowStyles(); renderGrid(); updateStartMeasureLabel(); updateSizeSliderUI();
        }

        function getActualGridRows() {
            if (!visualMeasures || visualMeasures.length === 0) return 0;
            let rows = 1; let cols = 0;
            visualMeasures.forEach((vm, idx) => {
                if (vm.forceLeftCol || vm.isCombinedCasilla2) { 
                    if (cols > 0) { rows++; } 
                    cols = 1; 
                } else { 
                    cols++; 
                    if (cols > 4) { rows++; cols = 1; } 
                }
            });
            return rows;
        }

        function updateGridRowStyles() {
            const grid = document.getElementById('chordGrid');
            if (!grid || visualMeasures.length === 0) return;
            const totalRows = getActualGridRows();
            
            if (window.innerWidth <= 640) {
                if (totalRows <= 2) { grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(70px, 90px))`; grid.style.alignContent = 'start'; } 
                else if (totalRows <= 8) { grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(0, 1fr))`; grid.style.alignContent = 'stretch'; } 
                else { grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(45px, auto))`; grid.style.alignContent = 'start'; }
            } else {
                if (totalRows <= 8) { grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(0, 1fr))`; grid.style.alignContent = 'stretch'; } 
                else { grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(65px, auto))`; grid.style.alignContent = 'start'; }
            }
        }

        function renderGrid() {
            const grid = document.getElementById('chordGrid'); if(!grid) return; grid.innerHTML = '';
            const keySelectVal = document.getElementById('keySelect');
            const keySelectMobileVal = document.getElementById('keySelectMobile');
            const targetKey = (keySelectVal && keySelectVal.value) || (keySelectMobileVal && keySelectMobileVal.value) || "C";
            const totalRows = getActualGridRows();

            visualMeasures.forEach((vMeasure, index) => {
                const measureDiv = document.createElement('div'); measureDiv.id = `measure-${vMeasure.id}`;
                
                let classNames = `measure-box ${vMeasure.colorClass} border border-slate-300 dark:border-slate-600 sm:rounded-xl rounded pt-1 sm:pt-2`;
                
                if (vMeasure.forceLeftCol || vMeasure.isCombinedCasilla2) {
                    classNames += ' col-start-1';

        async function initAudio() {
            if (audioInitialized) return; 
            try {
                await Tone.start();
                const chorus = new Tone.Chorus({ frequency: 2, delayTime: 3.5, depth: 0.3 }).start();
                const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 }); reverb.wet.value = 0.2;
                
                piano = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 2, modulationIndex: 1.2, oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 } });
                bassSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.04, decay: 0.4, sustain: 0.3, release: 0.05 } });
                piano.chain(chorus, reverb, Tone.Destination); bassSynth.toDestination();
                Tone.Destination.volume.value = parseFloat(document.getElementById('volumeSlider') ? document.getElementById('volumeSlider').value : -6);

                Tone.Transport.scheduleRepeat((time) => {
                    const currentStep = step % totalSteps; 
                    
                    if (step > 0 && currentStep === 0) {
                        currentLoopCount++;
                        let lInput = document.getElementById('loopInput');
                        let loopVal = lInput ? lInput.value : (document.getElementById('loopInputMobile')?.value || "");
                        let maxLoops = (loopVal === "" || parseInt(loopVal) <= 0) ? Infinity : parseInt(loopVal);
                        
                        if (currentLoopCount >= maxLoops) {
                            Tone.Transport.pause(); isPlaying = false; updatePlayButtons(false); step = 0; currentLoopCount = 0; resetMetronome();
                            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active')); highlightSvgNode([]);
                            if (piano) piano.releaseAll(); if (bassSynth) bassSynth.triggerRelease(time); return; 
                        }
                    }
                    if (currentStep % 2 === 0) { let beatIdx = (currentStep % 8) / 2; Tone.Draw.schedule(() => updateMetronome(beatIdx), time); }
                    if (currentStep % 8 === 0) { let cMe = audioTimeline[currentStep]; if (cMe) Tone.Draw.schedule(() => highlightMeasure(cMe.visualId), time); }
                    const event = audioTimeline[currentStep];
                    if (event !== undefined) {
                        if (event && event.svgNodeIds) Tone.Draw.schedule(() => highlightSvgNode(event.svgNodeIds), time);
                        else if (event !== null) Tone.Draw.schedule(() => highlightSvgNode([]), time);
                        if (event !== null) {
                            if (!isPianoMuted) piano.triggerAttackRelease(event.notes, event.duration, time);
                            if (!isBassMuted) bassSynth.triggerAttackRelease(event.bass, event.duration, time);
                        }
                    }
                    step++;
                }, "8n");
                Tone.Transport.bpm.value = parseInt(document.getElementById('tempoSlider') ? document.getElementById('tempoSlider').value : 120);
                audioInitialized = true;
            } catch(e) {

            }

        function toggleRepeatSymbol(type) {
            if (!currentActiveSections || currentActiveSections.length === 0 || selectedStartMeasure === -1) return;
            let currentVisualIndex = 0; let found = false;
            for (let s = 0; s < currentActiveSections.length; s++) {
                let sec = currentActiveSections[s];
                let blocks = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                for (let b = 0; b < blocks.length; b++) {
                    if (currentVisualIndex === selectedStartMeasure) {
                        let block = blocks[b];
                        if (type === 'start') {
                            if (block.startsWith(':')) block = block.replace(/^:\s*/, ''); else block = ':' + block;
                        } else if (type === 'end') {
                            if (block.endsWith(':')) block = block.replace(/\s*:$/, ''); else block = block + ':';
                        }
                        blocks[b] = block; sec.data = blocks.join(' | '); found = true; break;
                    }
                    currentVisualIndex++;
                }
                if (found) break;
            }
            if (found) {
                let pSelectVal = document.getElementById('progressionSelect')?.value || document.getElementById('progressionSelectMobile')?.value || 0;
                let progIndex = parseInt(pSelectVal); if (isNaN(progIndex)) progIndex = 0;
                const progData = progressionLibrary[progIndex];
                if (progData.id === 'custom') {
                    const customProgInput = document.getElementById('customProgInput');
                    if (customProgInput) customProgInput.value = currentActiveSections.map(s => s.data).join(' | ');
                }
                const wasPlaying = isPlaying;
                if (wasPlaying) stopProgression();
                loadAndCompileProgression(true);
                updateURLState();
                if (wasPlaying) setTimeout(() => playProgression(), 50);
            }
        }

        document.getElementById('addRepeatStartBtn')?.addEventListener('click', () => toggleRepeatSymbol('start'));
        document.getElementById('addRepeatEndBtn')?.addEventListener('click', () => toggleRepeatSymbol('end'));

        function debounce(func, wait) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); }; }
        const handleCustomInput = debounce((val) => {
            const wasPlaying = isPlaying; if (wasPlaying) stopProgression();
            selectedStartMeasure = -1; loadAndCompileProgression(false); updateURLState(); if (wasPlaying) setTimeout(() => playProgression(), 50);
        }, 800);
        
        document.getElementById('customProgInput')?.addEventListener('input', (e) => handleCustomInput(e.target.value));

        function insertTextAtCursor(inputId, textToInsert) {
            const input = document.getElementById(inputId); if (!input) return;
            const start = input.selectionStart; const end = input.selectionEnd; const text = input.value;
            const before = text.substring(0, start); const after = text.substring(end);
            let insertStr = textToInsert;
            if (before.length > 0 && !before.endsWith(" ")) insertStr = " " + insertStr;
            if (after.length > 0 && !after.startsWith(" ")) insertStr = insertStr + " ";
            input.value = before + insertStr + after; input.selectionStart = input.selectionEnd = start + insertStr.length;
            input.focus(); handleCustomInput(input.value);
        }
        
        document.getElementById('insertPipeBtn')?.addEventListener('click', () => insertTextAtCursor('customProgInput', '|'));

        document.getElementById('chordGrid')?.addEventListener('click', (e) => {
            const chordEl = e.target.closest('.chord-text');
            if (chordEl) {
                let vMeasureId = parseInt(chordEl.dataset.mid);
                let chordIdx = parseInt(chordEl.dataset.cid);
                let overrideKey = `${vMeasureId}_${chordIdx}`;

                if (chordEl.classList.contains('is-diatonic-sub')) {
                    e.stopPropagation();
                    const keySelectVal = document.getElementById('keySelect');
                    const keySelectMobileVal = document.getElementById('keySelectMobile');
                    const targetKey = (keySelectVal && keySelectVal.value) || (keySelectMobileVal && keySelectMobileVal.value) || "C";
                    
                    let state = activeChordMutations[overrideKey];
                    
                    if (!state) {
                        let vm = visualMeasures.find(m => m.id == vMeasureId);
                        if (vm) {
                            let currentChordStr = vm.chords[chordIdx];
                            let cleanC = currentChordStr.replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_DIM\d?|_BKT|_END1|_END2/g, '');
                            let baseRoman = getBaseRomanForSubstitutionLogic(cleanC, targetKey, vMeasureId);
                            
                            if (diatonicSubstitutions[baseRoman]) {
                                activeChordMutations[overrideKey] = {
                                    baseRoman: baseRoman,
                                    currentIndex: 0,
                                    activeRoman: diatonicSubstitutions[baseRoman][0]
                                };
                            }
                        }
                    } else {
                        let options = diatonicSubstitutions[state.baseRoman];
                        state.currentIndex++;
                        if (state.currentIndex >= options.length) { 
                            delete activeChordMutations[overrideKey]; 
                        } else {
                            state.activeRoman = options[state.currentIndex];
                        }
                    }
                    
                    const wasPlaying = isPlaying;
                    if (wasPlaying) stopProgression();
                    loadAndCompileProgression(true);
                    if (wasPlaying) setTimeout(() => playProgression(), 50);
                    return;
                } else if (chordEl.classList.contains('is-dominant')) {
                    e.stopPropagation(); 
                    
                    if (activeChordMutations[overrideKey]) return; 

                    let current = mutationOverrides[overrideKey] || (globalTritone ? 'tritone' : (globalDim ? 'dim0' : 'normal'));
                    
                    if (current === 'normal') mutationOverrides[overrideKey] = 'tritone';
                    else if (current === 'tritone') mutationOverrides[overrideKey] = 'dim0';
                    else if (current === 'dim' || current === 'dim0') mutationOverrides[overrideKey] = 'dim1';
                    else if (current === 'dim1') mutationOverrides[overrideKey] = 'dim2';
                    else if (current === 'dim2') mutationOverrides[overrideKey] = 'dim3';
                    else mutationOverrides[overrideKey] = 'normal';
                    
                    loadAndCompileProgression(true);
                    return;
                }
            }
            
            const measureBox = e.target.closest('.measure-box');
            if (measureBox) { 
                let index = parseInt(measureBox.dataset.index);
                if (selectedStartMeasure === index) {
                    selectedStartMeasure = -1; 
                } else {
                    selectedStartMeasure = index;
                }
                renderGrid(); 
                updateStartMeasureLabel(); 
                updateSizeSliderUI();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            restoreStateOnLoad();
            loadAndCompileProgression(false);
        });
    </script>
</body>
</html>
