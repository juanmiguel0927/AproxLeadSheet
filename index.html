        function isDominant(chordStr) {
            if (chordStr === "NC" || chordStr === "-") return false;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return false;
            const mainQuality = match[2].split('/')[0].replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_DIM|_BKT/g, '');
            return (mainQuality.startsWith('7') || mainQuality.startsWith('9') || mainQuality.startsWith('13') || mainQuality.startsWith('dim') || mainQuality.startsWith('o')) 
                && !mainQuality.includes('maj') && !mainQuality.includes('m');
        }

        function extractTags(chordStr) {
            let tags = ""; let clean = chordStr;
            const match = chordStr.match(/(_[A-Z0-9]+)+$/);
            if (match) { tags = match[0]; clean = chordStr.substring(0, chordStr.length - tags.length); }
            return { clean, tags };
        }

        function applyTritoneSub(chordStr) {
            let { clean, tags } = extractTags(chordStr);
            let extraTags = ""; if (clean.includes('_BKT')) { extraTags += "_BKT"; clean = clean.replace('_BKT', ''); }
            const match = clean.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1]; let quality = match[2];
            if (quality.includes('/')) quality = quality.split('/')[0]; 
            return (tritoneRootMap[root] || root) + quality + tags + extraTags + "_SUB";
        }

        function applyDimSub(chordStr) {
            let { clean, tags } = extractTags(chordStr);
            let extraTags = ""; if (clean.includes('_BKT')) { extraTags += "_BKT"; clean = clean.replace('_BKT', ''); }
            const match = clean.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1];
            let newRoot = dimRootMap[root] || root;
            return newRoot + "dim7" + tags + extraTags + "_DIM";
        }

        function toggleRepeatSymbol(type) {
            if (!currentActiveSections || currentActiveSections.length === 0) return;
            let currentVisualIndex = 0; let found = false;
            for (let s = 0; s < currentActiveSections.length; s++) {
                let sec = currentActiveSections[s];
                let blocks = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                for (let b = 0; b < blocks.length; b++) {
                    if (currentVisualIndex === selectedStartMeasure) {
                        let block = blocks[b];
                        if (type === 'start') {
                            if (block.startsWith(':')) block = block.replace(/^:\s*/, ''); else block = ':' + block;
                        } else if (type === 'end') {
                            if (block.endsWith(':')) block = block.replace(/\s*:$/, ''); else block = block + ':';
                        }
                        blocks[b] = block; sec.data = blocks.join(' | '); found = true; break;
                    }
                    currentVisualIndex++;
                }
                if (found) break;
            }
            if (found) {
                let pSelectVal = progressionSelect.value || progressionSelectMobile.value || 0;
                let progIndex = parseInt(pSelectVal); if (isNaN(progIndex)) progIndex = 0;
                const progData = progressionLibrary[progIndex];
                if (progData.id === 'custom') {
                    const customProgInput = document.getElementById('customProgInput');
                    if (customProgInput) customProgInput.value = currentActiveSections.map(s => s.data).join(' | ');
                }
                const wasPlaying = isPlaying;
                if (wasPlaying) stopProgression();
                loadAndCompileProgression(true);
                if (wasPlaying) setTimeout(() => playProgression(), 50);
            }
        }

        function loadAndCompileProgression(preserveState = false) {
            if (!preserveState) mutationOverrides = {};
            
            let pSelectVal = progressionSelect.value;
            if (!pSelectVal && progressionSelectMobile) pSelectVal = progressionSelectMobile.value;
            let progIndex = parseInt(pSelectVal);
            
            if (isNaN(progIndex)) progIndex = 0;
            if (progIndex >= progressionLibrary.length) progIndex = 0;
            
            const progData = progressionLibrary[progIndex] || progressionLibrary[0];
            
            let tSelectVal = keySelect.value;
            if (!tSelectVal && keySelectMobile) tSelectVal = keySelectMobile.value;
            const targetKey = tSelectVal || "C";
            
            const vContainer = document.getElementById('variationContainer'); const vSelect = document.getElementById('variationSelect');
            const vContainerMobile = document.getElementById('variationContainerMobile'); const vSelectMobile = document.getElementById('variationSelectMobile');
            const customInputContainer = document.getElementById('customInputContainer');

            if (progData.id === "custom") {
                if (customInputContainer) customInputContainer.classList.remove('hidden');
                if (vContainer) { vContainer.classList.add('hidden'); vContainer.classList.remove('flex'); }
                if (vContainerMobile) { vContainerMobile.classList.add('hidden'); vContainerMobile.classList.remove('flex'); }
                
                const customProgInput = document.getElementById('customProgInput');
                let val = customProgInput.value.trim() === "" ? "Cmaj7 | Dm7 | G7 | Cmaj7" : customProgInput.value;
                if (!preserveState) {
                    currentActiveSections = [{ type: "Libre", color: "bg-white dark:bg-slate-800", repeat: false, data: val }];
                }
            } else {
                if (customInputContainer) customInputContainer.classList.add('hidden');
                
                if (progData.variations) {
                    if (vContainer) { vContainer.classList.remove('hidden'); vContainer.classList.add('flex'); }
                    if (vContainerMobile) { vContainerMobile.classList.remove('hidden'); vContainerMobile.classList.add('flex'); }
                    
                    if (vSelect && vSelect.dataset.progId !== progData.id) {
                        vSelect.innerHTML = ''; if(vSelectMobile) vSelectMobile.innerHTML = '';
                        progData.variations.forEach((v, idx) => {
                            let label = (idx + 1).toString();
                            if (v[0].type && v[0].type !== "A" && v[0].type !== "B") label = v[0].type;
                            if (v[0].name) { label = v[0].name; }
                            const opt = document.createElement('option'); opt.value = idx; opt.textContent = label; vSelect.appendChild(opt);
                            if(vSelectMobile) { const optM = document.createElement('option'); optM.value = idx; optM.textContent = label; vSelectMobile.appendChild(optM); }
                        });
                        if (vSelect) { vSelect.dataset.progId = progData.id; vSelect.value = 0; }
                        if (vSelectMobile) { vSelectMobile.dataset.progId = progData.id; vSelectMobile.value = 0; }
                    }
                }
                
                if (!preserveState) {
                    let selectedVar = 0;
                    if (vSelect && vSelect.value !== "" && vSelect.value !== undefined && vSelect.value !== "undefined") selectedVar = parseInt(vSelect.value);
                    else if (vSelectMobile && vSelectMobile.value !== "" && vSelectMobile.value !== undefined && vSelectMobile.value !== "undefined") selectedVar = parseInt(vSelectMobile.value);
                    if (isNaN(selectedVar) || !progData.variations || selectedVar >= progData.variations.length) selectedVar = 0;
                    
                    let variationData = progData.variations[selectedVar] || progData.variations[0];
                    currentActiveSections = JSON.parse(JSON.stringify(variationData));
                    
                    currentActiveSections.forEach(sec => {
                        if (sec.repeat) {
                            let blocks = sec.data.split('|').map(m => m.trim());
                            if (blocks.length > 0) {
                                if (!blocks[0].startsWith(':')) blocks[0] = ':' + blocks[0];
                                if (!blocks[blocks.length - 1].endsWith(':')) blocks[blocks.length - 1] = blocks[blocks.length - 1] + ':';
                            }
                            sec.data = blocks.join(' | '); sec.repeat = false; 
                        }
                    });
                }
            }

            const iivContainer = document.getElementById('iivToggleContainer');
            const iivContainerMobile = document.getElementById('iivToggleContainerMobile');
            
            if (progData.id === "secondary-dominants") {
                if (iivContainer) { iivContainer.classList.remove('hidden'); iivContainer.classList.add('flex'); }
                if (iivContainerMobile) { iivContainerMobile.classList.remove('hidden'); iivContainerMobile.classList.add('flex'); }
            } else {
                if (iivContainer) { iivContainer.classList.add('hidden'); iivContainer.classList.remove('flex'); }
                if (iivContainerMobile) { iivContainerMobile.classList.add('hidden'); iivContainerMobile.classList.remove('flex'); }
                relacionIIVActive = false;
                if(document.getElementById('relacionToggle')) document.getElementById('relacionToggle').checked = false;
                if(document.getElementById('relacionToggleMobile')) document.getElementById('relacionToggleMobile').checked = false;
            }

            if (!manualKeyChange) {
                if (keySelect) keySelect.value = progData.baseKey;
                if (keySelectMobile) keySelectMobile.value = progData.baseKey;
            }
            manualKeyChange = false; 

            const currentKey = keySelect ? keySelect.value : (keySelectMobile ? keySelectMobile.value : "C");
            const { stOffset, letterOffset } = getTranspositionOffsets(progData.baseKey, currentKey);
            
            visualMeasures = []; audioTimeline = [];
            
            const coltraneContainer = document.getElementById('coltraneGraphicContainer');
            if (progData.id === "multitonic-coltrane" && progData.id !== "custom") {
                if (coltraneContainer) coltraneContainer.classList.remove('hidden');
                renderColtraneGraphic(currentKey);
            } else {
                if (coltraneContainer) coltraneContainer.classList.add('hidden');
            }

            let audioUnrolledMeasures = []; let visualMap = []; let currentVisualIndex = 0;
            let sectionsToProcess = JSON.parse(JSON.stringify(currentActiveSections));

            sectionsToProcess.forEach(sec => {
                const rawBlocks = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                let sectionVisualMeasures = [];

                rawBlocks.forEach((b, mIdx) => {
                    let hasRepeatStart = b.startsWith(':'); let hasRepeatEnd = b.endsWith(':');
                    let content = b.replace(/^:/, '').replace(/:$/, '').trim();
                    
                    if (progData.id === "secondary-dominants" && relacionIIVActive) {
                        content = content.replace(/A7_SEC2/g, 'Em7(b5)_BKT_IIV A7_BKT_SEC2').replace(/B7_SEC3/g, 'F#m7(b5)_BKT_IIV B7_BKT_SEC3')
                                         .replace(/C7_SEC4/g, 'Gm7_BKT_IIV C7_BKT_SEC4').replace(/D7_SEC5/g, 'Am7_BKT_IIV D7_BKT_SEC5')
                                         .replace(/E7_SEC6/g, 'Bm7(b5)_BKT_IIV E7_BKT_SEC6');
                    }

                    let chords = content.split(/\s+/).map((c, cIdx) => {
                        let transposed = transposeChordName(c, stOffset, letterOffset);
                        let overrideKey = `${currentVisualIndex + mIdx}_${cIdx}`;
                        let mutationState = 'normal';
                        if (globalTritone) mutationState = 'tritone';
                        if (globalDim) mutationState = 'dim';
                        if (mutationOverrides[overrideKey] !== undefined) mutationState = mutationOverrides[overrideKey];

                        if (isDominant(transposed)) {
                            if (mutationState === 'tritone') transposed = applyTritoneSub(transposed);
                            else if (mutationState === 'dim') transposed = applyDimSub(transposed);
                        }
                        return transposed;
                    });

                    sectionVisualMeasures.push({
                        id: currentVisualIndex + mIdx, chords: chords, colorClass: sec.color || 'bg-white dark:bg-slate-800',
                        sectionName: mIdx === 0 && (sec.type === 'A' || sec.type === 'B' || sec.type === 'Libre') ? sec.type : null,
                        hasRepeatStart: hasRepeatStart, hasRepeatEnd: hasRepeatEnd
                    });
                });

                visualMeasures.push(...sectionVisualMeasures);
                let i = 0; let repeatStartIdx = -1;
                
                while (i < sectionVisualMeasures.length) {
                    let vm = sectionVisualMeasures[i];
                    if (vm.hasRepeatStart) repeatStartIdx = i;
                    audioUnrolledMeasures.push(vm.chords); visualMap.push(vm.id);
                    if (vm.hasRepeatEnd && repeatStartIdx !== -1) {
                        for (let r = repeatStartIdx; r <= i; r++) { audioUnrolledMeasures.push(sectionVisualMeasures[r].chords); visualMap.push(sectionVisualMeasures[r].id); }
                        repeatStartIdx = -1;
                    }
                    i++;
                }
                currentVisualIndex += sectionVisualMeasures.length;
            });

            let prevMidiNotes = null;
            audioUnrolledMeasures.forEach((measureChords, measureIndex) => {
                let measureStartStep = measureIndex * 8;
                let nodesInMeasure = [];
                measureChords.forEach(chord => { let tagMatch = chord.match(/_(T\d|V\d|II\d)/i); if (tagMatch) nodesInMeasure.push(tagMatch[1].toLowerCase()); });

                measureChords.forEach((chord, chordIdx) => {
                    if (chord === "NC" || chord === "-") return;
                    let chordsInMeasure = measureChords.length;
                    let specificNodeMatch = chord.match(/_(T\d|V\d|II\d)/i);
                    let specificNodeId = specificNodeMatch ? specificNodeMatch[1].toLowerCase() : null;
                    
                    let notesData = computeNextVoicing(chord, prevMidiNotes);
                    prevMidiNotes = notesData.midi; 
                    
                    let stepOffset = (chordIdx * 4); 
                    let duration = chordsInMeasure === 2 ? "2n" : (chordsInMeasure === 4 ? "4n" : "1m");
                    let trimDuration = Tone.Time(duration).toSeconds() - 0.05;

                    audioTimeline[measureStartStep + stepOffset] = {
                        notes: notesData.toneNames, bass: notesData.bassNote, duration: trimDuration > 0 ? trimDuration : duration,
                        visualId: visualMap[measureIndex], svgNodeIds: specificNodeId ? [specificNodeId] : []
                    };
                    if (chordsInMeasure === 2 && chordIdx === 0) audioTimeline[measureStartStep + 4] = null;
                });
            });

            totalSteps = audioUnrolledMeasures.length * 8;
            if (selectedStartMeasure >= visualMeasures.length) selectedStartMeasure = 0;
            updateGridRowStyles(); renderGrid(); updateStartMeasureLabel();
        }

        function updateGridRowStyles() {
            const grid = document.getElementById('chordGrid');
            if (!grid || visualMeasures.length === 0) return;
            const totalRows = Math.ceil(visualMeasures.length / 4);
            
            if (window.innerWidth <= 640) {
                if (totalRows <= 2) {
                    grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(70px, 90px))`;
                    grid.style.alignContent = 'start';
                } else if (totalRows > 4 && totalRows <= 8) {
                    grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(0, 1fr))`;
                    grid.style.alignContent = 'stretch';
                } else {
                    grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(45px, auto))`;
                    grid.style.alignContent = 'start';
                }
            } else {
                if (totalRows > 4 && totalRows <= 8) {
                    grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(0, 1fr))`;
                    grid.style.alignContent = 'stretch';
                } else {
                    grid.style.gridTemplateRows = `repeat(${totalRows}, minmax(60px, auto))`;
                    grid.style.alignContent = 'start';
                }
            }
        }

        function renderGrid() {
            const grid = document.getElementById('chordGrid'); if(!grid) return; grid.innerHTML = '';
            
            // NUEVO: Aplicar el factor de escala del usuario al contenedor
            const userSize = document.getElementById('sizeSlider')?.value || 100;
            grid.style.fontSize = `${userSize}%`;

            const targetKey = keySelect.value || (document.getElementById('keySelectMobile') && document.getElementById('keySelectMobile').value) || "C";
            const totalRows = Math.ceil(visualMeasures.length / 4);

            visualMeasures.forEach((vMeasure, index) => {
                const measureDiv = document.createElement('div'); measureDiv.id = `measure-${vMeasure.id}`;
                
                let classNames = `measure-box ${vMeasure.colorClass} border border-slate-300 dark:border-slate-600 sm:rounded-xl rounded`;
                if (vMeasure.sectionName) { classNames += ' pt-4 pb-1 sm:pt-6'; } 
                else { classNames += ' py-1 sm:py-2'; }

                if (vMeasure.hasRepeatStart) classNames += ' repeat-start text-blue-600';
                if (vMeasure.hasRepeatEnd) classNames += ' repeat-end text-blue-600';
                if (index === selectedStartMeasure) classNames += ' ring-2 ring-blue-500 bg-blue-50/40 dark:bg-blue-900/40';
                measureDiv.className = classNames;
                
                let rehearsalMarkHTML = '';
                if (vMeasure.sectionName) rehearsalMarkHTML = `<div class="absolute top-0 left-0 text-[8px] sm:text-[11px] font-bold text-white bg-blue-500 px-1 py-0.5 sm:px-1.5 rounded-br md:rounded-br-lg shadow-sm z-10 tracking-wider leading-none">${vMeasure.sectionName}</div>`;

                let renderedTexts = vMeasure.chords.map(c => {
                    let cleanC = c.replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_DIM|_BKT/g, '');
                    return romanMode ? convertToRoman(c, targetKey) : cleanC;
                });
                
                let totalChars = renderedTexts.join("").length;
                let hasBrackets = vMeasure.chords.some(ch => ch.includes('_BKT'));
                
                if (hasBrackets) totalChars += 2; 
                if (vMeasure.chords.length > 1) totalChars += 1; 

                let textSizeClass = "";
                
                // NUEVO: Todas las tipografías ahora usan "em" relativo para heredar la escala del usuario
                if (totalRows >= 8) { // 32 compases (Rhythm Changes)
                    if (totalChars > 18) textSizeClass = "text-[0.35em] sm:text-[0.45em] tracking-tighter";
                    else if (totalChars > 16) textSizeClass = "text-[0.45em] sm:text-[0.75em] md:text-[1em] lg:text-[1.125em] tracking-tighter";
                    else if (totalChars <= 4) textSizeClass = "text-[0.95em] sm:text-[1.25em] md:text-[1.875em] lg:text-[2.25em]";
                    else if (totalChars <= 7) textSizeClass = "text-[0.85em] sm:text-[1.125em] md:text-[1.5em] lg:text-[1.875em] tracking-tight";
                    else if (totalChars <= 11) textSizeClass = "text-[0.75em] sm:text-[1em] md:text-[1.25em] lg:text-[1.5em] tracking-tighter";
                    else if (totalChars <= 14) textSizeClass = "text-[0.65em] sm:text-[0.875em] md:text-[1.125em] lg:text-[1.25em] tracking-tighter";
                    else textSizeClass = "text-[0.55em] sm:text-[0.75em] md:text-[1em] lg:text-[1.125em] tracking-tighter";
                } else if (totalRows >= 4) { // 16 compases (Coltrane, etc)
                    if (totalChars > 18) textSizeClass = "text-[0.45em] sm:text-[0.55em] tracking-tighter";
                    else if (totalChars > 16) textSizeClass = "text-[0.55em] sm:text-[0.75em] md:text-[1.125em] lg:text-[1.25em] tracking-tighter";
                    else if (totalChars <= 4) textSizeClass = "text-[1.1em] sm:text-[1.875em] md:text-[3em] lg:text-[3.75em]";
                    else if (totalChars <= 7) textSizeClass = "text-[0.95em] sm:text-[1.5em] md:text-[2.25em] lg:text-[3em]";
                    else if (totalChars <= 11) textSizeClass = "text-[0.85em] sm:text-[1.25em] md:text-[1.875em] lg:text-[2.25em] tracking-tight";
                    else if (totalChars <= 14) textSizeClass = "text-[0.75em] sm:text-[1.125em] md:text-[1.5em] lg:text-[1.875em] tracking-tighter";
                    else textSizeClass = "text-[0.65em] sm:text-[1em] md:text-[1.25em] lg:text-[1.5em] tracking-tighter";
                } else { // 1 a 3 filas (4 a 12 compases)
                    if (totalChars > 18) textSizeClass = "text-[0.55em] sm:text-[0.65em] tracking-tighter";
                    else if (totalChars > 16) textSizeClass = "text-[0.65em] sm:text-[0.75em] md:text-[1.25em] lg:text-[1.5em] tracking-tighter";
                    else if (totalChars <= 4) textSizeClass = "text-[1.3em] sm:text-[1.875em] md:text-[3em] lg:text-[3.75em]";
                    else if (totalChars <= 7) textSizeClass = "text-[1.1em] sm:text-[1.5em] md:text-[2.25em] lg:text-[3em]";
                    else if (totalChars <= 11) textSizeClass = "text-[1em] sm:text-[1.25em] md:text-[1.875em] lg:text-[2.25em] tracking-tight";
                    else if (totalChars <= 14) textSizeClass = "text-[0.85em] sm:text-[1.125em] md:text-[1.5em] lg:text-[1.875em] tracking-tighter";
                    else textSizeClass = "text-[0.75em] sm:text-[1em] md:text-[1.25em] lg:text-[1.5em] tracking-tighter";
                }

                let adaptiveGapClass = "gap-[1px] sm:gap-2 md:gap-4"; 
                
                const processChord = (c, chordIdx, vMeasureId, textStr) => {
                    let color = "text-slate-800 dark:text-slate-100"; 
                    let isSubbed = c.includes('_SUB'); let isDimmed = c.includes('_DIM');
                    let cleanC = c.replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_DIM|_BKT/g, '');
                    let isDom = isSubbed || isDimmed || isDominant(cleanC);

                    if (isSubbed) color = "text-amber-500 dark:text-amber-400 font-bold border-b-[1.5px] md:border-b-2 border-amber-500 border-dashed is-subbed is-dominant";
                    else if (isDimmed) color = "text-pink-500 dark:text-pink-400 font-bold border-b-[1.5px] md:border-b-2 border-pink-500 border-dashed is-dimmed is-dominant";
                    else if (c.includes('_T1')) color = "text-blue-500 font-black"; 
                    else if (c.includes('_T2')) color = "text-red-500 font-black"; 
                    else if (c.includes('_T3')) color = "text-amber-500 font-black"; 
                    else if (isDom) color += " is-dominant";

                    let intClasses = "pointer-events-auto "; let tooltip = "";
                    if (isDom) { intClasses += "cursor-pointer hover:text-amber-500 dark:hover:text-amber-400 transition-colors relative z-20"; tooltip = 'title="Clic para mutar acorde dominante"'; }
                    
                    return `<span class="chord-text font-bold ${color} ${intClasses} ${textSizeClass}" data-mid="${vMeasureId}" data-cid="${chordIdx}" ${tooltip}>${textStr}</span>`;
                };

                let measureChordsHTML = '';
                let inBracket = false;
                vMeasure.chords.forEach((c, i) => {
                    let textStr = renderedTexts[i];
                    let isBkt = c.includes('_BKT');
                    let hasDim = vMeasure.chords.some(ch => ch.includes('_DIM') && ch.includes('_BKT'));
                    
                    if (isBkt && !inBracket) {
                        let bktClass = hasDim ? 'ii-v-bracket-dim' : '';
                        let bktPadClass = totalChars > 14 ? "px-[3px]" : "px-[4px] sm:px-2";
                        measureChordsHTML += `<div class="bracket-container ii-v-bracket ${bktClass} ${bktPadClass} ${adaptiveGapClass}">`;
                        inBracket = true;
                    } else if (!isBkt && inBracket) {
                        measureChordsHTML += `</div>`;
                        inBracket = false;
                    }
                    measureChordsHTML += processChord(c, i, vMeasure.id, textStr);
                    if (isBkt && i === vMeasure.chords.length - 1) { measureChordsHTML += `</div>`; }
                });
                
                measureDiv.innerHTML = `
                    <div class="absolute top-0 right-1 text-[8px] sm:text-[10px] text-slate-400 font-mono z-10">${index + 1}</div>
                    ${rehearsalMarkHTML}
                    <div class="flex flex-row items-center justify-center w-full h-full px-0.5 sm:px-1 flex-nowrap content-center text-center overflow-hidden ${adaptiveGapClass}">
                        ${measureChordsHTML}
                    </div>
                `;
                measureDiv.dataset.index = index; grid.appendChild(measureDiv);
            });
        }

        window.addEventListener('resize', updateGridRowStyles);

        function updateStartMeasureLabel() { const ind = document.getElementById('startMeasureIndicator'); if (ind) ind.textContent = `Sel: ${selectedStartMeasure + 1}`; }

        function highlightMeasure(visualId) {
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            const activeEl = document.getElementById(`measure-${visualId}`);
            if (activeEl) {
                activeEl.classList.add('measure-active');
                if (isPlaying) { 
                    const container = document.getElementById('gridScrollContainer');
                    if (container) {
                        const rect = activeEl.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();
                        if (rect.bottom > containerRect.bottom || rect.top < containerRect.top) {
                            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            }
        }

        function highlightSvgNode(nodeIdsArray) {
            document.querySelectorAll('.coltrane-node').forEach(el => el.classList.remove('active-node'));
            if (nodeIdsArray && nodeIdsArray.length > 0) { 
                nodeIdsArray.forEach(nodeId => {
                    const activeNode = document.getElementById(`svg-node-${nodeId}`); 
                    if (activeNode) activeNode.classList.add('active-node'); 
                });
            }
        }

        function updateMetronome(beatIndex) {
            document.querySelectorAll('.metronome-dot').forEach((dot, index) => {
                dot.classList.remove('active', 'active-beat1');
                if (index === beatIndex) { dot.classList.add('active'); if (beatIndex === 0) dot.classList.add('active-beat1'); }
            });
        }
        function resetMetronome() { document.querySelectorAll('.metronome-dot').forEach(dot => dot.classList.remove('active', 'active-beat1')); }

        let piano, bassSynth; let isPlaying = false; let step = 0; let audioInitialized = false;

        async function initAudio() {
            if (audioInitialized) return; await Tone.start();
            const chorus = new Tone.Chorus({ frequency: 2, delayTime: 3.5, depth: 0.3 }).start();
            const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 }); reverb.wet.value = 0.2;
            
            piano = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 2, modulationIndex: 1.2, oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 } });
            bassSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.04, decay: 0.4, sustain: 0.3, release: 0.05 } });
            piano.chain(chorus, reverb, Tone.Destination); bassSynth.toDestination();
            Tone.Destination.volume.value = parseFloat(document.getElementById('volumeSlider') ? document.getElementById('volumeSlider').value : -6);

            Tone.Transport.scheduleRepeat((time) => {
                const currentStep = step % totalSteps; 
                
                if (step > 0 && currentStep === 0) {
                    currentLoopCount++;
                    let lInput = document.getElementById('loopInput');
                    let loopVal = lInput ? lInput.value : (document.getElementById('loopInputMobile')?.value || "");
                    let maxLoops = (loopVal === "" || parseInt(loopVal) <= 0) ? Infinity : parseInt(loopVal);
                    
                    if (currentLoopCount >= maxLoops) {
                        Tone.Transport.pause(); isPlaying = false; updatePlayButtons(false); step = 0; currentLoopCount = 0; resetMetronome();
                        document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active')); highlightSvgNode([]);
                        if (piano) piano.releaseAll(); if (bassSynth) bassSynth.triggerRelease(time); return; 
                    }
                }
                if (currentStep % 2 === 0) { let beatIdx = (currentStep % 8) / 2; Tone.Draw.schedule(() => updateMetronome(beatIdx), time); }
                if (currentStep % 8 === 0) { let cMe = audioTimeline[currentStep]; if (cMe) Tone.Draw.schedule(() => highlightMeasure(cMe.visualId), time); }
                const event = audioTimeline[currentStep];
                if (event !== undefined) {
                    if (event && event.svgNodeIds) Tone.Draw.schedule(() => highlightSvgNode(event.svgNodeIds), time);
                    else if (event !== null) Tone.Draw.schedule(() => highlightSvgNode([]), time);
                    if (event !== null) {
                        if (!isPianoMuted) piano.triggerAttackRelease(event.notes, event.duration, time);
                        if (!isBassMuted) bassSynth.triggerAttackRelease(event.bass, event.duration, time);
                    }
                }
                step++;
            }, "8n");
            Tone.Transport.bpm.value = parseInt(document.getElementById('tempoSlider') ? document.getElementById('tempoSlider').value : 120);
            audioInitialized = true;
        }

        const progressionSelect = document.getElementById('progressionSelect'); const progressionSelectMobile = document.getElementById('progressionSelectMobile');
        const keySelect = document.getElementById('keySelect'); const keySelectMobile = document.getElementById('keySelectMobile');
        const htmlElement = document.documentElement;

        progressionLibrary.forEach((prog, index) => {
            const option = document.createElement('option'); option.value = index; option.textContent = prog.name;
            if(progressionSelect) progressionSelect.appendChild(option);
            const optM = document.createElement('option'); optM.value = index; optM.textContent = prog.name;
            if(progressionSelectMobile) progressionSelectMobile.appendChild(optM);
        });

        allKeys.forEach(key => {
            const option = document.createElement('option'); option.value = key; option.textContent = key;
            if(keySelect) keySelect.appendChild(option);
            const optM = document.createElement('option'); optM.value = key; optM.textContent = key;
            if(keySelectMobile) keySelectMobile.appendChild(optM);
        });

        function toggleTheme() { 
            htmlElement.classList.toggle('dark'); const isDark = htmlElement.classList.contains('dark');
            document.querySelectorAll('#themeToggleBtn').forEach(btn => { if(btn) btn.innerHTML = isDark ? '<i class="fa-solid fa-sun text-lg"></i>' : '<i class="fa-solid fa-moon text-lg"></i>'; });
        }
        document.querySelectorAll('#themeToggleBtn').forEach(btn => btn.addEventListener('click', toggleTheme));

        function updatePlayButtons(playing) {
            const playHtml = '<i class="fa-solid fa-play ml-0.5 text-xs"></i>'; const pauseHtml = '<i class="fa-solid fa-pause text-xs"></i>';
            const playClasses = ['bg-blue-600', 'hover:bg-blue-500']; const pauseClasses = ['bg-amber-500', 'hover:bg-amber-400'];
            [document.getElementById('playBtn'), document.getElementById('playBtnMobile')].forEach(btn => {
                if(!btn) return;
                if(playing) { btn.innerHTML = pauseHtml; btn.classList.remove(...playClasses); btn.classList.add(...pauseClasses); } 
                else { btn.innerHTML = playHtml; btn.classList.remove(...playClasses); btn.classList.add(...playClasses); }
            });
        }

        async function playProgression() {
            if (!audioInitialized) await initAudio();
            if (Tone.context.state !== 'running') await Tone.context.resume();
            if (!isPlaying) { currentLoopCount = 0; step = selectedStartMeasure * 8; Tone.Transport.position = 0; Tone.Transport.start(); isPlaying = true; updatePlayButtons(true); } 
            else { Tone.Transport.pause(); isPlaying = false; if (piano && piano.releaseAll) piano.releaseAll(); if (bassSynth && bassSynth.triggerRelease) bassSynth.triggerRelease(Tone.now()); updatePlayButtons(false); }
        }

        function stopProgression() {
            if (audioInitialized) { Tone.Transport.pause(); piano.releaseAll(); bassSynth.triggerRelease(Tone.now()); }
            isPlaying = false; step = selectedStartMeasure * 8; currentLoopCount = 0; resetMetronome();
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            highlightSvgNode([]); updatePlayButtons(false);
        }

        ['playBtn', 'playBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', playProgression));
        ['stopBtn', 'stopBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', stopProgression));

        function toggleMute(type, id1, id2) {
            const isMuted = type === 'piano' ? !isPianoMuted : !isBassMuted;
            if (type === 'piano') isPianoMuted = isMuted; else isBassMuted = isMuted;
            [document.getElementById(id1), document.getElementById(id2)].forEach(btn => { if (btn) { if (isMuted) btn.classList.add('muted'); else btn.classList.remove('muted'); } });
        }
        ['mutePianoBtn', 'mutePianoBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', () => toggleMute('piano', 'mutePianoBtn', 'mutePianoBtnMobile')));
        ['muteBassBtn', 'muteBassBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', () => toggleMute('bass', 'muteBassBtn', 'muteBassBtnMobile')));

        function syncSelects(id1, id2, value) { 
            let e1 = document.getElementById(id1); if(e1) e1.value = value; 
            let e2 = document.getElementById(id2); if(e2) e2.value = value; 
        }
        
        ['tempoSlider', 'tempoSliderMobile'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => {
            document.getElementById('tempoValue').textContent = e.target.value; document.getElementById('tempoValueMobile').textContent = e.target.value;
            syncSelects('tempoSlider', 'tempoSliderMobile', e.target.value); if (audioInitialized) Tone.Transport.bpm.value = e.target.value;
        }));

        ['volumeSlider', 'volumeSliderMobile'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => {
            document.getElementById('volumeValue').textContent = `${e.target.value} dB`; document.getElementById('volumeValueMobile').textContent = `${e.target.value} dB`;
            syncSelects('volumeSlider', 'volumeSliderMobile', e.target.value); if (audioInitialized) Tone.Destination.volume.value = parseFloat(e.target.value);
        }));

        // NUEVO: Evento en vivo para actualizar el tamaño de fuente inmediatamente
        ['sizeSlider', 'sizeSliderMobile'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => {
            document.getElementById('sizeValue').textContent = `${e.target.value}%`; 
            if (document.getElementById('sizeValueMobile')) document.getElementById('sizeValueMobile').textContent = `${e.target.value}%`;
            syncSelects('sizeSlider', 'sizeSliderMobile', e.target.value);
            const grid = document.getElementById('chordGrid');
            if (grid) grid.style.fontSize = `${e.target.value}%`;
        }));

        ['loopInput', 'loopInputMobile'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => syncSelects('loopInput', 'loopInputMobile', e.target.value) ));

        ['progressionSelect', 'progressionSelectMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            syncSelects('progressionSelect', 'progressionSelectMobile', e.target.value); manualKeyChange = false; const was = isPlaying; stopProgression(); selectedStartMeasure = 0; loadAndCompileProgression(false); if(was) setTimeout(() => playProgression(), 50);
        }));

        ['variationSelect', 'variationSelectMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            let val = e.target.value; if (val === "" || val === undefined || val === "undefined") val = "0";
            syncSelects('variationSelect', 'variationSelectMobile', val); 
            const was = isPlaying; stopProgression(); selectedStartMeasure = 0; loadAndCompileProgression(false); if(was) setTimeout(() => playProgression(), 50);
        }));

        ['keySelect', 'keySelectMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            syncSelects('keySelect', 'keySelectMobile', e.target.value); manualKeyChange = true; const was = isPlaying; stopProgression(); loadAndCompileProgression(true); if(was) setTimeout(() => playProgression(), 50);
        }));

        ['globalTritoneToggle', 'globalTritoneToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            globalTritone = e.target.checked; 
            if (globalTritone) { globalDim = false; ['globalDimToggle', 'globalDimToggleMobile'].forEach(i => { if(document.getElementById(i)) document.getElementById(i).checked = false; }); }
            document.getElementById('globalTritoneToggle').checked = globalTritone; document.getElementById('globalTritoneToggleMobile').checked = globalTritone; loadAndCompileProgression(true);
        }));

        ['globalDimToggle', 'globalDimToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            globalDim = e.target.checked; 
            if (globalDim) { globalTritone = false; ['globalTritoneToggle', 'globalTritoneToggleMobile'].forEach(i => { if(document.getElementById(i)) document.getElementById(i).checked = false; }); }
            document.getElementById('globalDimToggle').checked = globalDim; document.getElementById('globalDimToggleMobile').checked = globalDim; loadAndCompileProgression(true);
        }));

        ['relacionToggle', 'relacionToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            relacionIIVActive = e.target.checked; document.getElementById('relacionToggle').checked = relacionIIVActive; if(document.getElementById('relacionToggleMobile')) document.getElementById('relacionToggleMobile').checked = relacionIIVActive; loadAndCompileProgression(true);
        }));

        ['romanToggle', 'romanToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            romanMode = e.target.checked; document.getElementById('romanToggle').checked = romanMode; document.getElementById('romanToggleMobile').checked = romanMode; renderGrid(); 
        }));

        document.getElementById('addRepeatStartBtn')?.addEventListener('click', () => toggleRepeatSymbol('start'));
        document.getElementById('addRepeatEndBtn')?.addEventListener('click', () => toggleRepeatSymbol('end'));

        function debounce(func, wait) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); }; }
        const handleCustomInput = debounce((val) => {
            const wasPlaying = isPlaying; if (wasPlaying) stopProgression();
            selectedStartMeasure = 0; loadAndCompileProgression(false); if (wasPlaying) setTimeout(() => playProgression(), 50);
        }, 800);
        
        document.getElementById('customProgInput')?.addEventListener('input', (e) => handleCustomInput(e.target.value));

        function insertTextAtCursor(inputId, textToInsert) {
            const input = document.getElementById(inputId); if (!input) return;
            const start = input.selectionStart; const end = input.selectionEnd; const text = input.value;
            const before = text.substring(0, start); const after = text.substring(end);
            let insertStr = textToInsert;
            if (before.length > 0 && !before.endsWith(" ")) insertStr = " " + insertStr;
            if (after.length > 0 && !after.startsWith(" ")) insertStr = insertStr + " ";
            input.value = before + insertStr + after; input.selectionStart = input.selectionEnd = start + insertStr.length;
            input.focus(); handleCustomInput(input.value);
        }
        
        document.getElementById('insertPipeBtn')?.addEventListener('click', () => insertTextAtCursor('customProgInput', '|'));

        document.getElementById('chordGrid')?.addEventListener('click', (e) => {
            const chordEl = e.target.closest('.chord-text');
            if (chordEl && chordEl.classList.contains('is-dominant')) {
                e.stopPropagation(); let key = `${chordEl.dataset.mid}_${chordEl.dataset.cid}`;
                let current = mutationOverrides[key] || (globalTritone ? 'tritone' : (globalDim ? 'dim' : 'normal'));
                if (current === 'normal') mutationOverrides[key] = 'tritone';
                else if (current === 'tritone') mutationOverrides[key] = 'dim';
                else mutationOverrides[key] = 'normal';
                loadAndCompileProgression(true);
            } else {
                const measureBox = e.target.closest('.measure-box');
                if (measureBox) { selectedStartMeasure = parseInt(measureBox.dataset.index); renderGrid(); updateStartMeasureLabel(); }
            }
        });

        loadAndCompileProgression(false);
    </script>
