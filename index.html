        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .measure-box {
            transition: all 0.15s ease-in-out;
            min-height: 100px;
            cursor: pointer;
        }

        .measure-box:hover {
            border-color: #3b82f6 !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .measure-active {
            background-color: #eff6ff !important;
            border-color: #60a5fa !important;
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
            z-index: 10;
        }
        .dark .measure-active {
            background-color: #1e3a8a !important;
            border-color: #3b82f6 !important;
        }

        .repeat-start::before {
            content: ''; position: absolute; left: 6px; top: 15%; bottom: 15%; width: 5px;
            border-left: 4px solid #3b82f6; border-right: 1px solid #3b82f6; opacity: 0.8;
        }
        .repeat-start::after {
            content: ':'; font-weight: bold; font-size: 24px; line-height: 1;
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #3b82f6; opacity: 0.8; font-family: serif;
        }
        
        .repeat-end::before {
            content: ''; position: absolute; right: 6px; top: 15%; bottom: 15%; width: 5px;
            border-right: 4px solid #3b82f6; border-left: 1px solid #3b82f6; opacity: 0.8;
        }
        .repeat-end::after {
            content: ':'; font-weight: bold; font-size: 24px; line-height: 1;
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: #3b82f6; opacity: 0.8; font-family: serif;
        }

        .chord-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        /* --- Animaciones del SVG (Multitónica / Giant Steps) --- */
        .coltrane-node .ii-v-bg {
            fill: #f8fafc;
            stroke: #cbd5e1;
            stroke-width: 2px;
            rx: 6px;
            transition: all 0.2s ease;
        }
        .dark .coltrane-node .ii-v-bg {
            fill: #1e293b;
            stroke: #334155;
        }
        .coltrane-node.active-node .ii-v-bg {
            fill: #fef08a !important;
            stroke: #eab308 !important;
            filter: drop-shadow(0 0 6px rgba(234, 179, 8, 0.4));
        }
        .dark .coltrane-node.active-node .ii-v-bg {
            fill: #713f12 !important;
            stroke: #ca8a04 !important;
        }
        .coltrane-node.active-node .ii-v-text {
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-decoration-color: currentColor;
        }
        
        /* Tónicas (Unos) */
        .coltrane-node .tonic-circle {
            transition: all 0.2s ease;
        }
        .coltrane-node.active-node .tonic-circle {
            fill: currentColor !important;
            stroke-width: 4px;
            filter: drop-shadow(0 0 8px currentColor);
        }
        .coltrane-node.active-node .tonic-text {
            fill: white !important;
            font-weight: 900;
        }

        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #3b82f6; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #475569; }

        input:checked ~ .toggle-dot { transform: translateX(100%); background-color: #3b82f6; }
        input#globalTritoneToggle:checked ~ .toggle-dot { background-color: #f59e0b; }
        input:checked ~ .toggle-track { background-color: #dbeafe; }
        input#globalTritoneToggle:checked ~ .toggle-track { background-color: #fef3c7; }
        .dark input:checked ~ .toggle-track { background-color: #1e3a8a; }
        .dark input#globalTritoneToggle:checked ~ .toggle-track { background-color: #78350f; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
        
        @media (max-width: 640px) {
            .measure-box { min-height: 80px; padding: 0.25rem; }
            .section-label { font-size: 8px; padding: 2px 4px; }
            .measure-number { font-size: 8px; }
            .repeat-start::after, .repeat-end::after { font-size: 16px; left: 8px; right: 8px;}
            .repeat-start { padding-left: 1rem; }
            .repeat-end { padding-right: 1rem; }
        }
    </style>
</head>

        const noteLetters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const baseSemitones = {'C':0, 'D':2, 'E':4, 'F':5, 'G':7, 'A':9, 'B':11};
        const allKeys = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        const tritoneRootMap = {
            'C':'Gb', 'C#':'G', 'Db':'G', 'D':'Ab', 'D#':'A', 'Eb':'A',
            'E':'Bb', 'F':'B', 'F#':'C', 'Gb':'C', 'G':'Db', 'G#':'D',
            'Ab':'D', 'A':'Eb', 'A#':'E', 'Bb':'E', 'B':'F'
        };

        const cualidades = {
            "maj7": [0, 4, 7, 11], "m7": [0, 3, 7, 10], "7": [0, 4, 7, 10],
            "7(b9)": [0, 4, 7, 10, 13], "m7(b5)": [0, 3, 6, 10], "dim7": [0, 3, 6, 9],
            "o7": [0, 3, 6, 9], "maj": [0, 4, 7], "m": [0, 3, 7],
            "6": [0, 4, 7, 9], "m6": [0, 3, 7, 9], "aug": [0, 4, 8]
        };

        function parseNoteObj(noteStr) {
            const letter = noteStr.charAt(0);
            let accidental = 0;
            for (let i = 1; i < noteStr.length; i++) {
                if (noteStr[i] === '#') accidental++;
                if (noteStr[i] === 'b') accidental--;
            }
            return { letter, accidental, semitone: (baseSemitones[letter] + accidental + 12) % 12 };
        }

        function getTranspositionOffsets(baseKeyStr, targetKeyStr) {
            const base = parseNoteObj(baseKeyStr);
            const target = parseNoteObj(targetKeyStr);
            let stOffset = target.semitone - base.semitone;
            let letterOffset = noteLetters.indexOf(target.letter) - noteLetters.indexOf(base.letter);
            if (stOffset < 0) stOffset += 12;
            if (letterOffset < 0) letterOffset += 7;
            return { stOffset, letterOffset };
        }

        function transposeRoot(rootStr, stOffset, letterOffset) {
            const parsed = parseNoteObj(rootStr);
            const letterIdx = noteLetters.indexOf(parsed.letter);
            const newLetterIdx = (letterIdx + letterOffset + 7) % 7;
            const newLetter = noteLetters[newLetterIdx];
            const targetSemitone = (parsed.semitone + stOffset + 120) % 12; 
            const newLetterBaseSemitone = baseSemitones[newLetter];
            let accidentalNeeded = targetSemitone - newLetterBaseSemitone;
            if (accidentalNeeded > 6) accidentalNeeded -= 12;
            if (accidentalNeeded < -6) accidentalNeeded += 12;
            let result = newLetter;
            if (accidentalNeeded > 0) result += '#'.repeat(accidentalNeeded);
            if (accidentalNeeded < 0) result += 'b'.repeat(-accidentalNeeded);
            return result;
        }

        function transposeChordName(chordStr, stOffset, letterOffset) {
            if (chordStr === "NC" || chordStr === "-") return chordStr;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1];
            let quality = match[2];
            const newRoot = transposeRoot(root, stOffset, letterOffset);
            if (quality.includes('/')) {
                const qParts = quality.split('/');
                const newBass = transposeRoot(qParts[1], stOffset, letterOffset);
                quality = qParts[0] + '/' + newBass;
            }
            return newRoot + quality;
        }

        let romanMode = false;
        
        function convertToRoman(chordStr, keyStr) {
            if (chordStr === "NC" || chordStr === "-") return chordStr;
            const progIndex = progressionSelect.value;
            const progData = progressionLibrary[progIndex];
            
            // Excepción funcional: Blues versiones 2 y 3 sin análisis romano
            if (progData.id === "blues" && variationSelect.value !== "0") {
                return chordStr;
            }

            // Excepción funcional: Blues versión 1 no analiza secundarios I7 IV7 V7
            if (progData.id === "blues" && variationSelect.value === "0") {
                const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
                if (!match) return chordStr;
                const root = match[1];
                let quality = match[2].split('/')[0];
                const { stOffset } = getTranspositionOffsets(keyStr, root);
                if ((stOffset === 0 || stOffset === 5 || stOffset === 7) && quality === "7") {
                    const romans = {0:"I", 5:"IV", 7:"V"};
                    return romans[stOffset] + quality;
                }
            }

            const romanNumerals = ["I", "bII", "II", "bIII", "III", "IV", "bV", "V", "bVI", "VI", "bVII", "VII"];
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1];
            let quality = match[2];
            
            const isSubbed = quality.includes('_SUB');
            quality = quality.replace('_SUB', '').replace(/_T\d|_V\d|_II\d/g, '');

            let { stOffset } = getTranspositionOffsets(keyStr, root);
            if (isSubbed) stOffset = (stOffset + 6) % 12;

            let cleanQual = quality.split('/')[0];
            let isDominantChord = (cleanQual.startsWith('7') || cleanQual.startsWith('9') || cleanQual.startsWith('13')) 
                && !cleanQual.includes('maj') && !cleanQual.includes('m') && !cleanQual.includes('dim') && !cleanQual.includes('o');

            let isDim = cleanQual.includes('dim') || cleanQual.includes('o');

            if (isDim && stOffset === 6) return "#IV" + quality;

            let romanRoot = "";
            
            if (isDominantChord) {
                if (stOffset === 0) romanRoot = "V/IV";
                else if (stOffset === 2) romanRoot = "V/V";
                else if (stOffset === 4) romanRoot = "V/VI";
                else if (stOffset === 9) romanRoot = "V/II";
                else if (stOffset === 11) romanRoot = "V/III";
                else romanRoot = romanNumerals[stOffset];
                
                if (isSubbed) {
                    if (romanRoot.startsWith("V/")) {
                        romanRoot = "sub" + romanRoot;
                    } else {
                        romanRoot = "subV7";
                    }
                }
            } else {
                romanRoot = romanNumerals[stOffset];
            }

            // Inyectar el número romano y mantener la tensión (ej. V7(b9)/II)
            if (romanRoot.includes('/')) {
                let parts = romanRoot.split('/');
                return parts[0] + (cleanQual.replace('7', '')) + "/" + parts[1];
            }

            return romanRoot + quality;
        }

        const midiToNoteName = (midi) => {
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(midi / 12) - 1;
            return noteNames[midi % 12] + octave;
        };

        function computeNextVoicing(chordStr, prevMidiNotes) {
            let cleanChord = chordStr.replace(/_SUB|_T\d|_V\d|_II\d/g, '');
            let rootMatch = cleanChord.match(/^([A-G][#b]*)/);
            if (!rootMatch) return { midi: [], toneNames: [], bassNote: "C2" };
            
            let rootStr = rootMatch[1];
            let rest = cleanChord.substring(rootStr.length);
            let bassStr = rootStr;
            let quality = "maj"; 
            
            if (rest.includes('/')) {
                let parts = rest.split('/');
                quality = parts[0] === "" ? "maj" : parts[0];
                bassStr = parts[1];
            } else {
                quality = rest === "" ? "maj" : rest;
            }
            
            let intervals = cualidades[quality] || [0, 4, 7];
            let parsedRoot = parseNoteObj(rootStr);
            let rootMidi = 60 + parsedRoot.semitone; 
            if (parsedRoot.semitone > 6) rootMidi -= 12; 
            
            let rawMidi = intervals.map(iv => rootMidi + iv);
            
            if (prevMidiNotes && prevMidiNotes.length > 0) {
                let prevCenter = prevMidiNotes.reduce((a, b) => a + b, 0) / prevMidiNotes.length;
                rawMidi = rawMidi.map(note => {
                    let normalizedNote = note % 12;
                    let targetOctave = Math.floor(prevCenter / 12);
                    let c1 = (targetOctave * 12) + normalizedNote;
                    let c2 = ((targetOctave + 1) * 12) + normalizedNote;
                    let c3 = ((targetOctave - 1) * 12) + normalizedNote;
                    let d1 = Math.abs(c1 - prevCenter);
                    let d2 = Math.abs(c2 - prevCenter);
                    let d3 = Math.abs(c3 - prevCenter);
                    if (d1 <= d2 && d1 <= d3) return c1;
                    if (d2 <= d1 && d2 <= d3) return c2;
                    return c3;
                });
                rawMidi = [...new Set(rawMidi)].sort((a, b) => a - b);
            }
            
            let toneNames = rawMidi.map(m => midiToNoteName(m));
            let parsedBass = parseNoteObj(bassStr);
            let bassMidi = 36 + parsedBass.semitone; 
            if (parsedBass.semitone > 5) bassMidi -= 12; 
            return { midi: rawMidi, toneNames: toneNames, bassNote: midiToNoteName(bassMidi) };
        }

        let visualMeasures = []; 
        let audioTimeline = []; 
        let totalSteps = 0;
        let selectedStartMeasure = 0;
        let globalTritone = false;
        let tritoneOverrides = {}; 
        let manualKeyChange = false;

        function renderColtraneGraphic(key) {

            if (!graphicContainer) return;
            
            const t1 = Tone.Frequency(key + "4").toNote().replace(/[0-9]/g, '');
            const t2 = Tone.Frequency(t1 + "4").transpose(-4).toNote().replace(/[0-9]/g, ''); 
            const t3 = Tone.Frequency(t2 + "4").transpose(-4).toNote().replace(/[0-9]/g, '');

            const v1 = Tone.Frequency(t1 + "4").transpose(7).toNote().replace(/[0-9]/g, '');
            const ii1 = Tone.Frequency(v1 + "4").transpose(7).toNote().replace(/[0-9]/g, '');
            
            const v2 = Tone.Frequency(t2 + "4").transpose(7).toNote().replace(/[0-9]/g, '');
            const ii2 = Tone.Frequency(v2 + "4").transpose(7).toNote().replace(/[0-9]/g, '');
            
            const v3 = Tone.Frequency(t3 + "4").transpose(7).toNote().replace(/[0-9]/g, '');
            const ii3 = Tone.Frequency(v3 + "4").transpose(7).toNote().replace(/[0-9]/g, '');

            // Coordenadas Exactas basadas en la imagen conceptual
            const p1 = { x: 200, y: 110 };  // T1 Centro Arriba
            const p2 = { x: 140, y: 210 };  // T2 Abajo Izq

            // V1 e II1 (Horizontales, apuntando abajo a T1)
            const posV1 = { x: 200, y: 35 };
            const posII1 = { x: 110, y: 35 };

            // V2 e II2 (Diagonal, apuntando derecha a T2)
            const posV2 = { x: 60, y: 210 };
            const posII2 = { x: 20, y: 270 };

            // V3 e II3 (Diagonal, apuntando izquierda a T3)
            const posV3 = { x: 340, y: 210 };
            const posII3 = { x: 380, y: 270 };

            graphicContainer.innerHTML = `
                <svg viewBox="0 0 400 320" class="w-full h-full text-slate-800 dark:text-slate-200 font-bold overflow-visible">
                    <defs>
                        <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" class="text-slate-600 dark:text-slate-400"/>
                        </marker>
                        <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" class="text-slate-500 dark:text-slate-400"/>

                    <!-- Triángulo central -->

                    <!-- Líneas V -> I (Sólidas con flecha) -->
                    <line x1="${posV1.x}" y1="${posV1.y + 14}" x2="${p1.x}" y2="${p1.y - 25}" stroke="currentColor" stroke-width="2" marker-end="url(#arrow-solid)" class="text-slate-600 dark:text-slate-400"/>
                    <line x1="${posV2.x + 22}" y1="${posV2.y}" x2="${p2.x - 25}" y2="${p2.y}" stroke="currentColor" stroke-width="2" marker-end="url(#arrow-solid)" class="text-slate-600 dark:text-slate-400"/>
                    <line x1="${posV3.x - 22}" y1="${posV3.y}" x2="${p3.x + 25}" y2="${p3.y}" stroke="currentColor" stroke-width="2" marker-end="url(#arrow-solid)" class="text-slate-600 dark:text-slate-400"/>
                    
                    <!-- Líneas II -> V (Punteadas con flecha) -->
                    <line x1="${posII1.x + 24}" y1="${posII1.y}" x2="${posV1.x - 22}" y2="${posV1.y}" stroke="currentColor" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-dashed)" class="text-slate-500 dark:text-slate-400"/>
                    <line x1="${posII2.x + 12}" y1="${posII2.y - 12}" x2="${posV2.x - 12}" y2="${posV2.y + 12}" stroke="currentColor" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-dashed)" class="text-slate-500 dark:text-slate-400"/>
                    <line x1="${posII3.x - 12}" y1="${posII3.y - 12}" x2="${posV3.x + 12}" y2="${posV3.y + 12}" stroke="currentColor" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-dashed)" class="text-slate-500 dark:text-slate-400"/>

                    <!-- Bloques II y V -->
                    <!-- NOTA IMPORTANTE: Los IDs son estáticos (svg-node-ii1) para coincidir con el motor de audio -->
                    <g id="svg-node-ii1" class="coltrane-node">
                        <rect x="${posII1.x - 24}" y="${posII1.y - 14}" width="48" height="28" class="ii-v-bg" />
                        <text x="${posII1.x}" y="${posII1.y + 4}" text-anchor="middle" class="ii-v-text text-[13px]">${ii1}-7</text>
                    </g>
                    <g id="svg-node-v1" class="coltrane-node">
                        <rect x="${posV1.x - 20}" y="${posV1.y - 14}" width="40" height="28" class="ii-v-bg" />
                        <text x="${posV1.x}" y="${posV1.y + 4}" text-anchor="middle" class="ii-v-text text-[13px]">${v1}7</text>
                    </g>
                    
                    <g id="svg-node-ii2" class="coltrane-node">
                        <rect x="${posII2.x - 24}" y="${posII2.y - 14}" width="48" height="28" class="ii-v-bg" />
                        <text x="${posII2.x}" y="${posII2.y + 4}" text-anchor="middle" class="ii-v-text text-[13px]">${ii2}-7</text>
                    </g>
                    <g id="svg-node-v2" class="coltrane-node">
                        <rect x="${posV2.x - 20}" y="${posV2.y - 14}" width="40" height="28" class="ii-v-bg" />
                        <text x="${posV2.x}" y="${posV2.y + 4}" text-anchor="middle" class="ii-v-text text-[13px]">${v2}7</text>
                    </g>
                    
                    <g id="svg-node-ii3" class="coltrane-node">
                        <rect x="${posII3.x - 24}" y="${posII3.y - 14}" width="48" height="28" class="ii-v-bg" />
                        <text x="${posII3.x}" y="${posII3.y + 4}" text-anchor="middle" class="ii-v-text text-[13px]">${ii3}-7</text>
                    </g>
                    <g id="svg-node-v3" class="coltrane-node">
                        <rect x="${posV3.x - 20}" y="${posV3.y - 14}" width="40" height="28" class="ii-v-bg" />
                        <text x="${posV3.x}" y="${posV3.y + 4}" text-anchor="middle" class="ii-v-text text-[13px]">${v3}7</text>
                    </g>

                    <!-- Tónicas Maj7 (Círculos) -->
                    <g id="svg-node-t1" class="coltrane-node">
                        <circle cx="${p1.x}" cy="${p1.y}" r="22" fill="white" stroke="#3b82f6" stroke-width="3" class="dark:fill-slate-800 tonic-circle"/>
                        <text x="${p1.x}" y="${p1.y + 5}" text-anchor="middle" fill="#3b82f6" class="tonic-text">${t1}Δ7</text>
                    </g>
                    <g id="svg-node-t2" class="coltrane-node">
                        <circle cx="${p2.x}" cy="${p2.y}" r="22" fill="white" stroke="#ef4444" stroke-width="3" class="dark:fill-slate-800 tonic-circle"/>
                        <text x="${p2.x}" y="${p2.y + 5}" text-anchor="middle" fill="#ef4444" class="tonic-text">${t2}Δ7</text>
                    </g>
                    <g id="svg-node-t3" class="coltrane-node">
                        <circle cx="${p3.x}" cy="${p3.y}" r="22" fill="white" stroke="#eab308" stroke-width="3" class="dark:fill-slate-800 tonic-circle"/>
                        <text x="${p3.x}" y="${p3.y + 5}" text-anchor="middle" fill="#eab308" class="tonic-text">${t3}Δ7</text>
                    </g>
                </svg>
            `;
        }

        function isDominant(chordStr) {
            if (chordStr === "NC" || chordStr === "-") return false;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return false;
            const mainQuality = match[2].split('/')[0].replace(/_T\d|_V\d|_II\d/g, '').replace('_SUB', '');
            return (mainQuality.startsWith('7') || mainQuality.startsWith('9') || mainQuality.startsWith('13')) 
                && !mainQuality.includes('maj') && !mainQuality.includes('m') && !mainQuality.includes('dim') && !mainQuality.includes('o');
        }

        function applyTritoneSub(chordStr) {
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1];
            let quality = match[2];
            if (quality.includes('/')) quality = quality.split('/')[0]; 
            const newRoot = tritoneRootMap[root] || root;
            return newRoot + quality;
        }

        function loadAndCompileProgression(preserveOverrides = false) {
            if (!preserveOverrides) tritoneOverrides = {};

            const progIndex = progressionSelect.value;
            const targetKey = keySelect.value;
            const progData = progressionLibrary[progIndex];
            
            if (progData.variations) {
                variationContainer.classList.remove('hidden');
                variationContainer.classList.add('flex');
                if (variationSelect.dataset.progId !== progData.id) {
                    variationSelect.innerHTML = '';
                    progData.variations.forEach((v, idx) => {
                        const opt = document.createElement('option');
                        opt.value = idx;
                        opt.textContent = (idx + 1).toString();
                        variationSelect.appendChild(opt);
                    });
                    variationSelect.dataset.progId = progData.id;
                    variationSelect.value = 0; 
                }
                progData.sections = progData.variations[variationSelect.value];
            } else {
                variationContainer.classList.add('hidden');
                variationContainer.classList.remove('flex');
                variationSelect.dataset.progId = '';
            }

            if (!manualKeyChange) keySelect.value = progData.baseKey;
            manualKeyChange = false; 

            const { stOffset, letterOffset } = getTranspositionOffsets(progData.baseKey, keySelect.value);
            
            visualMeasures = [];
            audioTimeline = [];
            
            const coltraneContainer = document.getElementById('coltraneGraphicContainer');
            if (progData.id === "multitonic-coltrane") {
                coltraneContainer.classList.remove('hidden');
                renderColtraneGraphic(keySelect.value);
            } else {
                coltraneContainer.classList.add('hidden');
            }

            let audioUnrolledMeasures = [];
            let visualMap = []; 
            let currentVisualIndex = 0;

            progData.sections.forEach(sec => {
                const rawMeasures = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                const transposedMeasures = rawMeasures.map((mStr, mIdx) => {
                    return mStr.split(/\s+/).map((c, cIdx) => {
                        let transposed = transposeChordName(c, stOffset, letterOffset);
                        let visualMIdx = currentVisualIndex + mIdx;
                        let overrideKey = `${visualMIdx}_${cIdx}`;
                        
                        let isSubbed = globalTritone;
                        if (tritoneOverrides[overrideKey] !== undefined) isSubbed = tritoneOverrides[overrideKey];
                        
                        if (isSubbed && isDominant(transposed)) transposed = applyTritoneSub(transposed) + "_SUB";
                        return transposed;
                    });
                });

                transposedMeasures.forEach((chords, mIdx) => {
                    visualMeasures.push({
                        id: currentVisualIndex + mIdx,
                        chords: chords,
                        colorClass: sec.color || 'bg-slate-50 dark:bg-slate-800',
                        sectionName: mIdx === 0 ? sec.type : null,
                        hasRepeatStart: sec.repeat && mIdx === 0,
                        hasRepeatEnd: sec.repeat && mIdx === transposedMeasures.length - 1
                    });
                });

                transposedMeasures.forEach((chords, idx) => {
                    audioUnrolledMeasures.push(chords);
                    visualMap.push(currentVisualIndex + idx); 
                });

                if (sec.repeat) {
                    transposedMeasures.forEach((chords, idx) => {
                        audioUnrolledMeasures.push(chords);
                        visualMap.push(currentVisualIndex + idx);
                    });
                }
                currentVisualIndex += transposedMeasures.length;
            });

            let prevMidiNotes = null;
            audioUnrolledMeasures.forEach((measureChords, measureIndex) => {
                let measureStartStep = measureIndex * 8; 
                measureChords.forEach((chord, chordIdx) => {
                    if (chord === "NC" || chord === "-") return;
                    let chordsInMeasure = measureChords.length;
                    
                    let svgNodeId = null;
                    let tagMatch = chord.match(/_(T\d|V\d|II\d)/i); // Extrae T1, V1, II1 etc
                    if (tagMatch) svgNodeId = tagMatch[1].toLowerCase(); // Convierte a t1, v1, ii1

                    let notesData = computeNextVoicing(chord, prevMidiNotes);
                    prevMidiNotes = notesData.midi; 
                    
                    let stepOffset = (chordIdx * 4); 
                    let duration = chordsInMeasure === 2 ? "2n" : (chordsInMeasure === 4 ? "4n" : "1m");
                    let trimDuration = Tone.Time(duration).toSeconds() - 0.05;

                    audioTimeline[measureStartStep + stepOffset] = {
                        notes: notesData.toneNames,
                        bass: notesData.bassNote,
                        duration: trimDuration > 0 ? trimDuration : duration,
                        visualId: visualMap[measureIndex],
                        svgNodeId: svgNodeId
                    };
                    
                    if (chordsInMeasure === 2 && chordIdx === 0) {
                        audioTimeline[measureStartStep + 4] = null;
                    }
                });
            });

            totalSteps = audioUnrolledMeasures.length * 8;
            if (selectedStartMeasure >= visualMeasures.length) selectedStartMeasure = 0;
            renderGrid();
            updateStartMeasureLabel();
        }

        function renderGrid() {
            chordGrid.innerHTML = '';
            const progData = progressionLibrary[progressionSelect.value];
            const isColtrane = progData.id === "multitonic-coltrane";
            
            visualMeasures.forEach((vMeasure, index) => {
                const measureDiv = document.createElement('div');
                measureDiv.id = `measure-${vMeasure.id}`;
                
                let classNames = `measure-box ${vMeasure.colorClass} border border-slate-300 dark:border-slate-600 rounded-xl flex flex-col items-center justify-center text-center relative overflow-hidden`;
                
                if (vMeasure.hasRepeatStart) classNames += ' repeat-start text-blue-600';
                if (vMeasure.hasRepeatEnd) classNames += ' repeat-end text-blue-600';
                if (index === selectedStartMeasure) classNames += ' ring-2 ring-blue-500 bg-blue-50/40 dark:bg-blue-900/40';
                
                measureDiv.className = classNames;
                
                let sectionLabelHtml = '';
                if (vMeasure.sectionName) {
                    sectionLabelHtml = `<span class="section-label absolute top-1 right-2 text-[10px] md:text-xs font-bold text-blue-600 bg-blue-100 dark:bg-blue-900/60 dark:text-blue-300 px-1.5 py-0.5 rounded-sm shadow-sm z-10">${vMeasure.sectionName}</span>`;
                }

                const processChord = (c, sizeClass, chordIdx, vMeasureId) => {
                    let color = "text-slate-800 dark:text-slate-100";
                    let text = c;
                    let isSubbed = false;
                    let isDom = false;

                    let isT1 = text.includes('_T1'), isT2 = text.includes('_T2'), isT3 = text.includes('_T3');
                    text = text.replace(/_V\d|_II\d/g, '');

                    if (text.endsWith('_SUB')) {
                        isSubbed = true;
                        text = text.replace('_SUB', '');
                        isDom = true;
                    } else if (isDominant(text)) {
                        isDom = true;
                    }

                    if (isSubbed) {
                        color = "text-amber-500 dark:text-amber-400 font-bold border-b-2 border-amber-500 border-dashed is-subbed is-dominant";
                    } else if (isT1) { 
                        color = "text-blue-500 font-black"; text = text.replace('_T1', ''); 
                    } else if (isT2) { 
                        color = "text-red-500 font-black"; text = text.replace('_T2', ''); 
                    } else if (isT3) { 
                        color = "text-amber-500 font-black"; text = text.replace('_T3', ''); 
                    } else if (isDom) {
                        color += " is-dominant";
                    }
                    
                    if (romanMode && !isColtrane) {
                        text = convertToRoman(text, keySelect.value);
                    }

                    let interactiveClasses = "pointer-events-auto ";
                    let tooltip = "";
                    if (isDom) {
                        interactiveClasses += "cursor-pointer hover:text-amber-500 dark:hover:text-amber-400 transition-colors relative z-20";
                        tooltip = 'title="Clic para aplicar/quitar Sustituto Tritonal"';
                    }

                    return `<span class="chord-text ${sizeClass} mx-0.5 md:mx-2 ${color} ${interactiveClasses}" data-mid="${vMeasureId}" data-cid="${chordIdx}" ${tooltip}>${text}</span>`;
                };

                let displayHtml = '';
                const size1 = "text-2xl sm:text-3xl md:text-4xl lg:text-5xl tracking-tighter";
                const size2 = "text-xl sm:text-2xl md:text-3xl lg:text-4xl tracking-tighter";
                const size3 = "text-sm sm:text-base md:text-lg lg:text-xl tracking-tighter";
                
                if(vMeasure.chords.length === 1) {
                    displayHtml = processChord(vMeasure.chords[0], size1, 0, index);
                } else if (vMeasure.chords.length === 2) {
                    displayHtml = processChord(vMeasure.chords[0], size2, 0, index) + processChord(vMeasure.chords[1], size2, 1, index);
                } else {
                    displayHtml = vMeasure.chords.map((c, i) => processChord(c, size3, i, index)).join(' ');
                }
                
                measureDiv.innerHTML = `
                    <span class="measure-number absolute top-1 left-2 text-[10px] md:text-xs text-slate-400 font-mono z-10">${index + 1}</span>
                    ${sectionLabelHtml}
                    <div class="flex flex-wrap items-center justify-center w-full h-full pointer-events-none gap-x-1 gap-y-1">${displayHtml}</div>
                `;
                
                measureDiv.dataset.index = index;
                chordGrid.appendChild(measureDiv);
            });
        }

        function updateStartMeasureLabel() {
            const indicator = document.getElementById('startMeasureIndicator');
            if (indicator) indicator.textContent = `Inicio: Compás ${selectedStartMeasure + 1}`;
        }

        function highlightMeasure(visualId) {
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            const activeEl = document.getElementById(`measure-${visualId}`);
            if (activeEl) {
                activeEl.classList.add('measure-active');
                const container = document.querySelector('.custom-scrollbar');
                const rect = activeEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                if (rect.top < containerRect.top || rect.bottom > containerRect.bottom) {
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function highlightSvgNode(nodeId) {
            document.querySelectorAll('.coltrane-node').forEach(el => el.classList.remove('active-node'));
            if (nodeId) {
                const activeNode = document.getElementById(`svg-node-${nodeId}`);
                if (activeNode) activeNode.classList.add('active-node');
            }
        }

        let piano, bassSynth;
        let isPlaying = false;
        let step = 0; 
        let audioInitialized = false;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            const chorus = new Tone.Chorus({ frequency: 2, delayTime: 3.5, depth: 0.3 }).start();
            const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 });
            reverb.wet.value = 0.2;

            piano = new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 2, modulationIndex: 1.2, oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 },
                modulation: { type: "triangle" }, modulationEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 }
            });
            
            bassSynth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.04, decay: 0.4, sustain: 0.3, release: 0.05 }
            });

            piano.chain(chorus, reverb, Tone.Destination);
            bassSynth.toDestination();

            Tone.Destination.volume.value = parseFloat(volumeSlider.value);

            Tone.Transport.scheduleRepeat((time) => {
                const currentStep = step % totalSteps; 
                const event = audioTimeline[currentStep];
                
                if (currentStep % 8 === 0) {
                    let currentMeasureEvent = audioTimeline[currentStep];
                    if (currentMeasureEvent) Tone.Draw.schedule(() => highlightMeasure(currentMeasureEvent.visualId), time);
                }

                if (event !== undefined) {
                    if (event && event.svgNodeId) Tone.Draw.schedule(() => highlightSvgNode(event.svgNodeId), time);
                    else Tone.Draw.schedule(() => highlightSvgNode(null), time);
                    
                    if (event !== null) {
                        piano.triggerAttackRelease(event.notes, event.duration, time);
                        bassSynth.triggerAttackRelease(event.bass, event.duration, time);
                    }
                }
                step++;
            }, "8n");

            Tone.Transport.bpm.value = parseInt(tempoSlider.value);
            audioInitialized = true;
        }

        const progressionSelect = document.getElementById('progressionSelect');
        const variationContainer = document.getElementById('variationContainer');
        const variationSelect = document.getElementById('variationSelect');
        const keySelect = document.getElementById('keySelect');
        const chordGrid = document.getElementById('chordGrid');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const tempoSlider = document.getElementById('tempoSlider');
        const tempoValue = document.getElementById('tempoValue');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const themeToggleBtns = [document.getElementById('themeToggleBtn'), document.getElementById('themeToggleBtnDesktop')];
        const htmlElement = document.documentElement;

        progressionLibrary.forEach((prog, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = prog.name;
            progressionSelect.appendChild(option);
        });

        allKeys.forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = key;
            keySelect.appendChild(option);
        });

        function updateThemeIcons() {
            const isDark = htmlElement.classList.contains('dark');
            themeToggleBtns.forEach(btn => btn.innerHTML = isDark ? '<i class="fa-solid fa-sun text-xl"></i>' : '<i class="fa-solid fa-moon text-xl"></i>');
        }
        function toggleTheme() { htmlElement.classList.toggle('dark'); updateThemeIcons(); }
        themeToggleBtns.forEach(btn => btn.addEventListener('click', toggleTheme));
        updateThemeIcons(); 

        async function playProgression() {
            if (!audioInitialized) await initAudio();
            if (Tone.context.state !== 'running') await Tone.context.resume();
            
            if (!isPlaying) {
                step = selectedStartMeasure * 8;
                Tone.Transport.position = 0;
                Tone.Transport.start();
                isPlaying = true;
                playBtn.innerHTML = '<i class="fa-solid fa-pause text-xl"></i>';
                playBtn.classList.replace('bg-blue-600', 'bg-amber-500');
                playBtn.classList.replace('hover:bg-blue-500', 'hover:bg-amber-400');
            } else {
                Tone.Transport.pause(); 
                isPlaying = false;
                if (piano && piano.releaseAll) piano.releaseAll();
                const now = Tone.now();
                if (bassSynth && bassSynth.triggerRelease) bassSynth.triggerRelease(now);
                playBtn.innerHTML = '<i class="fa-solid fa-play text-xl ml-1"></i>';
                playBtn.classList.replace('bg-amber-500', 'bg-blue-600');
                playBtn.classList.replace('hover:bg-amber-400', 'hover:bg-blue-500');
            }
        }

        function stopProgression() {
            if (audioInitialized) {
                Tone.Transport.pause();
                const now = Tone.now();
                piano.releaseAll();
                bassSynth.triggerRelease(now);
                if (piano && piano.voices) piano.voices.forEach(v => { if (v && v.cancel) v.cancel(now); });
            }
            isPlaying = false;
            step = selectedStartMeasure * 8; 
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            highlightSvgNode(null); 
            playBtn.innerHTML = '<i class="fa-solid fa-play text-xl ml-1"></i>';
            playBtn.classList.replace('bg-amber-500', 'bg-blue-600');
            playBtn.classList.replace('hover:bg-amber-400', 'hover:bg-blue-500');
        }

        playBtn.addEventListener('click', playProgression);
        stopBtn.addEventListener('click', stopProgression);
        
        tempoSlider.addEventListener('input', (e) => {
            tempoValue.textContent = `${e.target.value} BPM`;
            if (audioInitialized) Tone.Transport.bpm.value = e.target.value;
        });

        volumeSlider.addEventListener('input', (e) => {
            volumeValue.textContent = `${e.target.value} dB`;
            if (audioInitialized) Tone.Destination.volume.value = parseFloat(e.target.value);
        });

        progressionSelect.addEventListener('change', () => {
            manualKeyChange = false; const wasPlaying = isPlaying; stopProgression(); selectedStartMeasure = 0;
            loadAndCompileProgression(); if(wasPlaying) setTimeout(() => playProgression(), 50);
        });

        variationSelect.addEventListener('change', () => {
            const wasPlaying = isPlaying; stopProgression(); selectedStartMeasure = 0;
            loadAndCompileProgression(); if(wasPlaying) setTimeout(() => playProgression(), 50);
        });

        keySelect.addEventListener('change', () => {
            manualKeyChange = true; const wasPlaying = isPlaying; stopProgression();
            loadAndCompileProgression(); if(wasPlaying) setTimeout(() => playProgression(), 50);
        });

        document.getElementById('globalTritoneToggle').addEventListener('change', (e) => {
            globalTritone = e.target.checked; loadAndCompileProgression(true);
        });
        
        document.getElementById('romanToggle').addEventListener('change', (e) => {
            romanMode = e.target.checked; renderGrid(); 
        });

        chordGrid.addEventListener('click', (e) => {
            const chordEl = e.target.closest('.chord-text');
            if (chordEl && chordEl.classList.contains('is-dominant')) {
                e.stopPropagation(); 
                tritoneOverrides[`${chordEl.dataset.mid}_${chordEl.dataset.cid}`] = !chordEl.classList.contains('is-subbed');
                loadAndCompileProgression(true);
            } else {
                const measureBox = e.target.closest('.measure-box');
                if (measureBox) {
                    selectedStartMeasure = parseInt(measureBox.dataset.index);
                    renderGrid(); updateStartMeasureLabel();
                }
            }
        });

        loadAndCompileProgression();
    </script>
</body>
</html>
