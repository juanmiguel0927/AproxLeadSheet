<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aproximación al Lead Sheet - Acordes y Progresiones</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    height: { 'dvh': '100dvh' }
                }
            }
        }
    </script>
    
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }

        .measure-box {
            transition: all 0.15s ease-in-out; min-height: 50px; height: 100%;
            cursor: pointer; display: flex; flex-direction: column; justify-content: center;
        }
        .measure-box:hover { border-color: #3b82f6 !important; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); }
        .measure-active { background-color: #eff6ff !important; border-color: #60a5fa !important; transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2); z-index: 10; }
        .dark .measure-active { background-color: #1e3a8a !important; border-color: #3b82f6 !important; }

        .repeat-start::before { content: ''; position: absolute; left: 4px; top: 15%; bottom: 15%; width: 4px; border-left: 3px solid #3b82f6; border-right: 1px solid #3b82f6; opacity: 0.8; }
        .repeat-start::after { content: ':'; font-weight: bold; font-size: 20px; line-height: 1; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #3b82f6; opacity: 0.8; font-family: serif; }
        .repeat-end::before { content: ''; position: absolute; right: 4px; top: 15%; bottom: 15%; width: 4px; border-right: 3px solid #3b82f6; border-left: 1px solid #3b82f6; opacity: 0.8; }
        .repeat-end::after { content: ':'; font-weight: bold; font-size: 20px; line-height: 1; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #3b82f6; opacity: 0.8; font-family: serif; }

        .chord-text { font-family: 'Courier New', Courier, monospace; }

        .ii-v-bracket { position: relative; margin-bottom: 2px; }
        .ii-v-bracket::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 6px; border-bottom: 2px solid #64748b; border-left: 2px solid #64748b; border-right: 2px solid #64748b; opacity: 0.8; border-bottom-left-radius: 2px; border-bottom-right-radius: 2px; }
        .dark .ii-v-bracket::after { border-color: #94a3b8; }

        .metronome-dot { transition: all 0.05s ease-out; }
        .metronome-dot.active { background-color: #3b82f6 !important; transform: scale(1.5); box-shadow: 0 0 6px rgba(59,130,246,0.8); }
        .dark .metronome-dot.active { background-color: #60a5fa !important; box-shadow: 0 0 8px rgba(96,165,250,0.8); }
        .metronome-dot.active-beat1 { background-color: #ef4444 !important; box-shadow: 0 0 8px rgba(239,68,68,0.8); }

        .mute-btn { transition: all 0.2s; }
        .mute-btn.muted { opacity: 0.5; background-color: #cbd5e1 !important; color: #64748b !important; text-decoration: line-through; }
        .dark .mute-btn.muted { background-color: #334155 !important; color: #94a3b8 !important; }

        .coltrane-node { cursor: pointer; transition: transform 0.1s; }
        .coltrane-node:hover { transform: scale(1.05); }
        .coltrane-node .ii-v-bg { fill: transparent; rx: 6px; transition: all 0.15s ease; }
        .ii-v-text { fill: currentColor; transition: fill 0.15s ease; }
        
        .coltrane-node.active-node .ii-v-bg { fill: #fef08a !important; stroke: #eab308 !important; stroke-width: 2px; }
        .dark .coltrane-node.active-node .ii-v-bg { fill: #fef08a !important; stroke: #ca8a04 !important; }
        
        .coltrane-node.active-node .ii-v-text { text-decoration: underline; text-decoration-thickness: 2px; text-decoration-color: currentColor; fill: #0f172a !important; }
        .dark .coltrane-node.active-node .ii-v-text { fill: #0f172a !important; font-weight: bold; }
        
        .coltrane-node .tonic-circle { transition: all 0.2s ease; }
        .coltrane-node.active-node .tonic-circle { fill: currentColor !important; stroke-width: 4px; filter: drop-shadow(0 0 10px currentColor); }
        .coltrane-node.active-node .tonic-text { fill: white !important; font-weight: 900; }
        .dark .coltrane-node.active-node .tonic-text { fill: #0f172a !important; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #475569; }

        input:checked ~ .toggle-dot { transform: translateX(100%); background-color: #3b82f6; }
        input#globalTritoneToggle:checked ~ .toggle-dot, input#globalTritoneToggleMobile:checked ~ .toggle-dot { background-color: #f59e0b; }
        input:checked ~ .toggle-track { background-color: #dbeafe; }
        input#globalTritoneToggle:checked ~ .toggle-track, input#globalTritoneToggleMobile:checked ~ .toggle-track { background-color: #fef3c7; }
        input#relacionToggle:checked ~ .toggle-dot, input#relacionToggleMobile:checked ~ .toggle-dot { transform: translateX(100%); background-color: #10b981; }
        input#relacionToggle:checked ~ .toggle-track, input#relacionToggleMobile:checked ~ .toggle-track { background-color: #d1fae5; }
        .dark input:checked ~ .toggle-track { background-color: #1e3a8a; }
        .dark input#globalTritoneToggle:checked ~ .toggle-track, .dark input#globalTritoneToggleMobile:checked ~ .toggle-track { background-color: #78350f; }
        .dark input#relacionToggle:checked ~ .toggle-track, .dark input#relacionToggleMobile:checked ~ .toggle-track { background-color: #064e3b; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
        
        @media (max-width: 640px) {
            .measure-box { min-height: 45px; padding: 0.1rem; } 
            .section-label { font-size: 8px; padding: 1px 3px; }
            .measure-number { font-size: 8px; top: 2px; left: 4px; }
            .repeat-start::after, .repeat-end::after { font-size: 14px; left: 4px; right: 4px;}
            .repeat-start { padding-left: 0.6rem; }
            .repeat-end { padding-right: 0.6rem; }
            .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.25rem; width: 100%; }
            .controls-full-width { grid-column: span 2; }
            .toggles-row { display: flex; justify-content: space-between; align-items: center; grid-column: span 2; padding-top: 0.25rem; border-top: 1px solid rgba(148, 163, 184, 0.2); }
            .chord-text { font-size: 0.85rem !important; }
            
            .dense-grid .measure-box { min-height: 28px !important; }
            .dense-grid .chord-text { font-size: 0.7rem !important; line-height: 1; }
            .dense-grid .measure-number { font-size: 7px; top: 1px; left: 2px; }
            .dense-grid { gap: 2px !important; padding-bottom: 0.5rem !important; }
        }
    </style>
</head>

<body class="h-dvh sm:min-h-screen flex flex-col items-center sm:py-2 md:py-4 px-2 sm:px-4 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 overflow-hidden">
    <div class="w-full sm:max-w-6xl mx-auto bg-white dark:bg-slate-800 sm:shadow-2xl sm:rounded-xl flex flex-col h-full sm:h-auto overflow-hidden border-0 sm:border border-slate-200 dark:border-slate-700">
        
        <!-- Header / Controles -->
        <div class="bg-slate-100 dark:bg-slate-800/80 p-1.5 border-b border-slate-200 dark:border-slate-700 flex flex-col relative z-20 shrink-0">
            
            <div class="flex items-center justify-between w-full mb-1 px-1">
                <h1 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2 leading-tight">
                    <i class="fa-solid fa-music text-blue-600"></i>
                    <span>Aproximación<br><span class="text-xs font-medium text-slate-500">al Lead Sheet</span></span>
                </h1>
                <button id="themeToggleBtn" class="text-slate-500 hover:text-blue-500 text-lg transition-colors w-8 h-8 flex items-center justify-center rounded-full">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
            
            <!-- Controles Desktop -->
            <div class="hidden sm:flex items-center gap-3 w-full flex-wrap lg:flex-nowrap justify-between">
                <div class="flex flex-col flex-1 max-w-[220px]">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Progresión</label>
                    <select id="progressionSelect" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none shadow-sm"></select>
                </div>

                <div id="variationContainer" class="hidden min-w-[90px] flex-col">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Ver.</label>
                    <select id="variationSelect" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                </div>

                <div class="flex flex-col w-20">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Tono</label>
                    <select id="keySelect" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                </div>

                <div class="flex flex-col w-24">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Tempo</span><span id="tempoValue" class="text-blue-600 font-bold">120</span>
                    </label>
                    <input type="range" id="tempoSlider" min="60" max="240" value="120" class="mt-1">
                </div>

                <div class="flex flex-col w-24">
                    <label class="text-[10px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Vol.</span><span id="volumeValue" class="text-blue-600 dark:text-blue-400 font-bold">-6 dB</span>
                    </label>
                    <input type="range" id="volumeSlider" min="-30" max="0" value="-6" step="1" class="mt-1">
                </div>

                <div class="flex items-center gap-3 ml-auto">
                    <label class="flex items-center gap-2 cursor-pointer group" title="Cifrado de Weber (Análisis Funcional)">
                        <div class="relative">
                            <input type="checkbox" id="romanToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-8 h-5 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-blue-500 transition-colors">Weber</span>
                    </label>
                    
                    <label class="flex items-center gap-2 cursor-pointer group" title="Sustituto Tritonal a todos los dominantes">
                        <div class="relative">
                            <input type="checkbox" id="globalTritoneToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-8 h-5 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-amber-500 dark:group-hover:text-amber-400 transition-colors">Tritono</span>
                    </label>

                    <label id="iivToggleContainer" class="hidden items-center gap-2 cursor-pointer group" title="Activar Relación II-V para Dominantes Secundarios">
                        <div class="relative">
                            <input type="checkbox" id="relacionToggle" class="sr-only">
                            <div class="toggle-track block bg-slate-300 w-8 h-5 rounded-full transition-colors dark:bg-slate-600"></div>
                            <div class="toggle-dot absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform shadow-sm"></div>
                        </div>
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider group-hover:text-emerald-500 dark:group-hover:text-emerald-400 transition-colors">II-V</span>
                    </label>

                    <div class="flex items-center gap-1 border-l border-slate-300 dark:border-slate-600 pl-3 ml-1">
                        <button id="mutePianoBtn" class="mute-btn bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 hover:bg-blue-200 h-8 px-2 rounded font-bold text-[10px] transition-all flex items-center gap-1" title="Mute Piano"><i class="fa-solid fa-keyboard"></i> Piano</button>
                        <button id="muteBassBtn" class="mute-btn bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 hover:bg-blue-200 h-8 px-2 rounded font-bold text-[10px] transition-all flex items-center gap-1" title="Mute Bajo"><i class="fa-solid fa-guitar"></i> Bajo</button>
                    </div>

                    <div class="flex items-center gap-1 border-l border-slate-300 dark:border-slate-600 pl-3">
                        <button id="playBtn" class="bg-blue-600 hover:bg-blue-500 text-white h-9 w-9 rounded-full flex items-center justify-center transition-colors shadow-lg shadow-blue-500/30">
                            <i class="fa-solid fa-play ml-0.5"></i>
                        </button>
                        <button id="stopBtn" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 h-9 w-9 rounded-full flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-stop"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="sm:hidden controls-grid">
                <div class="controls-full-width flex gap-1">
                    <div class="flex-1">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Progresión</label>
                        <select id="progressionSelectMobile" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none shadow-sm"></select>
                    </div>
                    <div id="variationContainerMobile" class="hidden flex-col min-w-[70px]">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Ver.</label>
                        <select id="variationSelectMobile" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                    </div>
                    <div class="flex-col w-14 shrink-0">
                        <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider">Tono</label>
                        <select id="keySelectMobile" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs rounded-lg border border-slate-300 dark:border-slate-600 focus:ring-blue-500 focus:border-blue-500 block w-full p-1 outline-none font-bold text-center shadow-sm"></select>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Tempo</span><span id="tempoValueMobile" class="text-blue-600 font-bold">120</span>
                    </label>
                    <input type="range" id="tempoSliderMobile" min="60" max="240" value="120" class="mt-0.5">
                </div>

                <div class="flex flex-col">
                    <label class="text-[9px] text-slate-500 mb-0.5 font-bold uppercase tracking-wider flex justify-between">
                        <span>Vol.</span><span id="volumeValueMobile" class="text-blue-600 dark:text-blue-400 font-bold">-6 dB</span>
                    </label>
                    <input type="range" id="volumeSliderMobile" min="-30" max="0" value="-6" step="1" class="mt-0.5">
                </div>

                <div class="toggles-row">
                    <div class="flex gap-2">
                        <label class="flex items-center gap-1 cursor-pointer group">
                            <div class="relative">
                                <input type="checkbox" id="romanToggleMobile" class="sr-only">
                                <div class="toggle-track block bg-slate-300 w-6 h-3.5 rounded-full transition-colors dark:bg-slate-600"></div>
                                <div class="toggle-dot absolute left-[2px] top-[2px] bg-white w-2.5 h-2.5 rounded-full transition transform shadow-sm"></div>
                            </div>
                            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">Weber</span>
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer group">
                            <div class="relative">
                                <input type="checkbox" id="globalTritoneToggleMobile" class="sr-only">
                                <div class="toggle-track block bg-slate-300 w-6 h-3.5 rounded-full transition-colors dark:bg-slate-600"></div>
                                <div class="toggle-dot absolute left-[2px] top-[2px] bg-white w-2.5 h-2.5 rounded-full transition transform shadow-sm"></div>
                            </div>
                            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">Tritono</span>
                        </label>
                        <label id="iivToggleContainerMobile" class="hidden items-center gap-1 cursor-pointer group">
                            <div class="relative">
                                <input type="checkbox" id="relacionToggleMobile" class="sr-only">
                                <div class="toggle-track block bg-slate-300 w-6 h-3.5 rounded-full transition-colors dark:bg-slate-600"></div>
                                <div class="toggle-dot absolute left-[2px] top-[2px] bg-white w-2.5 h-2.5 rounded-full transition transform shadow-sm"></div>
                            </div>
                            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">II-V</span>
                        </label>
                    </div>

                    <div class="flex gap-1 ml-1">
                        <button id="mutePianoBtnMobile" class="mute-btn bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 h-7 px-1.5 rounded font-bold text-[9px]"><i class="fa-solid fa-keyboard"></i></button>
                        <button id="muteBassBtnMobile" class="mute-btn bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 h-7 px-1.5 rounded font-bold text-[9px]"><i class="fa-solid fa-guitar"></i></button>
                    </div>

                    <div class="flex items-center gap-1 ml-auto">
                        <button id="playBtnMobile" class="bg-blue-600 hover:bg-blue-500 text-white h-7 w-7 rounded-full flex items-center justify-center transition-colors shadow-lg shadow-blue-500/30">
                            <i class="fa-solid fa-play text-xs ml-0.5"></i>
                        </button>
                        <button id="stopBtnMobile" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 h-7 w-7 rounded-full flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-stop text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Progresión Personalizada -->
            <div id="customInputContainer" class="hidden w-full mt-1 sm:mt-2 pt-1 sm:pt-2 border-t border-slate-200 dark:border-slate-700 pb-0.5 sm:pb-1">
                <div class="flex gap-1.5 sm:gap-2">
                    <input type="text" id="customProgInput" class="w-full bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-xs sm:text-sm font-mono p-1.5 sm:p-2 rounded-lg border border-blue-300 dark:border-blue-600 focus:ring-2 focus:ring-blue-500 outline-none shadow-inner placeholder-slate-400" placeholder="Ej: Cmaj7 | A7 | Dm7 | G7" value="Cmaj7 | A7 | Dm7 | G7">
                    <button id="insertPipeBtn" class="bg-blue-100 hover:bg-blue-200 text-blue-700 dark:bg-blue-900 dark:hover:bg-blue-800 dark:text-blue-300 px-2 sm:px-3 rounded-lg font-bold font-mono transition-colors border border-blue-200 dark:border-blue-700 shrink-0" title="Insertar Separador de Compás">|</button>
                </div>
                <p class="text-[8px] sm:text-[9px] text-slate-500 mt-0.5 sm:mt-1 pl-1">Separa cada compás con el símbolo de barra vertical ( | ). Usa notación estándar.</p>
            </div>
        </div>

        <div class="bg-blue-50 dark:bg-slate-800/80 px-2 py-1 border-b border-blue-100 dark:border-slate-700 flex items-center justify-between text-[10px] text-blue-700 dark:text-blue-400 font-medium z-10 relative shrink-0">
            <span class="truncate"><i class="fa-solid fa-circle-info mr-1"></i> Clic para iniciar.</span>
            
            <div class="flex items-center gap-2 mx-2">
                <div id="metronome-0" class="metronome-dot w-2 h-2 rounded-full bg-blue-200 dark:bg-slate-600"></div>
                <div id="metronome-1" class="metronome-dot w-2 h-2 rounded-full bg-blue-200 dark:bg-slate-600"></div>
                <div id="metronome-2" class="metronome-dot w-2 h-2 rounded-full bg-blue-200 dark:bg-slate-600"></div>
                <div id="metronome-3" class="metronome-dot w-2 h-2 rounded-full bg-blue-200 dark:bg-slate-600"></div>
            </div>

            <span id="startMeasureIndicator" class="font-bold whitespace-nowrap">Inicio: 1</span>
        </div>

        <!-- Contenedor del Gráfico -->
        <div id="coltraneGraphicContainer" class="hidden px-1 py-1 w-full justify-center shrink-0 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 overflow-hidden max-h-[170px] sm:max-h-[240px]">
            <div id="coltrane-graphic" class="w-full h-full flex justify-center items-center"></div>
        </div>

        <!-- Área Principal de Acordes -->
        <div class="p-1 sm:p-2 flex-1 overflow-y-auto custom-scrollbar relative bg-slate-50 dark:bg-slate-900 flex flex-col">
            <div id="chordGrid" class="grid grid-cols-4 gap-1 sm:gap-2 max-w-full flex-1 content-start pb-4"></div>
        </div>
    </div>

    <script>
        const progressionLibrary = [
            { id: "custom", name: "✏️ Prog. Personalizada...", baseKey: "C", variations: [
                [ { type: "A", color: "bg-amber-50 dark:bg-amber-900/20", repeat: false, data: "Cmaj7 | A7 | Dm7 | G7" } ]
            ]},

        const noteLetters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const baseSemitones = {'C':0, 'D':2, 'E':4, 'F':5, 'G':7, 'A':9, 'B':11};
        const allKeys = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        const tritoneRootMap = { 'C':'Gb', 'C#':'G', 'Db':'G', 'D':'Ab', 'D#':'A', 'Eb':'A', 'E':'Bb', 'F':'B', 'F#':'C', 'Gb':'C', 'G':'Db', 'G#':'D', 'Ab':'D', 'A':'Eb', 'A#':'E', 'Bb':'E', 'B':'F' };

        function getDisplayNote(noteStr, nodeId) {
            let n = noteStr.replace(/[0-9]/g, '');
            if (n === 'D#') n = 'Eb'; if (n === 'A#') n = 'Bb'; if (n === 'G#') n = 'Ab';
            if (window.svgEnharmonicOverrides && window.svgEnharmonicOverrides[nodeId]) {

            }

        }

        const cualidades = {
            "maj7": [0, 4, 7, 11], "m7": [0, 3, 7, 10], "7": [0, 4, 7, 10],
            "7(b9)": [0, 4, 7, 10, 13], "m7(b5)": [0, 3, 6, 10], "dim7": [0, 3, 6, 9],
            "o7": [0, 3, 6, 9], "maj": [0, 4, 7], "m": [0, 3, 7], "6": [0, 4, 7, 9], "m6": [0, 3, 7, 9], "aug": [0, 4, 8]
        };

        function parseNoteObj(noteStr) {
            const letter = noteStr.charAt(0);
            let accidental = 0;
            for (let i = 1; i < noteStr.length; i++) {
                if (noteStr[i] === '#') accidental++;
                if (noteStr[i] === 'b') accidental--;
            }
            return { letter, accidental, semitone: (baseSemitones[letter] + accidental + 12) % 12 };
        }

        function getTranspositionOffsets(baseKeyStr, targetKeyStr) {
            const base = parseNoteObj(baseKeyStr); const target = parseNoteObj(targetKeyStr);
            let stOffset = target.semitone - base.semitone; let letterOffset = noteLetters.indexOf(target.letter) - noteLetters.indexOf(base.letter);
            if (stOffset < 0) stOffset += 12; if (letterOffset < 0) letterOffset += 7;
            return { stOffset, letterOffset };
        }

        function transposeRoot(rootStr, stOffset, letterOffset) {
            const parsed = parseNoteObj(rootStr);
            const newLetterIdx = (noteLetters.indexOf(parsed.letter) + letterOffset + 7) % 7;
            const newLetter = noteLetters[newLetterIdx];
            const targetSemitone = (parsed.semitone + stOffset + 120) % 12; 
            let accidentalNeeded = targetSemitone - baseSemitones[newLetter];
            if (accidentalNeeded > 6) accidentalNeeded -= 12; if (accidentalNeeded < -6) accidentalNeeded += 12;
            let result = newLetter;
            if (accidentalNeeded > 0) result += '#'.repeat(accidentalNeeded);
            if (accidentalNeeded < 0) result += 'b'.repeat(-accidentalNeeded);
            return result;
        }

        function transposeChordName(chordStr, stOffset, letterOffset) {
            if (chordStr === "NC" || chordStr === "-") return chordStr;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1]; let quality = match[2];
            const newRoot = transposeRoot(root, stOffset, letterOffset);
            if (quality.includes('/')) {
                const qParts = quality.split('/');
                quality = qParts[0] + '/' + transposeRoot(qParts[1], stOffset, letterOffset);
            }
            return newRoot + quality;
        }

        function convertToRoman(chordStr, keyStr) {
            if (chordStr === "NC" || chordStr === "-") return chordStr;
            
            const progIndex = progressionSelect.value;
            const progData = progressionLibrary[progIndex];
            
            let selectedVar = variationSelect && variationSelect.value !== "" ? parseInt(variationSelect.value) : 0;
            if (isNaN(selectedVar)) selectedVar = 0;

            let cleanStr = chordStr.replace(/_SUB|_BKT/g, '').replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '');
            const isSubbed = chordStr.includes('_SUB');
            
            if (progData.id === "custom") return cleanStr;
            if (progData.id === "multitonic-coltrane") return cleanStr;

            // BLUES EXCEPTION: En blues básico (versión 0), I7 y IV7 no son dominantes secundarios.
            if (progData.id === "blues") {
                if (selectedVar === 0) {
                    const match = cleanStr.match(/^([A-G][#b]*)(.*)$/);
                    if (match) {
                        let root = match[1];
                        let { stOffset } = getTranspositionOffsets(keyStr, root);
                        let originalOffset = isSubbed ? (stOffset + 6) % 12 : stOffset;

                        if (originalOffset === 7) return isSubbed ? `subV7/I` : `V7`;

            }

            if (chordStr.includes('_IIV')) return chordStr.includes('m7(b5)') ? "IIm7(b5)" : "IIm7";

            if (chordStr.includes('_SEC4')) return isSubbed ? "subV7/IV" : "V7/IV";

            if (chordStr.includes('_SEC6')) return isSubbed ? "subV7/VI" : "V7/VI";

            const match = cleanStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return cleanStr;
            
            const root = match[1];
            let quality = match[2];
            let cleanQual = quality.split('/')[0];

            let { stOffset } = getTranspositionOffsets(keyStr, root);
            let originalOffset = isSubbed ? (stOffset + 6) % 12 : stOffset;

            if (progData.id === "251-maj-all") {
                if (cleanQual === "m7" || cleanQual === "m9") return "IIm7";
                if (cleanQual.startsWith("7") || cleanQual.startsWith("9") || cleanQual.startsWith("13")) return isSubbed ? "subV7" : "V7";
                if (cleanQual.startsWith("maj7") || cleanQual.startsWith("6")) return "Imaj7";
                return cleanStr;
            }

            if (progData.id === "251-min-all") {
                if (cleanQual === "m7(b5)") return "IIm7(b5)";
                if (cleanQual.startsWith("7") || cleanQual.startsWith("9") || cleanQual.startsWith("13")) return isSubbed ? "subV7" : "V7";
                if (cleanQual === "m7" || cleanQual === "m") return "Im7";
                return cleanStr;
            }

            let isDominantChord = (cleanQual.startsWith('7') || cleanQual.startsWith('9') || cleanQual.startsWith('13')) 
                && !cleanQual.includes('maj') && !cleanQual.includes('m') && !cleanQual.includes('dim') && !cleanQual.includes('o');

            if (isDominantChord) {
                let targetRoman = null;
                if (originalOffset === 0) targetRoman = "IV";
                else if (originalOffset === 2) targetRoman = "V";
                else if (originalOffset === 4) targetRoman = "VI";
                else if (originalOffset === 9) targetRoman = "II";
                else if (originalOffset === 11) targetRoman = "III";
                else if (originalOffset === 7) {

                    if (tension === "9" || tension === "13") tension = "";
                    return isSubbed ? `subV7${tension}` : `V7${tension}`;

                    let tension = cleanQual.replace('7', '');
                    if (tension === "9" || tension === "13") tension = "";
                    return isSubbed ? `subV7${tension}/${targetRoman}` : `V7${tension}/${targetRoman}`;
                }
            }

            let baseRoman = "";
            if (originalOffset === 0) baseRoman = "I";
            else if (originalOffset === 1) baseRoman = "bII";
            else if (originalOffset === 2) baseRoman = "II";
            else if (originalOffset === 3) baseRoman = "bIII";
            else if (originalOffset === 4) baseRoman = "III";
            else if (originalOffset === 5) baseRoman = "IV";
            else if (originalOffset === 6) {

                baseRoman = (cleanQual.includes('dim') || cleanQual.includes('o')) ? "#IV" : "bV";
            }
            else if (originalOffset === 7) baseRoman = "V";
            else if (originalOffset === 8) baseRoman = "bVI";
            else if (originalOffset === 9) baseRoman = "VI";
            else if (originalOffset === 10) baseRoman = "bVII";
            else if (originalOffset === 11) baseRoman = "VII";

            return baseRoman + quality;
        }

            let cleanChord = chordStr.replace(/_SUB|_BKT|_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '');
            let rootMatch = cleanChord.match(/^([A-G][#b]*)/);

            let rootStr = rootMatch[1]; let rest = cleanChord.substring(rootStr.length);

                    let d1 = Math.abs(c1 - prevCenter), d2 = Math.abs(c2 - prevCenter), d3 = Math.abs(c3 - prevCenter);
                    if (d1 <= d2 && d1 <= d3) return c1; if (d2 <= d1 && d2 <= d3) return c2; return c3;

        function isDominant(chordStr) {
            if (chordStr === "NC" || chordStr === "-") return false;
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return false;
            const mainQuality = match[2].split('/')[0].replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_BKT/g, '');
            return (mainQuality.startsWith('7') || mainQuality.startsWith('9') || mainQuality.startsWith('13')) 
                && !mainQuality.includes('maj') && !mainQuality.includes('m') && !mainQuality.includes('dim') && !mainQuality.includes('o');
        }

        function applyTritoneSub(chordStr) {
            const match = chordStr.match(/^([A-G][#b]*)(.*)$/);
            if (!match) return chordStr;
            const root = match[1]; let quality = match[2];
            if (quality.includes('/')) quality = quality.split('/')[0]; 
            return (tritoneRootMap[root] || root) + quality;
        }

        function loadAndCompileProgression(preserveOverrides = false) {
            if (!preserveOverrides) tritoneOverrides = {};
            const progIndex = progressionSelect.value || (document.getElementById('progressionSelectMobile') && document.getElementById('progressionSelectMobile').value) || 0;
            const targetKey = keySelect.value || (document.getElementById('keySelectMobile') && document.getElementById('keySelectMobile').value) || "C";
            const progData = progressionLibrary[progIndex];
            
            const vContainer = document.getElementById('variationContainer'); const vSelect = document.getElementById('variationSelect');
            const vContainerMobile = document.getElementById('variationContainerMobile'); const vSelectMobile = document.getElementById('variationSelectMobile');
            const customInputCont = document.getElementById('customInputContainer');

            // Lógica para mostrar el botón II-V SOLO en "Dominantes Secundarios"
            const iivContainer = document.getElementById('iivToggleContainer');
            const iivContainerMobile = document.getElementById('iivToggleContainerMobile');

            if (progData.id === "secondary-dominants") {
                if (iivContainer) { iivContainer.classList.remove('hidden'); iivContainer.classList.add('flex'); }
                if (iivContainerMobile) { iivContainerMobile.classList.remove('hidden'); iivContainerMobile.classList.add('flex'); }
            } else {
                if (iivContainer) { iivContainer.classList.add('hidden'); iivContainer.classList.remove('flex'); }
                if (iivContainerMobile) { iivContainerMobile.classList.add('hidden'); iivContainerMobile.classList.remove('flex'); }
                // Forzar apagado del interruptor y variable para no arrastrar errores
                relacionIIVActive = false;
                if(document.getElementById('relacionToggle')) document.getElementById('relacionToggle').checked = false;
                if(document.getElementById('relacionToggleMobile')) document.getElementById('relacionToggleMobile').checked = false;
            }

            if (progData.id === "custom") {
                if (vContainer) vContainer.classList.add('hidden'); if (vContainerMobile) vContainerMobile.classList.add('hidden');
                customInputCont.classList.remove('hidden'); customInputCont.classList.add('block');
            } else {
                customInputCont.classList.add('hidden'); customInputCont.classList.remove('block');
                if (progData.variations) {
                    if (vContainer) { vContainer.classList.remove('hidden'); vContainer.classList.add('flex'); }
                    if (vContainerMobile) { vContainerMobile.classList.remove('hidden'); vContainerMobile.classList.add('flex'); }
                    if (vSelect && vSelect.dataset.progId !== progData.id) {
                        vSelect.innerHTML = ''; if(vSelectMobile) vSelectMobile.innerHTML = '';
                        progData.variations.forEach((v, idx) => {
                            let label = (idx + 1).toString();
                            if (v[0].type && v[0].type !== "A" && v[0].type !== "B") label = v[0].type;
                            const opt = document.createElement('option'); opt.value = idx; opt.textContent = label; vSelect.appendChild(opt);
                            if(vSelectMobile) { const optM = document.createElement('option'); optM.value = idx; optM.textContent = label; vSelectMobile.appendChild(optM); }
                        });
                        if (vSelect) { vSelect.dataset.progId = progData.id; vSelect.value = 0; }
                        if (vSelectMobile) { vSelectMobile.dataset.progId = progData.id; vSelectMobile.value = 0; }
                    }
                }
            }

            if (!manualKeyChange) {
                if (keySelect) keySelect.value = progData.baseKey;
                if (document.getElementById('keySelectMobile')) document.getElementById('keySelectMobile').value = progData.baseKey;
            }
            manualKeyChange = false; 

            const currentKey = keySelect ? keySelect.value : (document.getElementById('keySelectMobile') ? document.getElementById('keySelectMobile').value : "C");
            const { stOffset, letterOffset } = getTranspositionOffsets(progData.baseKey, currentKey);
            
            let selectedVar = 0;
            if (vSelect && vSelect.value !== "") selectedVar = parseInt(vSelect.value);
            else if (vSelectMobile && vSelectMobile.value !== "") selectedVar = parseInt(vSelectMobile.value);
            if (isNaN(selectedVar)) selectedVar = 0;
            
            visualMeasures = []; audioTimeline = [];
            
            let variationData = [];
            if (progData.variations && progData.variations.length > 0) {
                if (selectedVar < 0 || selectedVar >= progData.variations.length) selectedVar = 0;
                variationData = progData.variations[selectedVar];
            }
            
            let activeSections = JSON.parse(JSON.stringify(variationData));
            
            if (progData.id === "secondary-dominants" && relacionIIVActive) {
                activeSections.forEach(sec => {
                    sec.data = sec.data.replace(/A7_SEC2/g, 'Em7(b5)_BKT_IIV A7_BKT_SEC2')
                                       .replace(/B7_SEC3/g, 'F#m7(b5)_BKT_IIV B7_BKT_SEC3')
                                       .replace(/C7_SEC4/g, 'Gm7_BKT_IIV C7_BKT_SEC4')
                                       .replace(/D7_SEC5/g, 'Am7_BKT_IIV D7_BKT_SEC5')
                                       .replace(/E7_SEC6/g, 'Bm7(b5)_BKT_IIV E7_BKT_SEC6');
                });
            }

            const coltraneContainer = document.getElementById('coltraneGraphicContainer');
            if (progData.id === "multitonic-coltrane") {
                if (coltraneContainer) coltraneContainer.classList.remove('hidden');
                renderColtraneGraphic(currentKey);
            } else {
                if (coltraneContainer) coltraneContainer.classList.add('hidden');
            }

            let audioUnrolledMeasures = []; let visualMap = []; let currentVisualIndex = 0;

            activeSections.forEach(sec => {
                const rawMeasures = sec.data.split('|').map(m => m.trim()).filter(m => m.length > 0);
                const transposedMeasures = rawMeasures.map((mStr, mIdx) => {
                    return mStr.split(/\s+/).map((c, cIdx) => {
                        let transposed = transposeChordName(c, stOffset, letterOffset);
                        let overrideKey = `${currentVisualIndex + mIdx}_${cIdx}`;
                        let isSubbed = globalTritone;
                        if (tritoneOverrides[overrideKey] !== undefined) isSubbed = tritoneOverrides[overrideKey];
                        if (isSubbed && isDominant(transposed)) transposed = applyTritoneSub(transposed) + "_SUB";
                        return transposed;
                    });
                });

                transposedMeasures.forEach((chords, mIdx) => {
                    visualMeasures.push({ id: currentVisualIndex + mIdx, chords: chords, colorClass: sec.color || 'bg-white dark:bg-slate-800', sectionName: mIdx === 0 && (sec.type === 'A' || sec.type === 'B') ? sec.type : null, hasRepeatStart: sec.repeat && mIdx === 0, hasRepeatEnd: sec.repeat && mIdx === transposedMeasures.length - 1 });
                });

                transposedMeasures.forEach((chords, idx) => { audioUnrolledMeasures.push(chords); visualMap.push(currentVisualIndex + idx); });
                if (sec.repeat) { transposedMeasures.forEach((chords, idx) => { audioUnrolledMeasures.push(chords); visualMap.push(currentVisualIndex + idx); }); }
                currentVisualIndex += transposedMeasures.length;
            });

            let prevMidiNotes = null;
            audioUnrolledMeasures.forEach((measureChords, measureIndex) => {
                let measureStartStep = measureIndex * 8;
                let nodesInMeasure = [];

                measureChords.forEach(chord => {
                    let tagMatch = chord.match(/_(T\d|V\d|II\d)/i);
                    if (tagMatch) nodesInMeasure.push(tagMatch[1].toLowerCase());
                });

                measureChords.forEach((chord, chordIdx) => {
                    if (chord === "NC" || chord === "-") return;
                    let chordsInMeasure = measureChords.length;
                    
                    let specificNodeMatch = chord.match(/_(T\d|V\d|II\d)/i);
                    let specificNodeId = specificNodeMatch ? specificNodeMatch[1].toLowerCase() : null;
                    
                    let notesData = computeNextVoicing(chord, prevMidiNotes);
                    prevMidiNotes = notesData.midi; 
                    
                    let stepOffset = (chordIdx * 4); 
                    let duration = chordsInMeasure === 2 ? "2n" : (chordsInMeasure === 4 ? "4n" : "1m");
                    let trimDuration = Tone.Time(duration).toSeconds() - 0.05;

                    audioTimeline[measureStartStep + stepOffset] = {
                        notes: notesData.toneNames, bass: notesData.bassNote, duration: trimDuration > 0 ? trimDuration : duration,
                        visualId: visualMap[measureIndex], 
                        svgNodeIds: specificNodeId ? [specificNodeId] : []
                    };
                    if (chordsInMeasure === 2 && chordIdx === 0) audioTimeline[measureStartStep + 4] = null;
                });
            });

            totalSteps = audioUnrolledMeasures.length * 8;
            if (selectedStartMeasure >= visualMeasures.length) selectedStartMeasure = 0;
            renderGrid(); updateStartMeasureLabel();
        }

        function renderGrid() {
            const grid = document.getElementById('chordGrid'); if(!grid) return; grid.innerHTML = '';
            const targetKey = keySelect.value || (document.getElementById('keySelectMobile') && document.getElementById('keySelectMobile').value) || "C";
            
            // Densidad Inteligente para pantallas pequeñas (activar si hay >= 16 compases)
            if (visualMeasures.length >= 16) {
                grid.classList.add('dense-grid');
            } else {
                grid.classList.remove('dense-grid');
            }

            visualMeasures.forEach((vMeasure, index) => {
                const measureDiv = document.createElement('div'); measureDiv.id = `measure-${vMeasure.id}`;
                let classNames = `measure-box ${vMeasure.colorClass} border border-slate-300 dark:border-slate-600 sm:rounded-xl rounded relative overflow-hidden`;
                if (vMeasure.hasRepeatStart) classNames += ' repeat-start text-blue-600';
                if (vMeasure.hasRepeatEnd) classNames += ' repeat-end text-blue-600';
                if (index === selectedStartMeasure) classNames += ' ring-2 ring-blue-500 bg-blue-50/40 dark:bg-blue-900/40';
                measureDiv.className = classNames;
                
                // Alineado top-left para que NUNCA tape el acorde
                let rehearsalMarkHTML = '';
                if (vMeasure.sectionName) rehearsalMarkHTML = `<div class="absolute top-0 left-0 text-[10px] sm:text-[11px] font-bold text-white bg-blue-500 px-1.5 py-0.5 rounded-br-lg shadow-sm z-10 tracking-wider">${vMeasure.sectionName}</div>`;

                const processChord = (c, chordIdx, vMeasureId) => {
                    let color = "text-slate-800 dark:text-slate-100"; let isSubbed = c.includes('_SUB');
                    let rawChord = c; let cleanC = c.replace(/_T\d|_V\d|_II\d|_SEC\d|_IIV/g, '').replace(/_SUB|_BKT/g, '');
                    let isDom = isSubbed || isDominant(cleanC);
                    let text = romanMode ? convertToRoman(rawChord, targetKey) : cleanC;

                    if (isSubbed) color = "text-amber-500 dark:text-amber-400 font-bold border-b-2 border-amber-500 border-dashed is-subbed is-dominant";
                    else if (c.includes('_T1')) color = "text-blue-500 font-black"; 
                    else if (c.includes('_T2')) color = "text-red-500 font-black"; 
                    else if (c.includes('_T3')) color = "text-amber-500 font-black"; 
                    else if (isDom) color += " is-dominant";

                    let intClasses = "pointer-events-auto "; let tooltip = "";
                    if (isDom) { intClasses += "cursor-pointer hover:text-amber-500 dark:hover:text-amber-400 transition-colors relative z-20"; tooltip = 'title="Clic para alternar Sustituto Tritonal"'; }
                    return `<span class="chord-text text-sm sm:text-base md:text-xl lg:text-3xl font-bold tracking-tight ${color} ${intClasses}" data-mid="${vMeasureId}" data-cid="${chordIdx}" ${tooltip}>${text}</span>`;
                };

                let measureChordsHTML = '';
                let inBracket = false;
                vMeasure.chords.forEach((c, i) => {
                    let isBkt = c.includes('_BKT');
                    if (isBkt && !inBracket) {
                        measureChordsHTML += `<div class="ii-v-bracket flex items-center justify-center gap-1 sm:gap-2 px-1">`;
                        inBracket = true;
                    } else if (!isBkt && inBracket) {
                        measureChordsHTML += `</div>`;
                        inBracket = false;
                    }
                    measureChordsHTML += processChord(c, i, index);
                    if (isBkt && i === vMeasure.chords.length - 1) {
                        measureChordsHTML += `</div>`;
                    }
                });
                
                measureDiv.innerHTML = `
                    <div class="absolute top-0 right-1 text-[9px] sm:text-[10px] text-slate-400 font-mono z-10">${index + 1}</div>
                    ${rehearsalMarkHTML}
                    <div class="flex flex-row items-center justify-center gap-2 sm:gap-3 w-full h-full whitespace-nowrap px-1 pt-4 pb-1">
                        ${measureChordsHTML}
                    </div>
                `;
                measureDiv.dataset.index = index; grid.appendChild(measureDiv);
            });
        }

        function updateStartMeasureLabel() { const ind = document.getElementById('startMeasureIndicator'); if (ind) ind.textContent = `Inicio: ${selectedStartMeasure + 1}`; }

        function highlightMeasure(visualId) {
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            const activeEl = document.getElementById(`measure-${visualId}`);
            if (activeEl) activeEl.classList.add('measure-active');
        }

        function highlightSvgNode(nodeIdsArray) {
            document.querySelectorAll('.coltrane-node').forEach(el => el.classList.remove('active-node'));
            if (nodeIdsArray && nodeIdsArray.length > 0) { 
                nodeIdsArray.forEach(nodeId => {
                    const activeNode = document.getElementById(`svg-node-${nodeId}`); 
                    if (activeNode) activeNode.classList.add('active-node'); 
                });
            }
        }

        function updateMetronome(beatIndex) {
            document.querySelectorAll('.metronome-dot').forEach((dot, index) => {
                dot.classList.remove('active', 'active-beat1');
                if (index === beatIndex) {
                    dot.classList.add('active');
                    if (beatIndex === 0) dot.classList.add('active-beat1');
                }
            });
        }
        function resetMetronome() { document.querySelectorAll('.metronome-dot').forEach(dot => dot.classList.remove('active', 'active-beat1')); }

        let piano, bassSynth; let isPlaying = false; let step = 0; let audioInitialized = false;

        async function initAudio() {
            if (audioInitialized) return; await Tone.start();
            const chorus = new Tone.Chorus({ frequency: 2, delayTime: 3.5, depth: 0.3 }).start();
            const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 }); reverb.wet.value = 0.2;
            
            piano = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 2, modulationIndex: 1.2, oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.05 } });
            bassSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.04, decay: 0.4, sustain: 0.3, release: 0.05 } });
            piano.chain(chorus, reverb, Tone.Destination); bassSynth.toDestination();
            Tone.Destination.volume.value = parseFloat(document.getElementById('volumeSlider') ? document.getElementById('volumeSlider').value : -6);

            Tone.Transport.scheduleRepeat((time) => {
                const currentStep = step % totalSteps; 
                const event = audioTimeline[currentStep];
                
                if (currentStep % 2 === 0) {
                    let beatIdx = (currentStep % 8) / 2;
                    Tone.Draw.schedule(() => updateMetronome(beatIdx), time);
                }

                if (currentStep % 8 === 0) {
                    let cMe = audioTimeline[currentStep];
                    if (cMe) Tone.Draw.schedule(() => highlightMeasure(cMe.visualId), time);
                }

                if (event !== undefined) {
                    if (event && event.svgNodeIds) Tone.Draw.schedule(() => highlightSvgNode(event.svgNodeIds), time);
                    else if (event !== null) Tone.Draw.schedule(() => highlightSvgNode([]), time);
                    
                    if (event !== null) {
                        if (!isPianoMuted) piano.triggerAttackRelease(event.notes, event.duration, time);
                        if (!isBassMuted) bassSynth.triggerAttackRelease(event.bass, event.duration, time);
                    }
                }
                step++;
            }, "8n");
            Tone.Transport.bpm.value = parseInt(document.getElementById('tempoSlider') ? document.getElementById('tempoSlider').value : 120);
            audioInitialized = true;
        }

        const progressionSelect = document.getElementById('progressionSelect'); const progressionSelectMobile = document.getElementById('progressionSelectMobile');
        const keySelect = document.getElementById('keySelect'); const keySelectMobile = document.getElementById('keySelectMobile');
        const htmlElement = document.documentElement;

        progressionLibrary.forEach((prog, index) => {
            const option = document.createElement('option'); option.value = index; option.textContent = prog.name;

            document.querySelectorAll('#themeToggleBtn').forEach(btn => {
                if(btn) btn.innerHTML = isDark ? '<i class="fa-solid fa-sun text-lg"></i>' : '<i class="fa-solid fa-moon text-lg"></i>';
            });
        }
        document.querySelectorAll('#themeToggleBtn').forEach(btn => btn.addEventListener('click', toggleTheme));

        function updatePlayButtons(playing) {
            const playHtml = '<i class="fa-solid fa-play ml-0.5"></i>'; const pauseHtml = '<i class="fa-solid fa-pause"></i>';
            const playClasses = ['bg-blue-600', 'hover:bg-blue-500']; const pauseClasses = ['bg-amber-500', 'hover:bg-amber-400'];
            [document.getElementById('playBtn'), document.getElementById('playBtnMobile')].forEach(btn => {
                if(!btn) return;
                if(playing) { btn.innerHTML = pauseHtml; btn.classList.remove(...playClasses); btn.classList.add(...pauseClasses); } 
                else { btn.innerHTML = playHtml; btn.classList.remove(...pauseClasses); btn.classList.add(...playClasses); }
            });
        }

        async function playProgression() {
            if (!audioInitialized) await initAudio();
            if (Tone.context.state !== 'running') await Tone.context.resume();
            if (!isPlaying) { step = selectedStartMeasure * 8; Tone.Transport.position = 0; Tone.Transport.start(); isPlaying = true; updatePlayButtons(true); } 
            else { Tone.Transport.pause(); isPlaying = false; if (piano && piano.releaseAll) piano.releaseAll(); if (bassSynth && bassSynth.triggerRelease) bassSynth.triggerRelease(Tone.now()); updatePlayButtons(false); }
        }

        function stopProgression() {
            if (audioInitialized) { Tone.Transport.pause(); piano.releaseAll(); bassSynth.triggerRelease(Tone.now()); }
            isPlaying = false; step = selectedStartMeasure * 8; resetMetronome();
            document.querySelectorAll('.measure-box').forEach(el => el.classList.remove('measure-active'));
            highlightSvgNode([]); updatePlayButtons(false);
        }

        ['playBtn', 'playBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', playProgression));
        ['stopBtn', 'stopBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', stopProgression));

        function toggleMute(type, id1, id2) {
            const isMuted = type === 'piano' ? !isPianoMuted : !isBassMuted;
            if (type === 'piano') isPianoMuted = isMuted; else isBassMuted = isMuted;
            [document.getElementById(id1), document.getElementById(id2)].forEach(btn => {
                if (btn) { if (isMuted) btn.classList.add('muted'); else btn.classList.remove('muted'); }
            });
        }
        ['mutePianoBtn', 'mutePianoBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', () => toggleMute('piano', 'mutePianoBtn', 'mutePianoBtnMobile')));
        ['muteBassBtn', 'muteBassBtnMobile'].forEach(id => document.getElementById(id)?.addEventListener('click', () => toggleMute('bass', 'muteBassBtn', 'muteBassBtnMobile')));

        function syncSelects(id1, id2, value) { document.getElementById(id1).value = value; if(document.getElementById(id2)) document.getElementById(id2).value = value; }
        
        ['tempoSlider', 'tempoSliderMobile'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => {
            document.getElementById('tempoValue').textContent = e.target.value; document.getElementById('tempoValueMobile').textContent = e.target.value;
            syncSelects('tempoSlider', 'tempoSliderMobile', e.target.value); if (audioInitialized) Tone.Transport.bpm.value = e.target.value;
        }));

        ['volumeSlider', 'volumeSliderMobile'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => {
            document.getElementById('volumeValue').textContent = `${e.target.value} dB`; document.getElementById('volumeValueMobile').textContent = `${e.target.value} dB`;
            syncSelects('volumeSlider', 'volumeSliderMobile', e.target.value); if (audioInitialized) Tone.Destination.volume.value = parseFloat(e.target.value);
        }));

        ['progressionSelect', 'progressionSelectMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            syncSelects('progressionSelect', 'progressionSelectMobile', e.target.value); manualKeyChange = false; const was = isPlaying; stopProgression(); selectedStartMeasure = 0; loadAndCompileProgression(); if(was) setTimeout(() => playProgression(), 50);
        }));

        ['variationSelect', 'variationSelectMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            syncSelects('variationSelect', 'variationSelectMobile', e.target.value); 
            const was = isPlaying; 
            stopProgression(); 
            selectedStartMeasure = 0; 
            loadAndCompileProgression(); 
            if(was) setTimeout(() => playProgression(), 50);
        }));

        ['keySelect', 'keySelectMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            syncSelects('keySelect', 'keySelectMobile', e.target.value); manualKeyChange = true; const was = isPlaying; stopProgression(); loadAndCompileProgression(); if(was) setTimeout(() => playProgression(), 50);
        }));

        ['globalTritoneToggle', 'globalTritoneToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            globalTritone = e.target.checked; document.getElementById('globalTritoneToggle').checked = globalTritone; document.getElementById('globalTritoneToggleMobile').checked = globalTritone; loadAndCompileProgression(true);
        }));

        ['relacionToggle', 'relacionToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            relacionIIVActive = e.target.checked; document.getElementById('relacionToggle').checked = relacionIIVActive; if(document.getElementById('relacionToggleMobile')) document.getElementById('relacionToggleMobile').checked = relacionIIVActive; loadAndCompileProgression(true);
        }));

        ['romanToggle', 'romanToggleMobile'].forEach(id => document.getElementById(id)?.addEventListener('change', (e) => {
            romanMode = e.target.checked; document.getElementById('romanToggle').checked = romanMode; document.getElementById('romanToggleMobile').checked = romanMode; renderGrid(); 
        }));

        function debounce(func, wait) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); }; }
        const handleCustomInput = debounce((val) => {
            const customProg = progressionLibrary.find(p => p.id === "custom");
            customProg.variations[0][0].data = val.trim() === "" ? "Cmaj7" : val;
            const wasPlaying = isPlaying; if (wasPlaying) stopProgression();
            selectedStartMeasure = 0; loadAndCompileProgression(); if (wasPlaying) setTimeout(() => playProgression(), 50);
        }, 800);
        document.getElementById('customProgInput')?.addEventListener('input', (e) => handleCustomInput(e.target.value));

        document.getElementById('insertPipeBtn')?.addEventListener('click', () => {
            const input = document.getElementById('customProgInput');
            if (input) {
                const start = input.selectionStart;
                const end = input.selectionEnd;
                const text = input.value;
                const before = text.substring(0, start);
                const after = text.substring(end);
                
                let insertText = "|";
                if (before.length > 0 && !before.endsWith(" ")) insertText = " " + insertText;
                if (!after.startsWith(" ")) insertText = insertText + " ";
                
                input.value = before + insertText + after;
                input.selectionStart = input.selectionEnd = start + insertText.length;
                input.focus();
                handleCustomInput(input.value);
            }
        });

        document.getElementById('chordGrid')?.addEventListener('click', (e) => {
            const chordEl = e.target.closest('.chord-text');
            if (chordEl && chordEl.classList.contains('is-dominant')) {
                e.stopPropagation(); tritoneOverrides[`${chordEl.dataset.mid}_${chordEl.dataset.cid}`] = !chordEl.classList.contains('is-subbed'); loadAndCompileProgression(true);
            } else {
                const measureBox = e.target.closest('.measure-box');
                if (measureBox) { selectedStartMeasure = parseInt(measureBox.dataset.index); renderGrid(); updateStartMeasureLabel(); }
            }
        });

        // Initialize App
        loadAndCompileProgression();
    </script>
</body>
</html>
